  .raio150 .n { font: 500 58px/1 var(--font-display); font-variation-settings: 'opsz' 40; letter-spacing: -0.03em; color: var(--ink-primary); }

<body>
<div id="c">
  <div class="grade"></div>
  <svg class="camada" id="mundo" viewBox="0 0 1920 1080">
    <defs>

      <clipPath id="revela"><path id="revela-p" d="M0 0Z" /></clipPath>
      <!-- faixas dos bairros vizinhos (B5): as quadras dentro delas ficam mais claras -->

      <pattern id="hachura" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">

    </defs>

  <!-- os volumes da cidade num canvas: milhares de faces sem o custo do DOM do SVG (modo ao vivo) -->

  <svg class="camada" id="mundo2" viewBox="0 0 1920 1080">
    <defs><clipPath id="moldura2"><path id="moldura2-p" d="M-10 -10H1930V1090H-10Z" /></clipPath></defs>

<script type="module">
import { clamp, lerp, invLerp, smooth, sp, spring, track, swap, pending, press, project, roundedQuad, rectPts, lerpPt, PRESETS as P } from '../lib/motion.js';
import { criarCidade, desenharChao, pintarVolumes, pintarPrisma, prisma, posicaoCamera, circuloChao, PALETAS, misturarPaleta } from '../lib/cidade.js';
import { REGISTRO, LOTE, BAIRRO, IMOVEL } from './dados.js';

// ---------------------------------------------------------------------------
// Linha do tempo (roteiro de 18/10/2026: 53 palavras, cerca de 14,0 s a 3,8 palavras/s, uma
// palavra a cada 0,264 s). A cena corre contínua no ritmo da fala; cada evento fica preso à
// palavra de sentido:
//   B1 0,00 «Da porta para fora, nós avaliamos o entorno para a sua rotina:» ("entorno" 1,85)
//   B2 3,17 «mostramos se há alvará de obra ou demolição próximo ao imóvel,» ("alvará" 3,96)
//   B3 6,07 «se a rua sofre com alagamentos,» ("rua" 6,60; "alagamentos" 7,39)
//   B4 7,66 «se o apê vira uma ilha de calor,» ("ilha de calor" 8,98)
//   B5 9,77 «como está a segurança no bairro» ("segurança" 10,56)
//   B6 11,35 «e o custo de vida estimado em torno do local.» ("custo" 11,88; "em torno do local" 12,94)
// Os HOLD ficam nos fins de frase (vírgulas) e são pontos de corte: o quadro fica parado
// (TRAVA s antes de cada um, ver tempo()). Entre B5 e B6 não há vírgula, e não há HOLD. A saída
// (o mapa encolhe até o anel) cai em «do local» e termina 0,7 s depois da fala.
// ---------------------------------------------------------------------------
const DUR = 14.7;
const T = {
  // B1 · a câmera sobe pela fachada e a cidade sobe a partir do lote; o contorno do lote engrossa
  cam1: 0.12, revela: 0.18, lote: 0.32, barra: 1.2,
  // B2 · obras e demolições: raio de 150 m a partir da janela (câmera, haste e varredura se sobrepõem)
  b2: 3.17, janela: 3.27, haste: 3.42, clique0: 3.52, varre: 3.67, painel1: 3.87, pilula: 4.52,
  // B3 · alagamento
  b3: 6.07, cam3: 6.17, clique1: 6.4, painel2: 6.5, contorno: 6.5, interroga: 6.9,
  // B4 · calor
  b4: 7.66, cam4: 7.76, clique2: 7.98, painel3: 8.12,
  // B5 · segurança no bairro: a cidade se assenta no papel enquanto a câmera sobe
  b5: 9.62, cam5: 9.64, afunda: 9.66, clique3: 9.96, painel4: 10.0, faixas: 10.0, voo: 10.28,
  // B6 · custo de vida: a câmera desce e a cidade sobe de novo a partir do lote
  b6: 11.8, cam6: 11.82, clique4: 11.92, sobe6: 12.0, painel5: 12.04,
  // saída: a cidade se assenta, o mapa encolhe e o anel vira selo vazio
  saida: 13.3, selo: 13.36, esvazia: 14.16,
};
const HOLDS = [T.b2 - 0.03, T.b3 - 0.03, T.b4 - 0.03, T.b5 - 0.03, T.saida - 0.03];
// Em cada HOLD o quadro fica parado nos últimos TRAVA s; tudo o que se move assenta exato antes de
// PRAZO(h) (câmera, cidade, varredura e contorno com molaAte), e o quadro do HOLD é o mesmo de
// TRAVA s antes: a cena fica parada de fato por 0,23 s em cada HOLD.
const TRAVA = 0.15;
const PRAZO = (h) => h - TRAVA - 0.08;
const ESTADOS = [
  { id: 'S0', nome: 'Lote com o pino (fim da cena 6)', t: 0 },
  { id: 'M1', nome: 'Câmera sobe; quadras sobem', t: 0.85 },
  { id: 'B1', nome: 'Cidade e barra Explore o entorno', t: HOLDS[0] },
  { id: 'M2', nome: 'Toque em Obras; haste varre o raio', t: 4.1 },
  { id: 'B2', nome: 'Obras: 4 demolições perto', t: HOLDS[1] },
  { id: 'M3', nome: 'Painel vira ficha; toque em Alagamento', t: T.clique1 },
  { id: 'B3', nome: 'Alagamento: rua e garagem', t: HOLDS[2] },
  { id: 'M4', nome: 'Toque em Calor; régua entra', t: 8.3 },
  { id: 'B4', nome: 'Calor: +6 °C', t: HOLDS[3] },
  { id: 'M5', nome: 'Câmera sobe; a cidade se assenta', t: 10.0 },
  { id: 'M5b', nome: 'Faixas norte → sul viram barras', t: 10.62 },
  { id: 'M5c', nome: 'Segurança: barras assentadas', t: 11.74 },
  { id: 'M6', nome: 'Câmera desce; toque em Custo de vida', t: 12.2 },
  { id: 'B6', nome: 'Custo de vida e as fichas', t: HOLDS[4] },
  { id: 'M7', nome: 'Mapa encolhe com o anel', t: 13.85 },
  { id: 'FIM', nome: 'Anel vazio (primeiro quadro da cena 8)', t: DUR - 1 / 30 },
];

// ---------------------------------------------------------------------------
// Câmera de mundo (project de motion.js). Começa na câmera S3 do POC-01 (CAM.lote).
// ---------------------------------------------------------------------------
const FOCAL = 9000;
const CAM = {
  lote: { cx: 820, cy: 640, s: 9.5, yaw: -0.42, pitch: 0.98 },
  cidade: { cx: 800, cy: 704, s: 4.6, yaw: -0.34, pitch: 0.88 },
  raio: { cx: 700, cy: 618, s: 2.2, yaw: -0.22, pitch: 0.55 },
  rua: { cx: 830, cy: 590, s: 3.3, yaw: -0.10, pitch: 0.24 },
  quadra: { cx: 800, cy: 600, s: 2.7, yaw: -0.10, pitch: 0.30 },
  // o bairro a 1 px/m: a cidade já se assentou no papel, então o plano é um mapa de quadras
  bairro: { cx: 660, cy: 712, s: 1.0, yaw: 0, pitch: 0.30 },
  rotina: { cx: 760, cy: 650, s: 1.5, yaw: -0.16, pitch: 0.42 },
  selo: { cx: 960, cy: 540, s: 0.40, yaw: 0, pitch: 0 },
};
const SUBIDA = { k: 12, d: 6.93 };   // zeta 1: a câmera sobe pela fachada, assenta em ~1,7 s
// Mola que chega exata ao alvo num prazo (fim, contado do começo dela): até perto do prazo é a
// mola de sempre; na janela final o resto (poucos por cento) se desfaz suave. Assim o quadro do
// HOLD fica parado de fato, sem acelerar o movimento.
function molaAte(u, p, fim) {
  const f = spring(u, p.k, p.d);
  if (!(fim < Infinity)) return f;
  const w = Math.min(0.45, Math.max(0.12, fim * 0.5));
  return lerp(f, 1, smooth(invLerp(fim - w, fim, u)));
}
// todas as outras mudanças de câmera usam P.camera (zeta 1, assenta em cerca de 1,2 s): calma.
// O quarto valor de cada chave é o prazo para chegar (o HOLD seguinte).
const CAM_KEYS = [[0, CAM.lote], [T.cam1, CAM.cidade, SUBIDA, PRAZO(HOLDS[0])], [T.b2, CAM.raio, P.camera, PRAZO(HOLDS[1])], [T.cam3, CAM.rua, P.camera, PRAZO(HOLDS[2])], [T.cam4, CAM.quadra, P.camera, PRAZO(HOLDS[3])], [T.cam5, CAM.bairro], [T.cam6, CAM.rotina, P.camera, PRAZO(HOLDS[4])], [T.selo, CAM.selo]];
// A câmera é arredondada (0,05 px, 1e-5 rad e 1e-5 em log s): abaixo disso o quadro não muda, e o
// desenho da cidade pode ser reaproveitado entre quadros iguais (o resultado continua função de t).
const q = (v, u) => Math.round(v / u) * u;
function trackAte(t, keys) {
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i += 1) {
    const [tk, alvo, p = P.camera, prazo = Infinity] = keys[i];
    v += (alvo - keys[i - 1][1]) * molaAte(t - tk, p, prazo - tk);
  }
  return v;
}
function cameraMola(t) {
  const out = { focal: FOCAL };
  for (const c of ['cx', 'cy', 'yaw', 'pitch']) out[c] = trackAte(t, CAM_KEYS.map(([tk, v, p, z]) => [tk, v[c], p, z]));
  out.cx = q(out.cx, 0.05); out.cy = q(out.cy, 0.05); out.yaw = q(out.yaw, 1e-5); out.pitch = q(out.pitch, 1e-5);
  out.s = Math.exp(q(trackAte(t, CAM_KEYS.map(([tk, v, p, z]) => [tk, Math.log(v.s), p, z])), 1e-5));
  return out;
}
// Emenda com a cena 8: ela redesenha o anel com a câmera da versão anterior desta cena em
// t = 25,4 s (cena08.html, KEYS7 e camera7(DUR7)). A câmera final é essa mesma, calculada aqui com
// as chaves antigas e a mesma conta, para o anel sair idêntico. A mola do selo ainda anda cerca de
// 0,3 px por quadro no fim, então de selo + 1,04 s até DUR - 0,05 s o resto se desfaz suave, e dali
// em diante a câmera é a final: o último quadro gravado (DUR - 1/30) e o de DUR saem iguais ao
// primeiro da cena 8.
const KEYS_CENA8 = [[0, CAM.lote], [0.12, CAM.cidade, SUBIDA], [4.8, CAM.raio], [12.45, CAM.rua], [14.5, CAM.quadra], [17.62, CAM.bairro], [20.05, CAM.rotina], [24.06, CAM.selo]];
const CAM_FIM = (() => {
  const t = 25.4, out = { focal: FOCAL };
  for (const c of ['cx', 'cy', 'yaw', 'pitch']) out[c] = track(t, KEYS_CENA8.map(([tk, v, p]) => [tk, v[c], p]), P.camera);
  out.cx = q(out.cx, 0.05); out.cy = q(out.cy, 0.05); out.yaw = q(out.yaw, 1e-5); out.pitch = q(out.pitch, 1e-5);
  out.s = Math.exp(q(track(t, KEYS_CENA8.map(([tk, v, p]) => [tk, Math.log(v.s), p]), P.camera), 1e-5));
  return out;
})();
const ASSENTA_FIM = [T.selo + 1.04, DUR - 0.05];
function camera(t) {
  const u = invLerp(ASSENTA_FIM[0], ASSENTA_FIM[1], t), fim = u * u * (3 - 2 * u);
  if (fim >= 1) return { ...CAM_FIM };
  const out = cameraMola(t);
  if (fim <= 0) return out;
  out.cx = q(lerp(out.cx, CAM_FIM.cx, fim), 0.05); out.cy = q(lerp(out.cy, CAM_FIM.cy, fim), 0.05);
  out.yaw = q(lerp(out.yaw, CAM_FIM.yaw, fim), 1e-5); out.pitch = q(lerp(out.pitch, CAM_FIM.pitch, fim), 1e-5);
  out.s = Math.exp(q(lerp(Math.log(out.s), Math.log(CAM_FIM.s), fim), 1e-5));
  return out;
}

// ---------------------------------------------------------------------------
// Cidade: a mesma grade do POC-01 em volta do lote.
// ---------------------------------------------------------------------------
const LOTE_PTS = [[-LOTE.fundo / 2, -LOTE.frente / 2], [LOTE.fundo / 2, -LOTE.frente / 2], [LOTE.fundo / 2, LOTE.frente / 2], [-LOTE.fundo / 2, LOTE.frente / 2]];
const VIZINHOS = [[-20, -43, 20, -16], [-20, 16, 20, 43], [20, -43, 55, 0], [20, 0, 55, 43], [55, -43, 90, 0], [55, 0, 90, 43]];
const PREDIO = { x0: -14, y0: -11, x1: 14, y1: 11, h: LOTE.pavimentos * 3 };
// a janela fica na face sul, a que a câmera vê em todos os planos
const JANELA = { y: PREDIO.y1, x0: -5, x1: 5, z0: 21, z1: 26 };
const cidade = criarCidade({
  semente: 327,
  longe: false,
  reservados: [{ x0: -20, y0: -16, x1: 20, y1: 16 }],
  lotes: (i, j) => (i === 0 && j === 0 ? VIZINHOS.map(([x0, y0, x1, y1]) => ({ x0, y0, x1, y1 })) : null),
  // em volta do lote a cidade fica mais baixa que o prédio, para ele continuar à vista; ao sul
  // (entre o lote e a câmera) mais baixa ainda, como uma plateia; longe, a cidade se assenta no papel
  teto: (x, y, d) => {
    let h = d < 70 ? 18 : d < 220 ? 12 + 0.16 * d : 30 + 0.16 * d;
    if (y > 30 && d < 300) h = Math.min(h, 12 + 0.1 * d);
    return Math.max(4, h * clamp(1 - (d - 900) / 800, 0.12, 1));
  },
});
// o lote vizinho ao sul (entre o lote e a câmera) fica vazio, só chão: o lote azul fica à vista.
// Tirado depois de gerar, para a sequência do rng (e o resto da cidade) não mudar.
cidade.edificios = cidade.edificios.filter((ed) => !(Math.abs(ed.cx) < 20 && ed.cy > 16 && ed.cy < 43));

// revelação do chão a partir do lote, em metros: perto (o que a câmera vê na subida) e longe
const RAIO_CIDADE = 1990;
const revelaR = (t) => 590 * clamp(spring(t - T.revela, 4, 4), 0, 1) + 1400 * clamp(spring(t - 1.4, 1.2, 2.19), 0, 1);
const TAB_R = [];
for (let k = 0; k <= 2400; k += 1) TAB_R.push(revelaR(k / 100));
const tRevela = (r) => { for (let k = 0; k < TAB_R.length; k += 1) if (TAB_R[k] >= r) return k / 100; return 24; };
for (const ed of cidade.edificios) ed.t0 = tRevela(ed.r - 12) + 0.04 + 0.16 * ed.u;
const SOBE = { k: 70, d: 15 };
// a cidade se assenta no papel (B5 e saída) e sobe de novo a partir do lote (B6)
const ASSENTA = { k: 120, d: 20 };   // zeta 0,91: cerca de 0,5 s
// a onda do B6 sai do lote e chega a 700 m em 0,4 s; cada volume chega exato ao prazo do HOLD
for (const ed of cidade.edificios) ed.t6 = T.sobe6 + 0.4 * clamp(ed.r / 700) + 0.08 * ed.u;
const PRAZO6 = PRAZO(HOLDS[4]);
// ?cidade=dessaturado mostra a outra paleta do módulo (a da cena 3), só para conferir
const PALETA = PALETAS[new URLSearchParams(location.search).get('cidade')] || PALETAS.quente;
// assentada: o topo dos volumes vai para a cor do chão, para nada saltar quando eles somem
const PALETA_RASA = { ...PALETA, topo: PALETA.calcada, contorno: PALETA.calcada };
const nivel = (t, ed) => {
  const v = spring(t - ed.t0, SOBE.k, SOBE.d) *
    (1 - spring(t - (T.afunda + 0.1 * ed.u), ASSENTA.k, ASSENTA.d) + molaAte(t - ed.t6, SOBE, PRAZO6 - ed.t6) - spring(t - (T.saida + 0.06 * ed.u), ASSENTA.k, ASSENTA.d));
  // valores que já assentaram viram exatos: o mesmo quadro sai igual e pode ser reaproveitado
  return v < 0.002 ? 0 : Math.abs(v - 1) < 2e-4 ? 1 : v;
};
const crescer = (t) => (ed) => nivel(t, ed);
// o primeiro instante em que algum volume aparece (nível acima de 0,002)

  if (t > T.faixas && aZona > 0.001) {
    FAIXAS.forEach((f, i) => {
      f.w = sp(t - (T.faixas + 0.06 * i), P.card);
      const xw = 1960 * clamp(f.w, 0, 1.02);
      const [a0, b0] = bordaFaixa(f.y0), [a1, b1] = bordaFaixa(f.y1);
      // os vizinhos (e o que fica ao norte de Pina e ao sul de Jordão) clareiam: só Boa Viagem fica com as quadras normais
      const [e0, e1] = [i === 0 ? bordaFaixa(f.y0 - 3000) : [a0, b0], i === 4 ? bordaFaixa(f.y1 + 3000) : [a1, b1]];
      if (!f.atual && xw > 1) zonas += polyD([pontoEmX(e0[0], e0[1], -20), pontoEmX(e0[0], e0[1], xw), pontoEmX(e1[0], e1[1], xw), pontoEmX(e1[0], e1[1], -20)]);
    });
    FAIXA_Y.forEach((y, j) => {
      const f = FAIXAS[Math.min(j, 4)];
      const xw = 1960 * clamp(f.w, 0, 1.02);
      if (xw < 1) return;
      const [a, b] = bordaFaixa(y);
      const bv = y === -170 || y === 170;
      divisas += `<path d="${lineD(pontoEmX(a, b, -20), pontoEmX(a, b, xw))}" stroke="${bv ? '#171717' : '#9E9587'}" stroke-width="${bv ? 3 : 1.5}" fill="none"/>`;
    });
  }
  attr($('zonas-p'), 'd', zonas || 'M0 0Z');
  attr($('chao-viz'), 'd', zonas ? chaoD : '');
  $('chao-viz').setAttribute('opacity', aZona.toFixed(3));

  // --- lote em azul cadastral (contorno de 3,5 px como no fim da cena 6, que engrossa e ganha
  // uma borda branca para saltar à vista) e vizinhos tracejados, que somem quando a cidade sobe ---
  const gL = sp(t - T.lote, P.card);
  const wLote = lerp(3.5, clamp(2.5 + 0.7 * cam.s, 3, 6), gL);
  const loteD = roundedQuad(LOTE_PTS.map(pr), clamp(1.2 * cam.s, 1, 6));
  const aViz = 1 - invLerp(0.55, 1.15, t);
  html(loteG, (gL > 0.001 ? `<path d="${loteD}" fill="none" stroke="#FFFFFF" stroke-width="${(wLote + 5 * gL).toFixed(2)}" stroke-linejoin="round"/>` : '') +
    `<path d="${loteD}" fill="#CFDBE9" stroke="#2E5A85" stroke-width="${wLote.toFixed(2)}"/>` +
    (aViz > 0.001 ? `<path d="${VIZINHOS.map(([x0, y0, x1, y1]) => polyD([[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(pr))).join('')}" fill="rgba(46,90,133,0.05)" stroke="#8FAAC4" stroke-width="1.8" stroke-dasharray="7 6" opacity="${aViz.toFixed(3)}"/>` : ''));

  // --- volumes: a cidade quente sobe; o prédio do lote fica em papel (ilustrativo, sem andares,
  // como na cena 6: o número de pavimentos não tem fonte) ---
  const aJanela = swap(t, T.janela, Infinity, { durIn: 0.18 });
  const predioExtra = {
    cx: 0, cy: 0,
    pinta: (ctx, prj) => {
      pintarPrisma(ctx, PREDIO.x0, PREDIO.y0, PREDIO.x1, PREDIO.y1, PREDIO.h, cam, prj, { s: '#FBF8F2', n: '#FBF8F2', e: '#F1EADC', w: '#F1EADC', topo: '#FFFFFF' }, '#C9BEA8', 1.5, 0);
      if (aJanela > 0.001 && cp[1] > JANELA.y) {
        const j = [[JANELA.x0, JANELA.y, JANELA.z0], [JANELA.x1, JANELA.y, JANELA.z0], [JANELA.x1, JANELA.y, JANELA.z1], [JANELA.x0, JANELA.y, JANELA.z1]].map(prj);
        ctx.globalAlpha = aJanela;
        ctx.beginPath(); ctx.moveTo(j[0][0], j[0][1]); for (let i = 1; i < 4; i += 1) ctx.lineTo(j[i][0], j[i][1]); ctx.closePath();
        ctx.fillStyle = '#F47745'; ctx.fill(); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1; ctx.stroke();
        ctx.globalAlpha = 1;
      }
    },
  };
  const ocultos = [];
  // retângulos opacos (painéis e cartão), encolhidos para dentro numa grade de 24 px: só some o que
  // está inteiro atrás deles, e a chave do desenho não muda com o resto de cada spring
  const dentro = (x0, y0, x1, y1) => ({ x0: Math.ceil(x0 / 24) * 24, y0: Math.ceil(y0 / 24) * 24, x1: Math.floor(x1 / 24) * 24, y1: Math.floor(y1 / 24) * 24 });
  for (const pn of PAINEIS) if (pn.ret && pn.ret.h > 40) ocultos.push(dentro(pn.ret.x, pn.ret.y, pn.ret.x + COL.w, pn.ret.y + pn.ret.h));
  if (yCartao > -200) ocultos.push(dentro(CARTAO.x, yCartao, CARTAO.x + CARTAO.w, yCartao + CARTAO.h));
  let quietos = true, uns = 0, soma = 0;
  for (const ed of cidade.edificios) {
    const v = nivel(t, ed);
    NIVEIS[ed.i] = v;
    if (v === 1) { uns += 1; soma = (soma + ed.i * 7919) % 1000003; } else if (v !== 0) quietos = false;
  }
  const mist = rasa(t);
  const paleta = mist > 0.0005 ? misturarPaleta(PALETA, PALETA_RASA, mist) : PALETA;
  // Antes de o primeiro volume subir só há o prédio, desenhado em SVG como na cena 6: o canvas
  // (camada composta) muda o antisserrilhado do texto por cima, e o rodapé do primeiro quadro
  // tem de sair idêntico ao último da cena 6. O canvas entra quando a cidade começa a subir.
  const usaCanvas = t >= T_CANVAS;
  $('volumes').style.display = usaCanvas ? '' : 'none';
  html($('predio-svg'), usaCanvas ? '' : prisma(PREDIO.x0, PREDIO.y0, PREDIO.x1, PREDIO.y1, PREDIO.h, cam, pr, { s: '#FBF8F2', n: '#FBF8F2', e: '#F1EADC', w: '#F1EADC', topo: '#FFFFFF' }, '#C9BEA8', 1.5, 0));
  if (!usaCanvas) memo.vol.k = undefined;
  // pinta a cidade no canvas; com tudo assentado e a mesma chave, o canvas já tem este quadro
  const chaveVol = quietos ? [camKey(cam), mist.toFixed(4), aJanela.toFixed(3), uns, soma, ocultos.map(retKey).join(';'), dMoldura].join('|') : null;
  if (usaCanvas && (chaveVol === null || chaveVol !== memo.vol.k)) {
    pintarVolumes(volCtx, cidade, cam, { paleta, crescer: (ed) => NIVEIS[ed.i], extras: [predioExtra], ocultos, vista, recorte: eM < 0.0005 ? null : new Path2D(dMoldura) });
    memo.vol.k = chaveVol;
  }

  // --- marcas do mapa ---
  let m = '', mChao = divisas;
  // haste: sai da janela (face sul), encosta no chão a 150 m para o sudoeste e varre o círculo
  const A0 = Math.PI / 2 + 0.72;
  const W = [0, JANELA.y, (JANELA.z0 + JANELA.z1) / 2];
  const eh = sp(t - T.haste, P.map);
  // a varredura chega exata a uma volta antes do HOLD do B2 (e fica exata até o fim: o anel da
  // emenda com a cena 8 é a volta inteira)
  const varre = 2 * Math.PI * clamp(molaAte(t - T.varre, { k: 34, d: 11.6 }, PRAZO(HOLDS[1]) - T.varre), 0, 1);
  const ang = A0 + varre;
  const ponta = [lerp(W[0], 150 * Math.cos(ang), eh), lerp(W[1], 150 * Math.sin(ang), eh), lerp(W[2], 0, eh)];
  const recolhe = sp(t - T.b3, P.map);
  const pontaFinal = [lerp(ponta[0], W[0], recolhe), lerp(ponta[1], W[1], recolhe), lerp(ponta[2], W[2], recolhe)];
  const aHaste = (t >= T.haste ? 1 : 0) * (1 - invLerp(0.85, 0.98, recolhe));
  // anel: o raio de 150 m e a faixa de 118 a 140 m (distância das demolições, não posição). A
  // hachura fica no chão, por baixo dos volumes; por cima só as duas bordas finas e o anel
  const aFaixa = (1 - invLerp(T.saida, T.saida + 0.25, t)) * lerp(1, 0.42, invLerp(T.b3, T.b3 + 0.3, t));
  let anel = '';
  if (varre > 0.001) {
    const n = Math.max(2, Math.ceil((varre / (2 * Math.PI)) * 180));
    const arco = (r) => Array.from({ length: n + 1 }, (_, i) => { const a = A0 + (varre * i) / n; return pr([r * Math.cos(a), r * Math.sin(a), 0]); });
    if (aFaixa > 0.001) {
      const fora = arco(REGISTRO.demolicaoMax), dentro = arco(REGISTRO.demolicaoMin);
      mChao += `<path d="${polyD([...fora, ...dentro.slice().reverse()])}" fill="url(#hachura)" opacity="${aFaixa.toFixed(3)}"/>`;
      m += `<path d="${polyline(fora)}${polyline(dentro)}" fill="none" stroke="#B94E36" stroke-width="1.6" opacity="${(0.8 * aFaixa).toFixed(3)}"/>`;
    }
    const ext = arco(150);
    const aCasca = (1 - invLerp(T.saida, T.saida + 0.35, t)) * 0.95;
    anel = `<path d="${polyline(ext)}" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="${aCasca.toFixed(3)}"/>` +
      `<path d="${polyline(ext)}" fill="none" stroke="#F47745" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  if (aHaste > 0.001) {
    const a = pr(W), b = pr(pontaFinal);
    m += `<g opacity="${aHaste.toFixed(3)}"><path d="${lineD(a, b)}" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><path d="${lineD(a, b)}" stroke="#F47745" stroke-width="4" stroke-linecap="round"/>` +
      `<circle cx="${f1(b[0])}" cy="${f1(b[1])}" r="6" fill="#F47745" stroke="#FFFFFF" stroke-width="2.5"/></g>`;
  }
  // alagamento: contorno pontilhado da rua do prédio e "?" na entrada da garagem (nenhuma água).
  // Depois do B4 os dois viram um rastro leve: traço mais fino e o "?" recolhido num ponto
  const leve = sp(t - T.b5, P.card);
  const pc = molaAte(t - T.contorno, { k: 40, d: 12.6 }, PRAZO(HOLDS[2]) - T.contorno);
  const aAgua = 1 - invLerp(T.saida, T.saida + 0.2, t);
  if (t > T.contorno && aAgua > 0.001) {
    const pts = prefixo(CAPSULA, pc).map(pr);
    const kw = lerp(1, 0.6, leve);
    m += `<g opacity="${(aAgua * lerp(1, 0.7, leve)).toFixed(3)}"><path d="${polyline(pts)}" fill="none" stroke="#FFFFFF" stroke-width="${(10 * kw).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>` +
      `<path d="${polyline(pts)}" fill="none" stroke="#171717" stroke-width="${(5 * kw).toFixed(2)}" stroke-linecap="round" stroke-dasharray="0.1 ${(11 * kw).toFixed(2)}"/></g>`;
  }
  // pino no topo do prédio, com tamanho que acompanha a câmera (14 px no lote, como na cena 6)
  const kP = clamp(Math.pow(cam.s / 9.5, 0.3), 0.57, 1);
  const topoP = pr([0, 0, PREDIO.h]), pinoP = pr([0, 0, PREDIO.h + 10]);
  const eQ = molaAte(t - T.interroga, P.button, PRAZO(HOLDS[2]) - T.interroga);
  if (eQ > 0.01 && aAgua > 0.001) {
    const g = pr([GARAGEM[0], GARAGEM[1], 0]);
    const rq = lerp(clamp(7.5 * cam.s, 10, 25), 5.5, leve) * eQ;
    const aGlifo = 1 - clamp(leve * 1.8);
    m += `<g opacity="${aAgua.toFixed(3)}"><circle cx="${f1(g[0])}" cy="${f1(g[1])}" r="${rq.toFixed(1)}" fill="${leve > 0.5 ? '#171717' : '#FFFFFF'}" stroke="#171717" stroke-width="${lerp(3, 2, leve).toFixed(2)}"/>` +
      (aGlifo > 0.01 ? `<text x="${f1(g[0])}" y="${f1(g[1] + 0.46 * rq)}" text-anchor="middle" font-family="Fraunces" font-weight="600" font-size="${(1.32 * rq).toFixed(2)}" fill="#171717" opacity="${aGlifo.toFixed(3)}">?</text>` : '') + '</g>';
  }
  html($('chao-marcas'), mChao);
  html(marcasG, m);
  html(anelG, anel);

  const aPino = 1 - invLerp(T.saida, T.saida + 0.18, t);
  html(pinoG, aPino > 0.001 ? `<g opacity="${aPino.toFixed(3)}"><path d="${lineD(topoP, pinoP)}" stroke="#F47745" stroke-width="${(4 * kP).toFixed(2)}" stroke-linecap="round"/><circle cx="${f1(pinoP[0])}" cy="${f1(pinoP[1])}" r="${(26 * kP).toFixed(2)}" fill="rgba(244,119,69,0.25)"/><circle cx="${f1(pinoP[0])}" cy="${f1(pinoP[1])}" r="${(14 * kP).toFixed(2)}" fill="#F47745" stroke="#FFFFFF" stroke-width="${(4 * kP).toFixed(2)}"/></g>` : '');

  attr($('moldura-p'), 'd', dMoldura);
  attr($('moldura2-p'), 'd', dMoldura);
  // a borda do cartão do mapa aparece enquanto ele encolhe e some quando ele vira o anel
  const aBorda = invLerp(0.02, 0.2, eM) * (1 - invLerp(0.7, 0.95, eM));
  $('moldura-borda').setAttribute('d', aBorda > 0.001 ? dMoldura : 'M0 0Z');
  $('moldura-borda').setAttribute('opacity', aBorda.toFixed(3));
  // no fim o anel fica vazio: nenhum resto do recorte no meio
  const vMapa = retE[2] < 6 ? 'hidden' : 'visible';
  $('mapa').style.visibility = vMapa; $('mapa2').style.visibility = vMapa; $('volumes').style.visibility = vMapa;

  // --- cartão do alto e abas ---
  cartao.style.top = yCartao.toFixed(1) + 'px';
  vis(cartao, yCartao > -290 ? 1 : 0);
  let ativa = -1, tAtiva = -10;
  for (const [tc, i] of TOQUES) if (t >= tc) { ativa = i; tAtiva = tc; }
  const pAtiva = clamp((t - tAtiva) / 0.12);
  const pz = press(t, CLIQUES.map(([c]) => c));
  const anterior = TOQUES.filter(([tc]) => tc <= t).slice(-2, -1)[0];
  abaEls.forEach((a, i) => {
    let fundo = 0, peso = 500;
    if (i === ativa) { fundo = pAtiva; peso = lerp(500, 700, pAtiva); }
    // a aba que acabou de deixar de estar ativa volta ao normal no mesmo intervalo
    if (anterior && anterior[1] === i && i !== ativa) { fundo = 1 - pAtiva; peso = lerp(700, 500, pAtiva); }
    const toque = i === ativa ? 0.06 * pz : 0;
    a.style.background = `rgba(${lerp(255, 238, toque * 10).toFixed(0)},${lerp(255, 230, toque * 10).toFixed(0)},${lerp(255, 218, toque * 10).toFixed(0)},${fundo.toFixed(3)})`;
    a.style.fontWeight = peso.toFixed(0);
    a.style.color = fundo > 0.5 ? '#171717' : '#625C51';
  });

  // --- painéis: abrem, encolhem até a ficha e saem pela direita no fim ---
  PAINEIS.forEach((pn) => {
    const h = pn.ret.h;
    const visivel = h > 0.6 && t >= pn.abre;
    pn.e.style.visibility = visivel ? 'visible' : 'hidden';
    if (!visivel) { for (const it of [...pn.itens, ...(pn.fichaItens || [])]) it.e.style.visibility = 'hidden'; return; }
    Object.assign(pn.e.style, { left: pn.ret.x.toFixed(1) + 'px', top: pn.top + 'px', width: COL.w + 'px', height: h.toFixed(1) + 'px', borderRadius: Math.min(lerp(18, 28, clamp((h - FICHA_H) / 120)), h / 2).toFixed(1) + 'px' });
    for (const it of pn.itens) posicionar(it, t);
    for (const it of pn.fichaItens || []) posicionar(it, t);
  });

  // --- segurança: o nome de cada faixa aparece na ponta direita dela, junto do painel. Primeiro
  // todos descem ou sobem juntos até a altura da sua linha (o espaço entre eles nunca fica menor
  // que 56 px, então nenhum nome passa por cima de outro); depois cada um entra na linha pela
  // esquerda, abaixo do cabeçalho, e a barra cresce quando ele pousa ---
  const pSeg = PAINEIS[3];
  const moY = sp(t - T.voo, P.card);
  FAIXAS.forEach((f, i) => {
    const tIn = T.faixas + 0.06 * i + 0.2;
    const tX = T.voo + 0.16 + 0.05 * i;
    const moX = sp(t - tX, P.map);
    const a = swap(t, tIn, pSeg.saiConteudo);
    const barra = BARRAS[i];
    barra.style.width = (BARRA.w * (f.taxa / MAX_TAXA) * clamp(sp(t - (tX + 0.24), P.card), 0, 1.02)).toFixed(1) + 'px';
    if (a <= 0.001) { f.rot.style.visibility = 'hidden'; f.val.style.visibility = 'hidden'; return; }
    const yc = (f.y0 + f.y1) / 2;
    const [ca, cb] = bordaFaixa(yc);
    const cy = pontoEmX(ca, cb, X_MAPA - 100)[1];
    const yb = pSeg.top + BARRA.y0 + i * BARRA.passo + 8;
    f.rot.style.fontSize = lerp(26, 22, moX).toFixed(2) + 'px';
    f.rot.style.fontWeight = f.atual ? '700' : lerp(600, 500, moX).toFixed(0);
    vis(f.rot, a);
    // no mapa o nome fica numa etiqueta de papel (as divisas passam por baixo dela); dentro do
    // painel a etiqueta some e sobra só o texto, alinhado com a coluna dos nomes
    f.rot.style.padding = '5px 9px';
    f.rot.style.borderRadius = '9px';
    f.rot.style.background = `rgba(246,241,232,${(0.96 * (1 - clamp(moX * 1.4))).toFixed(3)})`;
    const xMapa = X_MAPA - 28 - f.rot.offsetWidth;
    pos(f.rot, lerp(xMapa, pSeg.ret.x + BARRA.rot - 9, moX), lerp(cy - 19, yb - 9, moY) + 8 * pending(t, tIn, P.type));
    const av = swap(t, tX + 0.36, pSeg.saiConteudo);
    vis(f.val, av); pos(f.val, pSeg.ret.x + BARRA.val - f.val.offsetWidth, yb - 6 + 8 * pending(t, tX + 0.4, P.type));
  });
  html(sobre, '');

  // --- rótulos ancorados no mapa ---
  {
    const a = pr(W), b = pr(pontaFinal);
    // "150 m" em escala de título, à direita da haste e dentro do anel (a haste desce para a esquerda)
    const meio = lerpPt(a, b, 0.5);
    const aP = swap(t, T.pilula, T.b3 + 0.2);
    vis(pilulaRaio, aP); pos(pilulaRaio, meio[0] + 24, meio[1] - 30 + 10 * pending(t, T.pilula, P.type));
    const g = pr([GARAGEM[0], GARAGEM[1], 0]);
    const ruaEsq = pr([RUA.x0, GARAGEM[1], 0]);
    const aA = swap(t, T.interroga + 0.12, T.b4 + 0.2);
    vis(pilulaAgua, aA); pos(pilulaAgua, ruaEsq[0] - 26 - pilulaAgua.offsetWidth, g[1] - 22 + 10 * pending(t, T.interroga + 0.12, P.type));
  }

  // --- cursor: só para cada toque. Entra de baixo, toca o canto inferior direito da aba (fora do
  // texto), sai e some; nunca fica parado no quadro assentado ---
  let cur = [1880, 1180], vc = 0, ondaP = cur, onda = 0;
  for (const [c, i] of CLIQUES) {
    const pt = pontaAba(i);
    const entra = [pt[0] + 60, pt[1] + 130], sai = [pt[0] + 80, pt[1] + 150];
    const v = swap(t, c - 0.32, c + 0.42, { delayIn: 0, durIn: 0.1, leadOut: 0, durOut: 0.14 });
    if (v > vc) { vc = v; cur = track(t, [[c - 0.32, entra], [c - 0.29, pt], [c + 0.16, sai]], P.cursor); }
    if (t >= c && t < c + 0.45) { onda = (t - c) / 0.45; ondaP = pt; }
  }
  const esc = (1 - 0.16 * pz) * lerp(0.7, 1, vc);
  const seta = [[0, 0], [0, 38], [10.5, 29], [17, 43.5], [23.5, 40.6], [17, 26.6], [30, 26.6]];
  const cursorEl = $('cursor');
  cursorEl.setAttribute('d', polyD(seta.map(([x, y]) => [cur[0] + x * esc, cur[1] + y * esc])));
  cursorEl.setAttribute('opacity', vc.toFixed(3));
  const od = $('onda');
  od.setAttribute('cx', f1(ondaP[0])); od.setAttribute('cy', f1(ondaP[1]));
  od.setAttribute('r', (6 + 15 * sp(onda * 0.45, P.button)).toFixed(1));
  od.setAttribute('opacity', (onda > 0 ? 0.8 * (1 - onda) : 0).toFixed(3));

  if (dbg) dbg.textContent = `${t.toFixed(2)} s · s=${cam.s.toFixed(2)}`;
}

// ---------------------------------------------------------------------------
// Contrato de render e modos de preview
// ---------------------------------------------------------------------------
const SONS = [
  { t: T.cam1, tipo: 'whoosh', dur: 1.2, ganho: 0.6, evento: 'câmera sobe pela fachada' },
  { t: T.lote, tipo: 'tick', ganho: 0.4, evento: 'o contorno do lote engrossa' },
  { t: 0.5, tipo: 'thump', ganho: 0.55, evento: 'quadras sobem' },
  { t: T.barra, tipo: 'pop', evento: 'barra Explore o entorno' },
  { t: T.b2, tipo: 'whoosh', dur: 0.6, ganho: 0.5, evento: 'câmera abre o raio' },
  { t: T.janela, tipo: 'pop', ganho: 0.6, evento: 'a janela acende' },
  { t: T.haste, tipo: 'tick', evento: 'haste sai da janela' },
  { t: T.varre, tipo: 'sweep', dur: 0.95, evento: 'raio de 150 m varre' },
  { t: T.clique0, tipo: 'click', evento: 'toque em Obras' },
  { t: T.painel1, tipo: 'pop', evento: 'painel Obras: 4 demolições perto' },
  { t: T.b3, tipo: 'whoosh', dur: 0.32, ganho: 0.5, evento: 'painel vira ficha' },
  { t: T.clique1, tipo: 'click', evento: 'toque em Alagamento' },
  { t: T.contorno, tipo: 'tick', evento: 'contorno pontilhado da rua' },
