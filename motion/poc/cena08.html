// ---------------------------------------------------------------------------
// Geometria do celular em cada fase
// ---------------------------------------------------------------------------
function celular(t) {
  // fora a fora: o cartão desce, se fecha na moldura e, no fim, vai para a esquerda
  const yc = lerp(CARD_Y0, CARD.y, clamp(sp(t - T.desce, DESCE), 0, 1.05));
  const m = fim(t - T.moldura, MOLD);
  const fora = [lerp(CARD.x, PH.x, m), lerp(yc, PH.y, m), lerp(CARD.w, PH.w, m), lerp(CARD.h, PH.h, m)];
  const bz = lerp(2, BZ, fim(t - T.moldura, { k: 64, d: 16 }));
  const rf = lerp(36, R_FORA, m);
  const telaR = [fora[0] + bz, fora[1] + bz, fora[2] - 2 * bz, fora[3] - 2 * bz];
  // a folha do anúncio: cobre a tela, assenta a 45% dela e depois desce para fora
  const f = lerp(0, 0.45, m) + 0.61 * fim(t - T.desceFolha, DESC);
  // câmera
  const ka = fim(t - T.zoom, APROX), kl = fim(t - T.lado, LADO);
  const [z, ax, ay] = [0, 1, 2].map((i) => CAM.base[i] + (CAM.perto[i] - CAM.base[i]) * ka + (CAM.lado[i] - CAM.perto[i]) * kl);
  const S = (x, y) => [ax + z * x, ay + z * y];
  return { m, fora, bz, rf, telaR, f, z, S };
}

// ---------------------------------------------------------------------------
// seek(t): função pura do tempo
// ---------------------------------------------------------------------------
function curva(t) {
  // o anel se abre no ponto de cima: as duas metades descem até a tangente de baixo e se esticam.
  // Cada metade cobre um arco de pi * (1 - u): com u = 0 é o círculo inteiro, com u = 1 é uma reta.
  const u = clamp(sp(t - T.abre, UNC), 0, 1);
  const e = clamp(sp(t - T.estende, EST), 0, 1);
  const x = C7[0];
  const y = lerp(C7[1] + R7, Y_DIV, u);
  const Lh = lerp(Math.PI * R7, 1010, e);
  const k = (Math.PI * (1 - u)) / Lh;
  const N = 120;
  const pt = (s) => (k > 1e-9 ? [Math.sin(k * s) / k, (1 - Math.cos(k * s)) / k] : [s, 0]);
  let d = '';
  for (let i = N; i >= 0; i -= 1) { const [dx, dy] = pt((Lh * i) / N); d += (d ? 'L' : 'M') + f1(x - dx) + ' ' + f1(y - dy); }
  for (let i = 1; i <= N; i += 1) { const [dx, dy] = pt((Lh * i) / N); d += 'L' + f1(x + dx) + ' ' + f1(y - dy); }
  return d;
}

// Sem a aproximação, o celular fica parado no centro de 2,0 a 9,8 s enquanto a folha passa pelos cantos
// de baixo da tela. O Chromium então rasterizava de novo só o retângulo da tela, e o antisserrilhado das
// curvas ali (moldura e cantos da folha) mudava conforme o quadro anterior (até 99 níveis em alguns pixels;
// já acontecia de 2,55 a 3,5 s, mas o teste de determinismo não caía nesses tempos).
// A posição da grade anda de 0,0001 a 0,0011 px, abaixo do 1/64 px do layout: nenhum pixel muda, mas o
// quadro inteiro é rasterizado de novo a cada seek, e o resultado só depende de t.
const grade = document.querySelector('.grade');
function render(t) {
  t = clamp(t, 0, DUR);
  grade.style.backgroundPosition = `${(1e-4 + 1e-3 * t / DUR).toFixed(9)}px 0px`;
  const G = celular(t);
  const Z = G.z;
  // fx..th: o celular sem a câmera (coordenadas do celular); a câmera só muda o que se desenha
  const [fx, fy, fw, fh] = G.fora, [tx, ty, tw, th] = G.telaR;
  const [Fx, Fy] = G.S(fx, fy), [Tx, Ty] = G.S(tx, ty);

  // ===== o celular (moldura, tela, página e folha) =================================
  caixa(moldura, Fx, Fy, fw * Z, fh * Z);
  moldura.style.borderWidth = (G.bz * Z).toFixed(2) + 'px';
  moldura.style.borderRadius = (G.rf * Z).toFixed(2) + 'px';
  moldura.style.borderColor = rgba(mixColor([23, 23, 23, 0.09], [34, 36, 38, 1], clamp(G.m * 1.15)));
  const ri = Math.max(G.rf - G.bz, 0) * Z;
  caixa(tela, Tx, Ty, tw * Z, th * Z);
  tela.style.borderRadius = ri.toFixed(2) + 'px';
  const visivel = Fy < 1080 && Fy + fh * Z > 0;
  moldura.style.visibility = tela.style.visibility = visivel ? 'inherit' : 'hidden';
  // a página tem zoom de layout (a régua dela fica nas coordenadas do celular)
  caixa(pagina, 0, 0, tw, th);
  pagina.style.zoom = Z.toFixed(5);
  // folha: o cartão do anúncio (zoom = largura da tela / largura de base) até sair; depois a mensagem
  const naMsg = t >= T.sobe;
  if (!naMsg) {
    const z = Z * tw / FW;
    caixa(folha, 0, Z * th * G.f, tw * Z, (th + 60) * Z);
    folha.style.borderRadius = `${ri.toFixed(2)}px ${ri.toFixed(2)}px 0 0`;
    folha.style.borderTopColor = rgba([23, 23, 23, 0.12 * clamp(G.m * 1.5)]);
    folhaZ.style.zoom = z.toFixed(5);
    folha.style.visibility = G.f < 1 ? 'inherit' : 'hidden';
    folhaZ.style.visibility = 'inherit'; msgZ.style.visibility = 'hidden';
  } else {
    const s = fim(t - T.sobe, SOBE);
    caixa(folha, 0, Z * lerp(th + 4, SH_TOP, s), tw * Z, (th + 60) * Z);
    folha.style.borderRadius = `${(34 * Z).toFixed(2)}px ${(34 * Z).toFixed(2)}px 0 0`;
    folha.style.borderTopColor = 'rgba(23,23,23,0.12)';
    msgZ.style.zoom = Z.toFixed(5);
    folha.style.visibility = 'inherit';
    folhaZ.style.visibility = 'hidden'; msgZ.style.visibility = 'inherit';
  }
  caixa(indicador, Z * (tw - 140) / 2, Z * (th - 18), 140 * Z, 6 * Z);
  indicador.style.borderRadius = (3 * Z).toFixed(2) + 'px';
  vis(indicador, clamp((G.m - 0.6) / 0.4));

  // ===== cartão do anúncio: tracejado do declarado =================================
  for (const s of adSub) {
    const w = largura(s.it.e.textContent, JK(600, 60), -0.02);
    traca(s.l, s.it.x, AD_VY + 1.1 * 60 + 4, w, fim(t - (T.pousa + (s.it === adB ? 0.06 : 0)), P.card));
  }

  // ===== dossiê: o oficial contra o declarado ======================================
  const wD = [largura('75 m²', JK(600, 38), -0.02), largura('não diz', JK(600, 34), -0.02)];
  const wR = [largura('62,5 m²', JK(600, 58), -0.025), largura('+R$ 340', JK(600, 34), -0.02)];
  traca(subD[0], 24, 104 + 1.1 * 38 + 3, wD[0], 1);
  traca(subD[1], 24, 226 + 1.1 * 34 + 3, wD[1], 1);
  // fim(): os traços chegam exatamente ao fim e param (sp só se aproxima de 1, e o arredondamento
  // da ponta podia mudar de um quadro para o outro dentro de um HOLD)
  traca(subR[0], XO, 88 + 1.1 * 58 + 4, wR[0], fim(t - (T.real + 0.14), P.card));
  traca(subR[1], XO, 226 + 1.1 * 34 + 3, wR[1], fim(t - (T.taxa + 0.12), P.card));
  // 75 m² riscado em laranja (a maquiagem sai)
  traca(risco, 20, 104 + 0.56 * 38 + 1, wD[0] + 8, fim(t - T.risca, ENTRA));
  // R$ 99 mil acima: a caixa sobe e o texto entra depois
  const aMil = swap(t, T.mil, Infinity, { durIn: 0.16 });
  vis(mil, aMil); mil.style.top = (MIL_TOP + 14 * pending(t, T.mil, P.type)).toFixed(2) + 'px';
  // botão Preparar mensagem: entra no fim da frase e é tocado no começo da seguinte
  const aCta = swap(t, T.cta, Infinity, { durIn: 0.16 });
  vis(cta, aCta);
  cta.style.top = (CTA[1] + 12 * pending(t, T.cta, P.type)).toFixed(2) + 'px';
  cta.style.background = rgba(mixColor(hx('#F47745'), hx('#E56734'), press(t, [T.toque])));
  // Abrir WhatsApp: apagado até a lista ficar pronta
  const aceso = clamp((t - T.whats) / 0.2);
  btnW.style.background = rgba(mixColor(hx('#ECE4D6'), hx('#F47745'), aceso));
  btnW.style.color = rgba(mixColor(hx('#8C8578'), hx('#171717'), aceso));

  for (const it of textos) posicionar(it, t);

  // ===== MILHARES: a linha desce e varre o que passou ============================
  const v = fim(t - T.varre, VARRE);
  const yL = t < T.varre ? Y_DIV : lerp(Y_DIV, Y_FIM, v);
  // #eco ocupa o quadro inteiro: o recorte esconde tudo o que fica acima da linha
  eco.style.clipPath = `inset(${yL.toFixed(1)}px 0 0 0)`;
  const ecoVis = t >= T.eco && v < 0.999;
  eco.style.visibility = ecoVis ? 'inherit' : 'hidden';

  // ===== a linha laranja ===========================================================
  const linhaDiv = $('divisoria');
  if (t < T.abre) linhaDiv.setAttribute('d', ANEL7);
  else if (t < T.varre) linhaDiv.setAttribute('d', curva(t));
  else linhaDiv.setAttribute('d', `M${f1(lerp(DIV_X0, X_FIM0, v))} ${f1(yL)}L${f1(lerp(DIV_X1, X_FIM1, v))} ${f1(yL)}`);
  // ilustração: tracejado (declarado) acima da linha e contínuo azul (oficial) abaixo, saindo do celular
  const g = fim(t - T.tracos, TRACO);
  const aT = clamp((T.lado + 0.2 - t) / 0.2);
  const LD = 384, LO = 320;                        // 75 m² e 62,5 m² na mesma escala
  const e0 = Fx, e1 = Fx + fw * Z;
  const yD = Y_DIV - 40, yO = Y_DIV + 40;
  const decl = $('decl'), ofic = $('ofic');
  decl.setAttribute('d', `M${f1(e0 - 18)} ${yD}L${f1(e0 - 18 - LD * g)} ${yD}M${f1(e1 + 18)} ${yD}L${f1(e1 + 18 + LD * g)} ${yD}`);
  ofic.setAttribute('d', `M${f1(e0 - 18)} ${yO}L${f1(e0 - 18 - LO * g)} ${yO}M${f1(e1 + 18)} ${yO}L${f1(e1 + 18 + LO * g)} ${yO}`);
  for (const p of [decl, ofic]) vis(p, g > 0.004 ? aT : 0);

  // ===== o toque em Preparar mensagem ==============================================
  const dedo = $('dedo'), onda = $('onda');
  const pt = G.S(tx + CTA[0] + CTA[2] * 0.62, ty + CTA[1] + CTA[3] * 0.55);
  const aD = swap(t, T.toque - 0.3, T.toque + 0.38, { delayIn: 0, durIn: 0.1, leadOut: 0, durOut: 0.14 });
  const pz = press(t, [T.toque]);
  dedo.setAttribute('cx', f1(pt[0] + 26 * (1 - clamp((t - (T.toque - 0.3)) / 0.26)))); dedo.setAttribute('cy', f1(pt[1] + 30 * (1 - clamp((t - (T.toque - 0.3)) / 0.26))));
  dedo.setAttribute('r', (30 - 6 * pz).toFixed(2));
  dedo.setAttribute('opacity', aD.toFixed(3));
  const o = t >= T.toque && t < T.toque + 0.45 ? (t - T.toque) / 0.45 : 0;
  onda.setAttribute('cx', f1(pt[0])); onda.setAttribute('cy', f1(pt[1]));
  onda.setAttribute('r', (30 + 26 * sp(o * 0.45, P.button)).toFixed(1));
  onda.setAttribute('opacity', (o > 0 ? 0.85 * (1 - o) : 0).toFixed(3));

  if (dbg) dbg.textContent = `${t.toFixed(2)} s`;
}

if (!navigator.webdriver) {
  document.body.classList.add('tela');
  const c = $('c');

  addEventListener('resize', ajusta); ajusta();
  const aoVivo = new URLSearchParams(location.search).has('live');
  // ao vivo: espaço ou → leva ao próximo HOLD; o último é DUR (a passagem para a costura 08–10)
  const PARADAS = HOLDS;
  let t = 0, alvo = aoVivo ? PARADAS[0] : DUR, rodando = true, antes = null, ultimo = null;
  // parado num HOLD o quadro não muda: só desenha quando t muda
  const passo = (agora) => { if (antes !== null && rodando) { t += (agora - antes) / 1000; if (t >= alvo) { t = alvo; if (!aoVivo) t = 0; else rodando = false; } } antes = agora; if (t !== ultimo) { render(t); ultimo = t; } requestAnimationFrame(passo); };
  addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown') {
      const base0 = rodando ? alvo : t;
      const i = PARADAS.findIndex((h) => h > base0 + 1e-3);
      if (aoVivo) { if (i >= 0) { alvo = PARADAS[i]; rodando = true; } } else rodando = !rodando;
      e.preventDefault();

      // volta para o HOLD anterior e fica parado nele
      const anteriores = PARADAS.filter((h) => h < t - 1e-3);
      t = anteriores.length ? anteriores[anteriores.length - 1] : 0;
      alvo = aoVivo ? (PARADAS.find((h) => h > t + 1e-3) ?? DUR) : DUR;
