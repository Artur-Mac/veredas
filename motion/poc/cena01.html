<body>
<div id="c">
  <svg class="camada" id="cena" viewBox="0 0 1920 1080">

      <clipPath id="abaixo"><rect id="abaixo-r" x="0" y="1080" width="1920" height="0" /></clipPath>

<script type="module">
import { clamp, lerp, invLerp, smooth, sp, spring, track, swap, pending, rng, PRESETS as P } from '../lib/motion.js';
// V1: marcos da gravação de 18/10/2026 e a regra do número, comuns com motion/lib/sala01.js (a cena 02 abre no quadro final)
import { T01C, DUR01C, HOLD01C, ABRE_J01C, ABRE01C, LUZ01C, fim01, NUM01C, layout01C } from '../lib/sala01.js';

// ---------------------------------------------------------------------------
// Variantes: a mesma sala e a mesma sedução; muda a quebra e o clímax.
//   ?v=1  janela: o "nascente" se põe; a câmera entra pela janela; o sol vira o número
//   ?v=2  linha do anúncio: a linha varre a sala para o PB e vira a régua dos cinco anos
//   ?v=3  geometria: a sala estica, as paredes caem como planta e o número se levanta
// ---------------------------------------------------------------------------
const V = clamp(Number(new URLSearchParams(location.search).get('v') || 1), 1, 3);
const NOMES = { 1: 'janela', 2: 'linha do anúncio', 3: 'geometria da sala' };
// V2 e V3 (alternativas, sem manutenção): marcas do roteiro antigo, cerca de 2,5 palavras por segundo.
// V1 (a escolhida): roteiro gravado de 18/10/2026, 13,8 s, cada evento na sua palavra (motion/lib/sala01.js, T01C);
// HOLDs parados no fim de "Recife." e no quadro final (o primeiro da cena 02 ?v=2)
const DUR = V === 1 ? DUR01C : 18;
const T = V === 1 ? T01C : { anuncio: 3.6, a1: 4.4, a2: 5.9, a3: 7.3, a4: 8.6, lar: 9.8, mas: 11.0, colapso: 12.2, numero: 14.6, apoio: 15.6 };
const HOLDS = V === 1 ? [HOLD01C, DUR] : [3.4, 10.6, DUR];
const LENTO = { k: 4, d: 4 };        // dolly de abertura, zeta 1
const DOLLY = { k: 12, d: 7 };       // dolly longo, zeta 1
const DOBRA = { k: 22, d: 7.5 };     // paredes caindo, zeta 0,8: pequeno assentamento

// ---------------------------------------------------------------------------
// Cor: quente (sedução) → sem saturação (quebra) → PB de alto contraste (choque)
// ---------------------------------------------------------------------------
const hex = (h, a = 1) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16), a];
const QUENTE = {
  piso: hex('#EFC38D'), pisoLinha: hex('#F8DDB4'), fundo: hex('#F8E3C4'), esquerda: hex('#F6B467'), direita: hex('#F9C978'), teto: hex('#FCEEDA'),
  ceu1: hex('#FBD08F'), ceu2: hex('#FCDDA8'), ceu3: hex('#FDE9C6'), mar: hex('#F7C79E'), marLinha: hex('#FCE3C9'),
  torreA: hex('#F4A15C'), torreB: hex('#EE8956'), torreC: hex('#E9734F'), torreTopo: hex('#FCE0B8'),
  sol: hex('#FFB347'), halo: hex('#FFC46B', 0.35), luz: hex('#FFF4D6', 0.88), feixe: hex('#FFF1C9', 0.26), sanca: hex('#F8E2C2'), spot: hex('#FFF8EA'), torreLinha: hex('#FFFFFF'),
  moldura: hex('#FFFFFF'), contorno: hex('#FFFFFF'), cortina: hex('#FFF8EC', 0.8), vento: hex('#FFFFFF', 0.95),
  sofaT: hex('#F9A07A'), sofaF: hex('#F47745'), sofaL: hex('#DC683B'),
  tapete: hex('#F2A27F'), tapeteBorda: hex('#F8C3A6'),
  mesaT: hex('#FBD27D'), mesaF: hex('#F2B04F'), mesaL: hex('#E39A3C'),
  rackT: hex('#FCE7C4'), rackF: hex('#F6D3A0'), rackL: hex('#E9BC85'),
  quadro: hex('#E9734F'), quadroSol: hex('#FFC46B'), passepartout: hex('#FFF7EA'), cota: hex('#C8643A', 0.9),
};
const MONO = {
  // V1 noite: tudo escuro, contorno branco, céu preto; só o número leva cor
  1: { piso: '#141414', pisoLinha: '#2A2A2A', fundo: '#1C1C1C', esquerda: '#232323', direita: '#191919', teto: '#101010',
       ceu1: '#0B0B0B', ceu2: '#0B0B0B', ceu3: '#0E0E0E', mar: '#121212', marLinha: '#2A2A2A', torreA: '#202020', torreB: '#1A1A1A', torreC: '#242424', torreTopo: '#2E2E2E',
       sol: '#2A2A2A', halo: '#000000', luz: '#FFFFFF', feixe: '#FFFFFF', sanca: '#161616', spot: '#2A2A2A', torreLinha: '#3A3A3A', moldura: '#F2EBDD', contorno: '#F2EBDD', cortina: '#2A2A2A', vento: '#555555',
       sofaT: '#3A3A3A', sofaF: '#2C2C2C', sofaL: '#222222', tapete: '#262626', tapeteBorda: '#3A3A3A', mesaT: '#404040', mesaF: '#303030', mesaL: '#262626',
       rackT: '#3A3A3A', rackF: '#2C2C2C', rackL: '#222222', quadro: '#303030', quadroSol: '#3A3A3A', passepartout: '#262626', cota: '#555555' },
  // V2 papel: desenho técnico, superfícies claras e contorno em tinta
  2: { piso: '#F4F3EF', pisoLinha: '#D6D4CE', fundo: '#FFFFFF', esquerda: '#ECEBE7', direita: '#E3E2DE', teto: '#F8F7F4',
       ceu1: '#FFFFFF', ceu2: '#FFFFFF', ceu3: '#FFFFFF', mar: '#F1F0EC', marLinha: '#CFCDC6', torreA: '#E4E3DF', torreB: '#DAD9D5', torreC: '#EEEDE9', torreTopo: '#FFFFFF',
       sol: '#E0DFDB', halo: '#FFFFFF', luz: '#FFFFFF', feixe: '#FFFFFF', sanca: '#F2F1ED', spot: '#FFFFFF', torreLinha: '#171717', moldura: '#FFFFFF', contorno: '#171717', cortina: '#FFFFFF', vento: '#C9C7C0',
       sofaT: '#E9E8E4', sofaF: '#DCDBD7', sofaL: '#CFCECA', tapete: '#E2E1DD', tapeteBorda: '#F2F1ED', mesaT: '#F0EFEB', mesaF: '#E2E1DD', mesaL: '#D4D3CF',
       rackT: '#F2F1ED', rackF: '#E2E1DD', rackL: '#D4D3CF', quadro: '#CFCECA', quadroSol: '#E2E1DD', passepartout: '#FFFFFF', cota: '#9A9892' },
  // V3 planta: chão de tinta com traço branco, como uma planta invertida
  3: { piso: '#161616', pisoLinha: '#3A3A3A', fundo: '#1E1E1E', esquerda: '#1B1B1B', direita: '#1B1B1B', teto: '#121212',
       ceu1: '#0D0D0D', ceu2: '#0D0D0D', ceu3: '#0D0D0D', mar: '#101010', marLinha: '#262626', torreA: '#1C1C1C', torreB: '#181818', torreC: '#202020', torreTopo: '#2A2A2A',
       sol: '#1C1C1C', halo: '#000000', luz: '#FFFFFF', feixe: '#FFFFFF', sanca: '#141414', spot: '#262626', torreLinha: '#2A2A2A', moldura: '#F2EBDD', contorno: '#F2EBDD', cortina: '#262626', vento: '#3A3A3A',
       sofaT: '#2A2A2A', sofaF: '#222222', sofaL: '#1C1C1C', tapete: '#202020', tapeteBorda: '#3A3A3A', mesaT: '#2E2E2E', mesaF: '#262626', mesaL: '#1F1F1F',
       rackT: '#2E2E2E', rackF: '#262626', rackL: '#1F1F1F', quadro: '#262626', quadroSol: '#333333', passepartout: '#202020', cota: '#F2EBDD' },
};
const MONOH = {};
for (const v of [1, 2, 3]) { MONOH[v] = {}; for (const [k, h] of Object.entries(MONO[v])) MONOH[v][k] = hex(h, QUENTE[k][3]); }
for (const v of [1, 2, 3]) { MONOH[v].luz[3] = 0; MONOH[v].feixe[3] = 0; }
MONOH[1].halo[3] = 0; MONOH[3].halo[3] = 0;

function tinta(chave, dsat, k, conjunto = MONOH[V]) {
  const q = QUENTE[chave];
  const l = 0.299 * q[0] + 0.587 * q[1] + 0.114 * q[2];
  const d = [lerp(q[0], l, dsat), lerp(q[1], l, dsat), lerp(q[2], l, dsat)];
  const m = conjunto[chave];
  const r = lerp(d[0], m[0], k), g = lerp(d[1], m[1], k), b = lerp(d[2], m[2], k), a = lerp(q[3], m[3], k);
  return `rgba(${r.toFixed(0)},${g.toFixed(0)},${b.toFixed(0)},${a.toFixed(3)})`;
}

// ---------------------------------------------------------------------------
// Câmera pinhole: x à direita, y para o fundo é negativo, z para cima.
// A câmera olha para −y. Recorte no plano próximo para o que fica atrás dela.
// ---------------------------------------------------------------------------
function paraCamera(p, c) {
  const dx = p[0] - c.pos[0], dy = p[1] - c.pos[1], dz = p[2] - c.pos[2];
  const cy = Math.cos(c.yaw), sy = Math.sin(c.yaw);
  const xr = dx * cy + dy * sy, yr = -dx * sy + dy * cy;
  let xc = xr, yc = dz, zc = -yr;
  const cp = Math.cos(c.pitch), spt = Math.sin(c.pitch);
  const yc2 = yc * cp - zc * spt, zc2 = yc * spt + zc * cp;
  const cr = Math.cos(c.roll), sr = Math.sin(c.roll);
  return [xc * cr - yc2 * sr, xc * sr + yc2 * cr, zc2];
}
const PERTO = 0.06;
const naTela = (q, c) => [960 + (c.f * q[0]) / q[2], 540 - (c.f * q[1]) / q[2]];
function recortaPerto(poly) {
  const out = [];
  for (let i = 0; i < poly.length; i += 1) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const ai = a[2] > PERTO, bi = b[2] > PERTO;
    if (ai) out.push(a);
    if (ai !== bi) { const s = (PERTO - a[2]) / (b[2] - a[2]); out.push([lerp(a[0], b[0], s), lerp(a[1], b[1], s), PERTO]); }
  }
  return out;
}
const fmt = (p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1);
function caminho(pts3, c, fechar = true) {
  const cam = pts3.map((p) => paraCamera(p, c));
  const rec = fechar ? recortaPerto(cam) : cam.filter((q) => q[2] > PERTO);
  if (rec.length < (fechar ? 3 : 2)) return '';
  return 'M' + rec.map((q) => fmt(naTela(q, c))).join('L') + (fechar ? 'Z' : '');
}
const profundidade = (p, c) => paraCamera(p, c)[2];
const tela = (p, c) => naTela(paraCamera(p, c), c);
const poly = (d, fill, stroke, sw = 2, extra = '') => d ? `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" ${extra}/>` : '';

// caixa com faces visíveis (as viradas para a câmera), ordenadas
function caixa(x0, y0, z0, x1, y1, z1, cores, c, contorno, sw = 2) {
  const faces = [
    { pts: [[x0, y1, z1], [x1, y1, z1], [x1, y0, z1], [x0, y0, z1]], n: [0, 0, 1], cor: cores.t },
    { pts: [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], n: [0, 1, 0], cor: cores.f },
    { pts: [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], n: [0, -1, 0], cor: cores.f },
    { pts: [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], n: [1, 0, 0], cor: cores.l },
    { pts: [[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]], n: [-1, 0, 0], cor: cores.l },
  ];
  let s = '';
  for (const f of faces) {
    const ctr = f.pts.reduce((a, p) => [a[0] + p[0] / 4, a[1] + p[1] / 4, a[2] + p[2] / 4], [0, 0, 0]);
    const v = [c.pos[0] - ctr[0], c.pos[1] - ctr[1], c.pos[2] - ctr[2]];
    if (v[0] * f.n[0] + v[1] * f.n[1] + v[2] * f.n[2] <= 0) continue;
    s += poly(caminho(f.pts, c), f.cor, contorno, sw);
  }
  return s;
}

// recorte de polígono num retângulo do plano xy (luz no chão)
function recortaRet(pts, x0, x1, y0, y1) {
  let out = pts;
  const planos = [[(p) => p[0] - x0, 0], [(p) => x1 - p[0], 0], [(p) => p[1] - y0, 1], [(p) => y1 - p[1], 1]];
  for (const [f] of planos) {
    const ent = out; out = [];
    for (let i = 0; i < ent.length; i += 1) {
      const a = ent[i], b = ent[(i + 1) % ent.length];
      const fa = f(a), fb = f(b);
      if (fa >= 0) out.push(a);
      if ((fa >= 0) !== (fb >= 0)) { const s = fa / (fa - fb); out.push([lerp(a[0], b[0], s), lerp(a[1], b[1], s), 0.004]); }
    }
    if (!out.length) return out;
  }
  return out;
}

// ---------------------------------------------------------------------------
// Texto num plano do mundo: cada glifo com sua própria afim (aproxima a perspectiva).
// ---------------------------------------------------------------------------
const medidor = document.createElement('canvas').getContext('2d');
function glifos(texto, fonte) {
  medidor.font = fonte.replace('{px}', '100px');
  const out = []; let x = 0;
  for (const ch of texto) { const w = medidor.measureText(ch).width / 100; out.push({ ch, x, w }); x += w + (fonte.includes('800') ? -0.045 : -0.02); }
  return { out, largura: x };
}
function textoNoPlano(texto, o, c) {
  // o: base (mundo, meio da linha de base), X e U unitários, tam (m), fonte, cor, contorno, extrusao {vetor, camadas, cores}
  const { out, largura } = glifos(texto, o.fonte);
  const at = (u, v, desloc = [0, 0, 0]) => {
    const w = [o.base[0] + (u - largura / 2) * o.tam * o.X[0] - v * o.tam * o.U[0] + desloc[0],
               o.base[1] + (u - largura / 2) * o.tam * o.X[1] - v * o.tam * o.U[1] + desloc[1],
               o.base[2] + (u - largura / 2) * o.tam * o.X[2] - v * o.tam * o.U[2] + desloc[2]];
    return tela(w, c);
  };
  const glifo = (g, desloc, fill, extra) => {
    const u = g.x + g.w / 2, v = -0.36;
    const A = at(u, v, desloc), Bu = at(u + 0.01, v, desloc), Bv = at(u, v + 0.01, desloc);
    const a = (Bu[0] - A[0]) / 0.01 / 100, b = (Bu[1] - A[1]) / 0.01 / 100, cc = (Bv[0] - A[0]) / 0.01 / 100, d = (Bv[1] - A[1]) / 0.01 / 100;
    const e = A[0] - a * u * 100 - cc * v * 100, f = A[1] - b * u * 100 - d * v * 100;
    return `<text x="${(g.x * 100).toFixed(2)}" y="0" transform="matrix(${a.toFixed(5)} ${b.toFixed(5)} ${cc.toFixed(5)} ${d.toFixed(5)} ${e.toFixed(2)} ${f.toFixed(2)})" fill="${fill}" ${extra}>${g.ch === ' ' ? '' : g.ch}</text>`;
  };
  const familia = o.fonte.split('{px}')[1].trim();
  const peso = o.fonte.split(' ')[0];
  const estilo = o.fonte.startsWith('italic') ? 'font-style="italic" font-weight="' + o.fonte.split(' ')[1] + '"' : `font-weight="${peso}"`;
  let s = `<g font-family=${familia} ${estilo} font-size="100" opacity="${(o.opacidade ?? 1).toFixed(3)}">`;
  if (o.extrusao && o.extrusao.camadas > 0) {
    const { vetor, camadas, cores } = o.extrusao;
    for (let k = camadas; k >= 1; k -= 1) {
      const fr = k / camadas;
      const cor = cores[Math.min(cores.length - 1, Math.floor((1 - fr) * cores.length))];
      for (const g of out) if (g.ch !== ' ') s += glifo(g, [vetor[0] * fr, vetor[1] * fr, vetor[2] * fr], cor, '');
    }
  }
  for (const g of out) if (g.ch !== ' ') s += glifo(g, [0, 0, 0], o.cor, o.contorno ? `stroke="${o.contorno}" stroke-width="${o.sw || 3}" vector-effect="non-scaling-stroke" paint-order="stroke"` : '');
  return s + '</g>';
}

// ---------------------------------------------------------------------------
// Cidade vista pela janela (esquema, nas cores da cena) e sala
// ---------------------------------------------------------------------------
const torres = [];
(function cidade() {
  const r = rng(81);
  for (let i = 0; i < 18; i += 1) {
    const lado = i % 2 ? 1 : -1;
    const x = lado * (6 + r() * 26) + (r() - 0.5) * 4;
    const w = 2.2 + r() * 3.2, prof = 2 + r() * 2;
    const y = -52 - r() * 14;
    const topo = 0.4 + r() * 6.5 - Math.abs(x) * 0.02;
    torres.push({ x, w, prof, y, topo, cor: ['torreA', 'torreB', 'torreC'][i % 3] });
  }
  torres.sort((a, b) => a.y - b.y);
})();

function geometria(t) {
  const amplo = sp(t - T.a1, P.map);
  return { hw: lerp(3.05, 3.4, amplo), D: lerp(6.6, 7.3, amplo), H: 2.8, amplo };
}

// tempo do vento: corre até o "Mas" e para com desaceleração suave (velocidade contínua)
function tempoVento(t) {
  if (t <= T.mas) return t;
  const tau = 0.22;
  return T.mas + tau * (1 - Math.exp(-(t - T.mas) / tau));
}

// O sol é desenhado antes do mar, então some atrás do horizonte mesmo estando mais perto.
const SOL_X = 2.4, SOL_Y = -38;
function solZ(t) {
  let z = track(t, [[0, 2.6], [T.a3, 5.4, P.map]], P.map);
  if (V === 1) z = track(t, [[0, 2.6], [T.a3, 5.4, P.map], [T.mas, -3.0, DOLLY]], P.map);
  return z;
}

function camera(t) {
  // V1: a abertura para antes do HOLD de "Recife." e o yaw não respira (os HOLDs ficam parados)
  const abre = V === 1 ? fim01(sp(t, LENTO), ABRE01C) : sp(t, LENTO);
  let pos = [lerp(0.6, 0.05, abre), lerp(2.6, 0.55, abre), lerp(1.6, 1.42, abre)];
  pos = [pos[0], pos[1] + 0.6 * sp(t - T.a1, P.map), pos[2]];
  let f = 1180, roll = 0, pitch = -0.03, yaw = lerp(-0.06, 0, abre) + (V === 1 ? 0 : 0.012 * Math.sin(t * 0.35));
  const quebra = sp(t - T.mas, P.camera);
  if (V === 1) {
    roll = 0.026 * quebra * (1 - sp(t - T.colapso, P.camera));
    const g = geometria(t);
    const entra = fim01(sp(t - T.colapso, DOLLY));
    pos = [lerp(pos[0], 0, entra), lerp(pos[1], -g.D + 3.6, entra), lerp(pos[2], 1.25, entra)];
    pitch = lerp(pitch, 0, entra); yaw = lerp(yaw, 0, entra);

  } else if (V === 2) {
    roll = -0.038 * quebra;
    const recua = sp(t - (T.colapso + 1.3), P.camera);
    roll = lerp(roll, 0, recua);
    pos = [lerp(pos[0], 0, recua), lerp(pos[1], 2.4 - 0.5 * sp(t - (T.colapso + 1.6), { k: 3, d: 3.46 }), recua), lerp(pos[2], 1.5, recua)];
  } else {
    f = lerp(1180, 600, quebra);
    roll = 0.022 * quebra;
    const sobe = sp(t - T.colapso, DOLLY);

    const heroi = sp(t - (T.numero - 1.0), DOLLY);
    pos = [lerp(pos[0], 0.95, heroi), lerp(pos[1], 1.55, heroi), lerp(pos[2], 2.35, heroi)];

}

function desenharSala(t, c, dsat, k, conjunto, opts = {}) {
  const g = geometria(t);
  const { hw, D, H } = g;
  const cor = (ch) => tinta(ch, dsat, k, conjunto);
  const linha = cor('contorno');
  const dobra = opts.dobra || 0;             // V3: 0 de pé, 1 caído
  const achata = opts.achata || 0;            // V3: móveis viram planta
  const sobeTeto = opts.sobeTeto || 0;
  let s = '';
  let feixesPorCima = '';

  // lá fora: céu em faixas, mar, sol e torres (atrás da parede do fundo)
  const fora = opts.foraOpacidade ?? 1;
  if (fora > 0.01) {
    s += `<g opacity="${fora.toFixed(3)}">`;
    const yc = -80;
    s += poly(caminho([[-120, yc, 1.6], [120, yc, 1.6], [120, yc, 80], [-120, yc, 80]], c), cor('ceu1'), 'none', 0);
    s += poly(caminho([[-120, yc, 1.6], [120, yc, 1.6], [120, yc, 9], [-120, yc, 9]], c), cor('ceu2'), 'none', 0);
    s += poly(caminho([[-120, yc, 1.6], [120, yc, 1.6], [120, yc, 4.2], [-120, yc, 4.2]], c), cor('ceu3'), 'none', 0);
    const sz = solZ(t), sc = tela([SOL_X, SOL_Y, sz], c), sd = profundidade([SOL_X, SOL_Y, sz], c);
    if (sd > PERTO) {
      const r = (c.f * 2.3) / sd;
      s += `<circle cx="${sc[0].toFixed(1)}" cy="${sc[1].toFixed(1)}" r="${(r * 2.6).toFixed(1)}" fill="${cor('halo')}" opacity="0.5"/>`;
      s += `<circle cx="${sc[0].toFixed(1)}" cy="${sc[1].toFixed(1)}" r="${(r * 1.7).toFixed(1)}" fill="${cor('halo')}"/>`;
      s += `<circle cx="${sc[0].toFixed(1)}" cy="${sc[1].toFixed(1)}" r="${r.toFixed(1)}" fill="${cor('sol')}"/>`;
    }
    s += poly(caminho([[-120, -79, -30], [120, -79, -30], [120, -79, 1.6], [-120, -79, 1.6]], c), cor('mar'), 'none', 0);
    for (let i = 1; i < 6; i += 1) s += poly(caminho([[-120, -79, 1.6 - i * 0.9], [120, -79, 1.6 - i * 0.9]], c, false), 'none', cor('marLinha'), 1.4);
    for (const tw of torres) s += caixa(tw.x - tw.w / 2, tw.y - tw.prof, -30, tw.x + tw.w / 2, tw.y, tw.topo, { t: cor('torreTopo'), f: cor(tw.cor), l: cor(tw.cor) }, c, cor('torreLinha'), 1.1);
    s += '</g>';
  }

  // casca da sala; no V3 as paredes giram para fora em torno da aresta do chão
  const th = dobra * Math.PI / 2;
  const esq = (y, z) => [-hw - z * Math.sin(th), y, z * Math.cos(th)];
  const dir = (y, z) => [hw + z * Math.sin(th), y, z * Math.cos(th)];
  const fun = (x, z) => [x, -D - z * Math.sin(th), z * Math.cos(th)];
  s += poly(caminho([[-hw, 0.4, 0], [hw, 0.4, 0], [hw, -D, 0], [-hw, -D, 0]], c), cor('piso'), linha, 2);
  let lin = '';
  for (let x = -hw + 0.6; x < hw - 0.05; x += 0.6) lin += caminho([[x, 0.4, 0.002], [x, -D, 0.002]], c, false);
  for (let y = -0.6; y > -D + 0.05; y -= 0.6) lin += caminho([[-hw, y, 0.002], [hw, y, 0.002]], c, false);
  s += `<path d="${lin}" fill="none" stroke="${cor('pisoLinha')}" stroke-width="1.5"/>`;
  if (sobeTeto < 0.995) {
    const zt = H + sobeTeto * 14;
    let teto = poly(caminho([[-hw, 0.4, zt], [hw, 0.4, zt], [hw, -D, zt], [-hw, -D, zt]], c), cor('teto'), linha, 2);
    // sanca: faixa rebaixada junto às paredes, como na sala da REF-10
    const m = 0.55, zs = zt - 0.001;
    teto += poly(caminho([[-hw + m, 0.4, zs], [hw - m, 0.4, zs], [hw - m, -D + m, zs], [-hw + m, -D + m, zs]], c), cor('sanca'), linha, 1.6);
    for (const [x, y] of [[-1.25, -4.2], [1.25, -4.2], [-1.25, -5.9], [1.25, -5.9]]) {
      const pc = tela([x, y, zs], c), dp = profundidade([x, y, zs], c);
      if (dp > PERTO) teto += `<ellipse cx="${pc[0].toFixed(1)}" cy="${pc[1].toFixed(1)}" rx="${(c.f * 0.09 / dp).toFixed(1)}" ry="${(c.f * 0.035 / dp).toFixed(1)}" fill="${cor('spot')}" stroke="${linha}" stroke-width="1"/>`;
    }
    s += `<g opacity="${(1 - sobeTeto).toFixed(3)}">` + teto + '</g>';
  }
  s += poly(caminho([esq(0.4, 0), esq(-D, 0), esq(-D, H), esq(0.4, H)], c), cor('esquerda'), linha, 2);
  s += poly(caminho([dir(0.4, 0), dir(-D, 0), dir(-D, H), dir(0.4, H)], c), cor('direita'), linha, 2);
  // quadro na parede direita
  s += poly(caminho([dir(-2.5, 1.05), dir(-4.2, 1.05), dir(-4.2, 2.1), dir(-2.5, 2.1)], c), cor('passepartout'), linha, 2);
  s += poly(caminho([dir(-2.65, 1.2), dir(-4.05, 1.2), dir(-4.05, 1.95), dir(-2.65, 1.95)], c), cor('quadro'), 'none', 0);
  const qs = []; for (let i = 0; i <= 16; i += 1) { const a = Math.PI * i / 16; qs.push(dir(-3.35 + 0.32 * Math.cos(a), 1.2 + 0.32 * Math.sin(a))); }
  s += poly(caminho(qs, c), cor('quadroSol'), 'none', 0);
  // parede do fundo com o vão da janela (evenodd)
  const J = { x0: -1.85, x1: 1.85, z0: 0.25, z1: 2.5 };
  const ext = caminho([fun(-hw, 0), fun(hw, 0), fun(hw, H), fun(-hw, H)], c);
  const vao = caminho([fun(J.x0, J.z0), fun(J.x0, J.z1), fun(J.x1, J.z1), fun(J.x1, J.z0)], c);
  if (ext) s += `<path d="${ext}${vao}" fill="${cor('fundo')}" fill-rule="evenodd" stroke="${linha}" stroke-width="2" stroke-linejoin="round"/>`;
  // caixilho: moldura, montante e travessa (no V1 a moldura engrossa e as divisões saem)
  const mold = opts.moldura || { e: 0.08, montanteX: 0, travessaZ: 1.95, divisoes: 1 };
  const barra = (x0, z0, x1, z1) => poly(caminho([fun(x0, z0), fun(x1, z0), fun(x1, z1), fun(x0, z1)], c), cor('moldura'), linha, 1.2);
  s += barra(J.x0 - mold.e, J.z0 - mold.e, J.x1 + mold.e, J.z0);
  s += barra(J.x0 - mold.e, J.z1, J.x1 + mold.e, J.z1 + mold.e);
  s += barra(J.x0 - mold.e, J.z0, J.x0, J.z1);
  s += barra(J.x1, J.z0, J.x1 + mold.e, J.z1);
  if (mold.divisoes > 0.01) {
    s += `<g opacity="${mold.divisoes.toFixed(3)}">`;
    s += barra(mold.montanteX - 0.035, J.z0, mold.montanteX + 0.035, J.z1);
    s += barra(J.x0, mold.travessaZ - 0.03, J.x1, mold.travessaZ + 0.03);
    s += '</g>';
  }

  // luz do sol no chão: os vidros projetados pela direção do sol
  const sz = solZ(t);
  const S = [SOL_X, SOL_Y, sz];
  const W = [0, -D, 1.37];
  const L = [W[0] - S[0], W[1] - S[1], W[2] - S[2]];
  const intens = opts.luz ?? 1;
  if (L[2] < -0.02 && intens > 0.01 && dobra < 0.02) {
    const paineis = [[J.x0, mold.montanteX - 0.035, J.z0, mold.travessaZ - 0.03], [mold.montanteX + 0.035, J.x1, J.z0, mold.travessaZ - 0.03],
                     [J.x0, mold.montanteX - 0.035, mold.travessaZ + 0.03, J.z1], [mold.montanteX + 0.035, J.x1, mold.travessaZ + 0.03, J.z1]];
    let luz = '', feixes = '';
    for (const [x0, x1, z0, z1] of paineis) {
      const pts = [[x0, z0], [x1, z0], [x1, z1], [x0, z1]].map(([x, z]) => {
        const sP = -z / L[2];
        return [x + L[0] * sP, -D + L[1] * sP, 0.004];
      });
      const rec = recortaRet(pts, -hw, hw, -D, 0.4);
      if (rec.length >= 3) luz += caminho(rec, c);
      // feixe: do topo do vidro até a borda de lá da mancha
      const longe = rec.length >= 3 ? rec.reduce((a, p) => (p[1] > a[1] ? p : a), rec[0]) : null;
      if (longe) feixes += caminho([[x0, -D, z1], [x1, -D, z1], [x1 + L[0] * (-z0 / L[2]), longe[1], 0.01], [x0 + L[0] * (-z0 / L[2]), longe[1], 0.01]], c);
    }
    s += `<path d="${luz}" fill="${cor('luz')}" opacity="${intens.toFixed(3)}"/>`;
    feixesPorCima = `<path d="${feixes}" fill="${cor('feixe')}" opacity="${intens.toFixed(3)}"/>`;
  }

  // cota da área no chão: linhas que abrem do centro e "75 m²" pintado
  if (opts.cota > 0.001) {
    const a = opts.cota;
    const yC = -2.05;
    const xL = lerp(0, -hw + 0.15, a), xR = lerp(0, hw - 0.15, a);
    let cl = caminho([[xL, yC, 0.006], [xR, yC, 0.006]], c, false);
    cl += caminho([[xL, yC - 0.14, 0.006], [xL, yC + 0.14, 0.006]], c, false) + caminho([[xR, yC - 0.14, 0.006], [xR, yC + 0.14, 0.006]], c, false);
    if (!opts.semLinhaCota) s += `<path d="${cl}" fill="none" stroke="${cor('cota')}" stroke-width="2.5" stroke-linecap="round"/>`;
    s += textoNoPlano('75 m²', { base: [0.1, -2.4, 0.006], X: [1, 0, 0], U: [0, -1, 0], tam: 0.42, fonte: '600 {px} Fraunces', cor: cor('cota'), opacidade: invLerp(0.35, 0.8, a) }, c);
  }

  // tapete e móveis (baixam no V3)
  const hz = (z) => z * (1 - achata);
  s += poly(caminho([[-1.6, -3.1, 0.008], [1.25, -3.1, 0.008], [1.25, -5.6, 0.008], [-1.6, -5.6, 0.008]], c), cor('tapete'), cor('tapeteBorda'), 3);
  const moveis = [
    { d: profundidade([-2.55, -4.5, 0.4], c), s: () => {
        const so = { t: cor('sofaT'), f: cor('sofaF'), l: cor('sofaL') };
        return caixa(-hw + 0.02, -5.7, 0.08, -hw + 0.26, -3.3, hz(0.82), so, c, linha)
          + caixa(-hw + 0.24, -5.7, 0.08, -hw + 1.0, -3.3, hz(0.4), so, c, linha)
          + caixa(-hw + 0.24, -5.7, 0.08, -hw + 1.0, -5.5, hz(0.58), so, c, linha)
          + caixa(-hw + 0.24, -3.5, 0.08, -hw + 1.0, -3.3, hz(0.58), so, c, linha); } },
    { d: profundidade([-0.3, -4.45, 0.2], c), s: () => caixa(-0.6, -4.75, 0, 0.0, -4.15, hz(0.26), { t: cor('mesaF'), f: cor('mesaL'), l: cor('mesaL') }, c, linha)
        + caixa(-0.95, -5.0, hz(0.26), 0.35, -3.9, hz(0.34), { t: cor('mesaT'), f: cor('mesaF'), l: cor('mesaL') }, c, linha) },
    { d: profundidade([hw - 0.3, -4.4, 0.3], c), s: () => caixa(hw - 0.48, -5.6, 0.12, hw - 0.02, -3.4, hz(0.5), { t: cor('rackT'), f: cor('rackF'), l: cor('rackL') }, c, linha) },
  ].sort((a, b) => b.d - a.d);
  for (const m of moveis) s += m.s();

  // cortinas e vento
  const tv = tempoVento(t);
  // V1: o vento só começa em "super ventilado" (a abertura fica parada no HOLD de "Recife.")
  const forca = (opts.vento ?? 1) * (V === 1 ? sp(t - T.a2, P.map) : 0.25 + 0.75 * sp(t - T.a2, P.map));
  if (opts.cortina !== 0) {
    for (const [x0, x1, fase] of [[J.x0 - 0.75, J.x0 + 0.05, 0], [J.x1 - 0.05, J.x1 + 0.75, 1.7]]) {
      const pts = [[x0, -D + 0.12, H - 0.05], [x1, -D + 0.12, H - 0.05]];
      for (let i = 0; i <= 8; i += 1) {
        const u = 1 - i / 8;
        const x = lerp(x0, x1, u);
        const onda = Math.sin(tv * 2.1 + u * 5 + fase) * 0.5 + 0.5;
        pts.push([x + 0.05 * Math.sin(tv * 1.7 + u * 3 + fase) * forca, -D + 0.12 + forca * (0.18 + 0.32 * onda), 0.06 + 0.05 * onda * forca]);
      }
      s += `<g opacity="${(1 - dobra).toFixed(3)}">` + poly(caminho(pts, c), cor('cortina'), linha, 1.2) + '</g>';
    }
  }
  if (forca > 0.01 && dobra < 0.5) {
    let ven = '';
    const linhas = [[-0.55, 1.85, 0.3], [0.5, 1.6, 1.4], [-0.05, 2.15, 2.3], [0.85, 2.0, 3.6]];
    for (const [x0, z0, ph] of linhas) {
      const pts = [];
      for (let i = 0; i <= 28; i += 1) {
        const y = lerp(-D + 0.35, -2.5, i / 28);
        const abre = (y + D) / D;
        pts.push([x0 * (1 + 1.2 * abre) + 0.18 * Math.sin(0.8 * y + ph), y, z0 - 0.15 * abre + 0.08 * Math.sin(1.2 * y + ph * 1.7)]);
      }
      ven += caminho(pts, c, false);
    }
    const desloc = -tv * 360;
 s += feixesPorCima; feixesPorCima = '';
    s += `<path d="${ven}" fill="none" stroke="${cor('vento')}" stroke-width="2.6" stroke-linecap="round"  stroke-dasharray="420 700" stroke-dashoffset="${desloc.toFixed(1)}" opacity="${(0.8 * forca * (opts.ventoOpacidade ?? 1)).toFixed(3)}"/>`;
  }
  return s + feixesPorCima;
}
