<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEREDA · Cena 09 · o celular vira ferramenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Plus+Jakarta+Sans:wght@400..800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/marca.css">
<style>
  /* base e celular: as mesmas regras da cena 08 (o primeiro quadro é o último dela, pixel a pixel) */
  html, body { margin: 0; background: var(--bg-obsidian); }
  body.tela { min-height: 100vh; overflow: hidden; }
  #c {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; flex: none;
    background: var(--bg-paper); color: var(--ink-primary);
    font-family: var(--font-sans); font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .grade {
    position: absolute; inset: 0; background-size: 48px 48px;
    background-image:
      linear-gradient(to right, rgba(127, 136, 112, 0.09) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(127, 136, 112, 0.09) 1px, transparent 1px);
  }
  svg.camada { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  .camada-div { position: absolute; inset: 0; }
  .t { position: absolute; white-space: nowrap; line-height: 1.15; }

  #tela { position: absolute; overflow: hidden; }
  #moldura { position: absolute; box-sizing: border-box; border-style: solid; border-color: #222426; }
  #pagina { position: absolute; left: 0; top: 0; background: var(--bg-paper); font-family: var(--font-sans); font-variant-numeric: tabular-nums; overflow: hidden; }
  .pg { position: absolute; white-space: nowrap; line-height: 1.2; }
  .pg-head { position: absolute; left: 0; right: 0; top: 0; height: 58px; background: rgba(242, 235, 221, 0.95); border-bottom: 1px solid var(--border-hairline); }
  .pg-marca { font: 500 18px/1 var(--font-display); letter-spacing: 0.14em; font-variation-settings: 'opsz' 19; }  /* --wordmark-weight 500 e --wordmark-tracking 0.14em do :root do index.html */
  .pg-kicker { font: 700 10.5px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--brand-rust); }
  .pg-link { font: 600 11.5px/1 var(--font-sans); color: var(--brand-rust); display: inline-flex; align-items: center; gap: 5px; }
  .pg-tit { font: 500 30px/1.1 var(--font-display); letter-spacing: -0.035em; }
  .pg-sub { font: 400 12.5px/1.3 var(--font-sans); color: var(--ds-muted); }
  .pg-card { position: absolute; left: 12px; right: 12px; background: #FFFFFF; border: 1px solid rgba(23, 23, 23, 0.09); border-radius: 14px; box-sizing: border-box; }
  .pg-abas { position: absolute; left: 12px; right: 12px; height: 46px; border-radius: 12px; background: #EAE2D3; border: 1px solid rgba(23, 23, 23, 0.06); box-sizing: border-box; }
  .pg-aba { position: absolute; top: 4px; bottom: 4px; display: flex; align-items: center; justify-content: center; font: 500 12px/1 var(--font-sans); color: var(--ds-muted); border-radius: 9px; }
  .pg-aba.on { background: #FFFFFF; color: var(--ink-primary); font-weight: 600; }
  .pg-q-n { font: 500 11px/1 var(--font-sans); color: var(--brand-rust); }
  .pg-q-t { font: 600 15.5px/1.2 var(--font-sans); letter-spacing: -0.025em; }
  .pg-q-d { font: 400 10.5px/1.2 var(--font-sans); color: var(--ds-muted); }
  .pg-dock { position: absolute; left: 0; right: 0; bottom: 0; height: 66px; background: rgba(250, 246, 238, 0.9); border-top: 1px solid rgba(23, 23, 23, 0.08); box-sizing: border-box; padding: 8px 12px 10px; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; }
  .pg-dock span { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 11px/1 var(--font-sans); letter-spacing: 0.01em; color: var(--ink-muted); }
  .pg-dock span.on { color: var(--ink-primary); font-weight: 600; }
  .pg-dock span.on svg { color: var(--brand-orange); }
  #debug { position: absolute; right: 16px; top: 12px; font: 500 16px/1 var(--font-mono); color: var(--ink-muted); }
  #c .t, #c .pg { font-variant-numeric: tabular-nums; }

  /* ícones como máscara CSS: dentro de zoom de layout que muda, SVG inline perde o determinismo
     (achado da cena 05). Antes de o zoom do celular mudar, os ícones da cena 08 ficam como SVG inline */
  .ic { display: block; flex: none; background: currentColor; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  .pg-dock span.on .ic { color: var(--brand-orange); }

  /* modo no imóvel (renderLiveVisit, field): .vv-session, .vv-clock, .vv-progress, .vv-question */
  .vv-sessao { position: absolute; background: #F7F2E8; border-radius: 12px; }
  .vv-relogio { font: 500 31px/1.2 var(--font-sans); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .vv-pequeno { font: 400 11px/1.2 var(--font-sans); color: #625C51; }
  .vx-sec { position: absolute; display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: #FFFCF7; border: 1px solid #DCD3C3; border-radius: 10px; font: 600 13px/1 var(--font-sans); color: var(--ink-primary); }
  .vv-h2 { font: 500 23px/1.2 var(--font-display); }
  .vv-prog { position: absolute; height: 5px; background: #EAE6DA; border-radius: 4px; }
  .vv-check { position: absolute; width: 25px; height: 25px; box-sizing: border-box; border: 1px solid #B8AD99; border-radius: 50%; }
  .vv-qt { font: 600 16px/1.45 var(--font-sans); letter-spacing: -0.025em; }
  .vv-qd { font: 400 11px/1.55 var(--font-sans); color: #625C51; }
  .vv-seta { position: absolute; color: var(--brand-rust); }

  /* folha de baixo (showDossierSheet + .drawer-panel), dentro da tela do celular */
  /* véu do .drawer-backdrop do protótipo (0,65), sem o desfoque */
  #veu { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: rgba(13, 14, 15, 0.65); }
  #folha { position: absolute; left: 0; background: #FFFFFF; box-sizing: border-box; border-top-style: solid; border-top-color: rgba(23, 23, 23, 0.12); overflow: hidden; }
  #folhaZ { position: absolute; left: 0; top: 0; width: 414px; height: 520px; }
  .sh-alca { position: absolute; width: 38px; height: 4px; border-radius: 999px; background: #DCD3C3; }
  .sh-x { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: #F5F0E8; display: flex; align-items: center; justify-content: center; color: var(--ink-primary); }
  .sh-h { font: 500 22px/1.2 var(--font-display); letter-spacing: -0.025em; }
  .sh-copy { font: 400 13px/1.6 var(--font-sans); color: #625C51; }
  .sh-face { font: 500 27px/1.26 var(--font-sans); letter-spacing: -0.04em; }
  .sh-hint { font: 400 12px/1.5 var(--font-sans); color: #625C51; }
  .sh-rot { font: 400 11px/1.3 var(--font-sans); color: #625C51; }
  .sh-trilho { position: absolute; height: 6px; border-radius: 3px; background: #EFE9DC; box-sizing: border-box; border: 1px solid #C9BEA8; overflow: hidden; }
  .sh-trilho i { position: absolute; left: 0; top: 0; bottom: 0; background: #B94E36; }
  .sh-polegar { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #B94E36; box-sizing: border-box; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px #B94E36; }
  .sh-btn { position: absolute; display: flex; align-items: center; justify-content: center; gap: 9px; box-sizing: border-box; border-radius: 10px; background: var(--brand-orange); font: 600 13px/1 var(--font-sans); color: var(--ink-primary); }
  .sh-num { font: 500 32px/1.26 var(--font-sans); letter-spacing: -0.04em; }
  .sh-num small { font-size: 13px; letter-spacing: 0; }
  .sh-seg { position: absolute; box-sizing: border-box; background: #EAE3D5; border: 1px solid #DCD3C3; border-radius: 11px; }
  .sh-segp { position: absolute; background: #FFFFFF; border-radius: 7px; }
  .sh-segb { position: absolute; display: flex; align-items: center; justify-content: center; font: 500 12px/1 var(--font-sans); color: #625C51; }
  .sh-lab { font: 600 12px/1.25 var(--font-sans); }
  .sh-sel { position: absolute; box-sizing: border-box; background: #FFFCF7; border: 1px solid #D7CDBB; border-radius: 8px; }

  /* rótulos do filme */
  .rot-janela { font: 600 26px/1 var(--font-sans); color: #4A4740; }
  .etiqueta { font: 600 19px/1 var(--font-sans); color: var(--ink-secondary); padding: 10px 16px; border-radius: 999px; border: 1.5px dashed var(--border-strong); background: #FFFFFF; }
  .etiqueta.grande { font-size: 40px; padding: 17px 28px; border-width: 2px; }
  .nota { font: 400 25px/1.3 var(--font-sans); color: var(--ds-muted); }
  .nota b { font-weight: 600; color: var(--ink-primary); }
  .etiqueta.duas { line-height: 1.15; white-space: pre; text-align: left; }
  .rot-mapa { font: 600 28px/1 var(--font-sans); color: #4A4740; }
  .rot-predio { font: 600 40px/1 var(--font-sans); color: var(--ink-primary); letter-spacing: -0.01em; }
  /* toast do protótipo (.vereda-toast), dentro da tela do app, no zoom dela */
  #avisoZ { position: absolute; left: 0; top: 0; width: 414px; }
  .toast-app { position: absolute; right: 24px; bottom: 24px; display: inline-flex; align-items: center; gap: 10px; background: var(--ink-primary); color: var(--bg-paper-light); border: 1px solid var(--brand-orange); padding: 12px 18px; border-radius: 10px; font: 400 12px/1.2 var(--font-mono); white-space: nowrap; }
  .toast-app b { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-orange); display: inline-block; }
  /* as promessas do anúncio fictício da cena 01 (cena01.html, .chip), em traço tracejado de declarado */
  #promessas { position: absolute; inset: 0; }
  .chip { position: absolute; display: inline-flex; align-items: center; gap: 14px; padding: 15px 26px 15px 20px; border-radius: 999px; background: rgba(255, 251, 243, 0.94); border: 2px dashed #78716C; font: 600 30px/1 var(--font-sans); color: var(--ink-primary); white-space: nowrap; }
  .chip svg { width: 30px; height: 30px; color: var(--brand-rust); flex: none; }
  .chip .aspas { color: var(--brand-rust); font-family: var(--font-display); font-weight: 500; }
  .chip.pequeno { font-size: 21px; padding: 10px 17px 10px 13px; gap: 9px; }
  .chip.pequeno svg { width: 20px; height: 20px; }
  .rodape-ficcao { font: 500 20px/1 var(--font-sans); color: #A39C8E; letter-spacing: 0.01em; }
  .trecho { font: 500 20px/1 var(--font-sans); color: #8A8172; }

  /* a sala da cena 01 (quadro final da variante 1) e o papel que a limpa */
  #sala { position: absolute; inset: 0; overflow: hidden; }
  #papel { position: absolute; inset: 0; background-color: var(--bg-paper); background-size: 48px 48px;
    background-image:
      linear-gradient(to right, rgba(127, 136, 112, 0.09) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(127, 136, 112, 0.09) 1px, transparent 1px); }
  .recorte { position: absolute; overflow: hidden; }
  .numero-v1 { font-family: var(--font-display); font-weight: 600; font-variation-settings: 'opsz' 144; letter-spacing: -0.035em; line-height: 0.86; color: var(--brand-orange); text-align: center; white-space: nowrap; }
  .apoio-v1 { font: 500 46px/1 var(--font-sans); letter-spacing: 0.01em; color: #F2EBDD; }

  /* resumo "Sua visita, registrada." (renderLiveVisit, summary) em escala de filme, 2,4x */
  #resumo { position: absolute; width: 900px; }
  .rs-kicker { font: 600 24px/1 var(--font-sans); color: var(--brand-rust); text-transform: uppercase; letter-spacing: 0.07em; }
  .rs-h1 { font: 500 82px/1.1 var(--font-display); font-variation-settings: 'opsz' 34; letter-spacing: -0.045em; margin-top: 22px; }
  .rs-p { font: 400 31px/1.6 var(--font-sans); color: #625C51; margin-top: 18px; }
  .rs-card { margin-top: 40px; background: #FFFFFF; border: 2px solid rgba(23, 23, 23, 0.07); border-radius: 38px; padding: 46px 43px 44px; }
  .rs-forte { font: 600 34px/1.5 var(--font-sans); margin-top: 34px; }
  .rs-nota { font: 400 31px/1.45 var(--font-sans); color: #625C51; margin-top: 12px; }
</style>
</head>
<body>
<div id="c">
  <div class="grade"></div>
  <div id="mundoW" style="position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden"><svg class="camada" id="mundo" viewBox="0 0 1920 1080"></svg></div>
  <div class="camada-div" id="rotMundo"></div>
  <div id="tela"><div id="pagina"></div><div id="veu"></div><div id="folha"><div id="folhaZ"></div></div><div id="avisoZ"><div class="toast-app" id="toast"><b></b><span>Orientação registrada</span></div></div></div>
  <div id="moldura"></div>
  <div id="sala"></div>
  <div id="promessas"></div>
  <div id="papel"></div>
  <div id="resumo"></div>
  <svg class="camada" id="sobre" viewBox="0 0 1920 1080">
    <path id="linha" fill="none" stroke="#F47745" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  <div class="camada-div" id="rotulos"></div>
  <svg class="camada" id="cursor-camada" viewBox="0 0 1920 1080">
    <circle id="onda" r="0" fill="none" stroke="#F47745" stroke-width="3" opacity="0" />
    <path id="cursor" fill="#171717" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" opacity="0" />
  </svg>
</div>

<script type="module">
import { clamp, lerp, sp, spring, track, swap, pending, press, mixColor, rgba, roundedQuad, PRESETS as P } from '../lib/motion.js';
import { IMOVEL, ANUNCIO, LOTE } from './dados.js';
import { salaV1 } from '../lib/sala01.js';

// ---------------------------------------------------------------------------
// Variante. Padrão: a janela da cena 01 volta SEM o número (decisão pendente do usuário), com as
// quatro promessas do anúncio fictício da cena 1 sobre o vidro. ?eco=1 (ou ?v=eco, para o
// render.mjs) traz "R$ 125 MIL" e "em cinco anos" como na cena 01, no lugar das promessas.
// ---------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const ECO = Q.get('eco') === '1' || Q.get('v') === 'eco';

// ---------------------------------------------------------------------------
// Linha do tempo. A fala manda (cerca de 2,5 palavras/s) e cada evento cai na palavra de sentido:
// B1 "celular", "ferramenta", "investigação"; B2 "GPS", "confirmar", "prédio"; B3 "bússola",
// "testar", "sol", "janela"; B4 "microfone", "medir", "barulho", "rua"; B5 "prejuízo", "começo";
// B6 "desmascara". O B1 termina em dois-pontos e emenda no GPS: o primeiro HOLD é o do B2.
// Nenhum movimento passa de cerca de 40 px por quadro a 30 fps.
// ---------------------------------------------------------------------------
const T = {
  // B1 · toque em Começar visita; a tela vira o modo no imóvel; a planta nasce do aparelho
  comecar: 0.85, troca: 1.08, celular: 2.15, planta: 2.5, janela: 3.9, rotJanela: 4.12, rotPlanta: 4.2,
  // B2 · zoom de layout para fora: planta → prédio → lote. O celular fica parado (só a página rola);
  // o anel de precisão sai da borda do celular e encolhe até o pino; o contorno do prédio fica contínuo
  zoomOut: 4.95, rolagem: 5.1, gps: 5.3, predio: 5.55, lote: 5.75, pino: 5.75, anel: 5.72, rotLote: 6.5, encolhe: 6.3, confirma: 6.85, nota: 6.85, rotPredio: 6.9,
  // B3 · o anel vira o aro da bússola; o cursor arrasta o polegar de "Orientação manual" até 98°
  zoomIn: 7.76, aro: 7.78, folha: 7.8, pega: 9.0, rotManual: 9.05, solta: 9.6, extensao: 9.6, arco: 9.85, rotJanela3: 9.9, rotSol: 9.98,
  // B4 · Guardar orientação → toast; a folha vira "Escute com a janela aberta"; a onda vem da rua; Aberta
  guardar: 11.15, morph: 11.37, toast: 11.42, toastFim: 12.25, ruidoB: 12.32, rotDemo: 11.55, onda: 11.6, rotRuido: 11.75, aberta: 13.0, abre: 13.12,
  // B5 · a onda vira o peitoril da janela que se abre; a câmera entra pela janela; a sala da cena 01
  // volta; a linha sobe pela janela até o alto e as promessas do anúncio voltam ao vidro
  aplaina: 14.05, saiCel: 14.1, portal: 14.15, peitoril: 14.15, some: 14.2, sala: 15.4, sobe: 15.4,
  // B6 · a linha desce como um limpador; acima dela o vidro vira papel com o registro da visita
  limpa: 17.3,
  // saída · o resto sai; a linha fica no peitoril, que é a régua da cena 10
  saida: 19.02,
};
T.arrasta = T.pega + 0.04;
const DUR = 20.3;
const HOLDS = [7.7, 10.8, 14.0, 17.0, 19.0, DUR];

// molas (forma fechada, motion.js). w0 = raiz de k; zeta = d / (2 w0)
const MOVE = { k: 12.25, d: 7 };     // zeta 1: o celular vai para a esquerda (B1)
const MOVE3 = { k: 36, d: 12 };      // zeta 1: o celular desce para mostrar a folha (B3)
const SAICEL = { k: 10.24, d: 6.4 }; // zeta 1: o celular sai pela esquerda
const ROLA = { k: 25, d: 10 };       // zeta 1: a página rola (B2)
const ZOUT = { k: 6.76, d: 5.2 };    // zeta 1: zoom para fora (a parede oeste entra a menos de 40 px/quadro)
const ZIN = { k: 12.96, d: 7.2 };    // zeta 1: zoom de volta à sala (a parede oeste sai a menos de 40 px/quadro)
const FOLHA = { k: 19.36, d: 8.8 };  // zeta 1: a folha sobe enquanto o celular desce (39 px/quadro)
const MORPH = { k: 49, d: 14 };      // zeta 1: a folha da luz vira a do ruído
const VOA = { k: 9, d: 6 };          // zeta 1: o anel sai do celular e vai ao pino (38 px/quadro)
const ENC = { k: 25, d: 10 };        // zeta 1: o anel encolhe até o pino
const ARO = { k: 49, d: 14 };        // zeta 1: o anel vai ao tamanho da bússola
const ARR = { k: 42, d: 9.7 };       // zeta 0,75: a agulha vai a 98° e assenta (passa 2,8%)
const EXT = { k: 49, d: 14 };        // zeta 1: a agulha se prolonga
const ARCO = { k: 49, d: 14 };       // zeta 1: o arco da manhã se abre
const ABRE = { k: 90, d: 15 };       // zeta 0,79: as folhas da janela abrem
const FRENTE = { k: 7.02, d: 5.3 };  // zeta 1: a frente da onda corre da rua ao aparelho (39 px/quadro)
const PLANO = { k: 49, d: 14 };      // zeta 1: a onda perde amplitude
const PORTAL = { k: 6.76, d: 5.2 };  // zeta 1: o vão da janela vira o vidro da cena 01 (40 px/quadro)
const SALA = { k: 25, d: 10 };       // zeta 1: a sala aparece em volta do vidro
const PEIT = { k: 25, d: 10 };       // zeta 1: a onda vira o peitoril da janela que se abre
const RODO = { k: 14.44, d: 7.6 };   // zeta 1: a linha sobe e desce pelo vidro (39 px/quadro no pico)
const PAPEL = { k: 36, d: 12 };      // zeta 1: o papel toma o quadro
const ESTICA = { k: 64, d: 16 };     // zeta 1: a linha se estica até a régua
// mola normalizada: chega a 1 no fim (98%) e para, para o quadro do HOLD ficar exato
const nsp = (t, p) => clamp(sp(t, p) / 0.98);

// ---------------------------------------------------------------------------
// Entrada: a moldura do celular no último quadro da cena 08 (cena08.html, folhaGeo), com as
// mesmas contas, para o primeiro quadro sair idêntico.
// ---------------------------------------------------------------------------
const ZP = 1.046, BEZEL = 9.5, RF = [734, 78, 452, 924];
const G08 = (() => {
  const t = 21.9 - 1 / 30, Tz = 15.8, Tm = 18.9 + 0.75;
  const FL = { x: 1120, y: 84, w: 736 }, ZF = 1.45, XF = (1920 - 736 * ZF) / 2, YF = 40;
  const zz = (q) => ({ x: lerp(FL.x, XF, q), y: lerp(FL.y, YF, q), z: lerp(1, ZF, q) });
  const g0 = zz(clamp(sp(Tm - Tz, { k: 9, d: 6 }), 0, 1));
  const m = clamp(sp(t - Tm, { k: 36, d: 12 }), 0, 1);
  const bz = BEZEL * clamp(sp(t - Tm, { k: 64, d: 16 }), 0, 1);
  const R0 = [g0.x, g0.y, FL.w * g0.z, 1140 - g0.y];
  const fora = R0.map((v, i) => lerp(v, RF[i], m));
  return { fora, bz, raio: lerp(44, 30, m) };
})();
const TELA_W0 = G08.fora[2] - 2 * G08.bz;
const PH1 = { x: 96, y: 56, z: 1.3 };                 // B1 e B2: o alto da tela à esquerda
const PH3 = { x: 80, y: 1060 - 924 * 1.45, z: 1.45 }; // B3 e B4: a parte de baixo da tela (as folhas)
const PH_KEYS = [[T.celular, PH1, MOVE], [T.folha, PH3, MOVE3], [T.saiCel, { ...PH3, x: -780 }, SAICEL]];
function celular(t) {
  const k = (f0, f) => track(t, [[0, f0], ...PH_KEYS.map(([tk, ph, p]) => [tk, f(ph), p])], P.card);
  const fora = [k(G08.fora[0], (p) => p.x), k(G08.fora[1], (p) => p.y), k(G08.fora[2], (p) => 452 * p.z), k(G08.fora[3], (p) => 924 * p.z)];

// geometria da folha de baixo: o topo dela anda em coordenadas do quadro (não soma o movimento do
// celular), e é guardado em px do app dentro da tela
function folhaGeo(t, C) {
  const zf = C.zp, telaH = C.telaR[3] / zf;
  const sobe = nsp(t - T.folha, FOLHA), mf = nsp(t - T.morph, MORPH);
  const hF = lerp(H_LUZ, H_RUIDO, mf);
  const alvo = C.telaR[1] + (telaH - hF) * zf;
  const topoTela = lerp(1080, alvo, sobe);
  return { zf, telaH, hF, topoTela, topo: (topoTela - C.telaR[1]) / zf };
}

    // o resumo entra quando a linha já passou por ele e sai no começo da saída; "trecho do resumo"
    const aR = swap(t, T.resumo, HOLDS[4] + 0.22);
    vis(resumo, aR);
    if (aR > 0.001) pos(resumo, 960 - 450, R_TOPO + 12 * pending(t, T.resumo + 0.04, P.type));
    const aTr = swap(t, T.trecho, HOLDS[4] + 0.22);
    vis(trecho, aTr);
    if (aTr > 0.001) pos(trecho, 1410 - trecho.offsetWidth, R_TRECHO + 8 * pending(t, T.trecho + 0.04, P.type));
  }

  // ===== cursor: Começar visita, o polegar de "Orientação manual", Guardar e Aberta ======
  {
    // alvos na geometria do celular e da folha no instante do toque
    const naFolha = (tc, x, y) => { const Cc = celular(tc), Fc = folhaGeo(tc, Cc); return [Cc.telaR[0] + x * Fc.zf, Fc.topoTela + y * Fc.zf]; };
    const CLIQUES = [
      [T.comecar, [1095, 762], [130, 50], [160, 70], '#171717', 0.45],
      [T.guardar, naFolha(T.guardar, 360, 355), [120, 50], [150, 40], '#171717', 0.2],
      [T.aberta, naFolha(T.aberta, 360, 245), [140, 30], [150, 60], '#F47745', 0.45],
    ];
    let cur = [1880, 1180], vc = 0, ondaP = cur, onda = 0, ondaCor = '#F47745';
    for (const [c, alvo, de, para, cor, dur] of CLIQUES) {
      const entraP = [alvo[0] + de[0], alvo[1] + de[1]], saiP = [alvo[0] + para[0], alvo[1] + para[1]];
      const v = swap(t, c - 0.32, c + 0.42, { delayIn: 0, durIn: 0.1, leadOut: 0, durOut: 0.14 });
      if (v > vc) { vc = v; cur = track(t, [[c - 0.32, entraP], [c - 0.29, alvo], [c + 0.16, saiP]], P.cursor); }
      if (t >= c && t < c + dur) { onda = (t - c) / dur; ondaP = alvo; ondaCor = cor; }
    }
    // arraste: o cursor pega o polegar do controle deslizante, leva até 98° e solta
    const polegarTela = (tt) => { const Cc = celular(tt), Fc = folhaGeo(tt, Cc); return [Cc.telaR[0] + (26 + 362 * clamp(angulo(tt) / 359)) * Fc.zf, Fc.topoTela + 281 * Fc.zf]; };
    const vD = swap(t, T.pega - 0.32, T.solta + 0.42, { delayIn: 0, durIn: 0.1, leadOut: 0, durOut: 0.14 });
    let presso = press(t, [T.comecar, T.guardar, T.aberta]);
    if (vD > vc) {
      vc = vD;
      const p0 = polegarTela(Math.min(t, T.pega));
      if (t < T.pega) cur = track(t, [[T.pega - 0.32, [p0[0] + 160, p0[1] + 90]], [T.pega - 0.29, p0]], P.cursor);
      else if (t < T.solta) cur = polegarTela(t);
      else { const p1 = polegarTela(T.solta); cur = track(t, [[T.solta, p1], [T.solta + 0.06, [p1[0] + 150, p1[1] + 90]]], P.cursor); }
      presso = t < T.pega ? 0 : t < T.solta ? clamp((t - T.pega) / 0.07) : 1 - sp(t - T.solta, P.button);
    }
    const esc = (1 - 0.16 * presso) * lerp(0.7, 1, vc);
    const cursorEl = $('cursor');
    cursorEl.setAttribute('d', polyD(CURSOR.map(([x, y]) => [cur[0] + x * esc, cur[1] + y * esc])));
    cursorEl.setAttribute('opacity', vc.toFixed(3));
    const od = $('onda');
    od.setAttribute('cx', f1(ondaP[0])); od.setAttribute('cy', f1(ondaP[1]));
    od.setAttribute('stroke', ondaCor);
    od.setAttribute('r', (6 + 15 * sp(onda * 0.45, P.button)).toFixed(1));
    od.setAttribute('opacity', (onda > 0 ? 0.8 * (1 - onda) : 0).toFixed(3));
  }

  if (dbg) dbg.textContent = `${t.toFixed(2)} s`;
}

// marcos que dependem de outros
T.b4Sai = HOLDS[1] + 0.2;       // a bússola, o prolongamento e o arco saem no começo do B4
// promessas: cada uma entra quando a linha, subindo, já está 20 px acima dela
for (const p of PROMESSAS) p.tIn = quando(T.sobe, (y) => y < p.y - 20);
T.ecoNum = quando(T.sobe, (y) => y < 225);                // o número (eco) sobe depois que a linha passou
T.ecoApoio = T.ecoNum + 0.35;
// o resumo e "trecho do resumo" entram quando a linha, descendo, já passou 20 px abaixo deles
const R_TOPO = 246, R_BASE = 746, R_TRECHO = 762;
T.resumo = quando(T.limpa, (y) => y > R_BASE + 20);
T.trecho = quando(T.limpa, (y) => y > R_TRECHO + 22 + 20);
// o rodapé "anúncio fictício" sai quando a última promessa foi varrida
T.fimFiccao = quando(T.limpa, (y) => y > Math.max(...PROMESSAS.map((p) => p.y)) + 60);

const ESTADOS = [

  { id: 'FIM', nome: 'Papel com a grade e a régua (primeiro quadro da cena 10)', t: DUR - 1 / 30 },
];
const SONS = [
  { t: T.comecar, tipo: 'click', evento: 'toque em Começar visita' },

  ...PROMESSAS.map((p, i) => ({ t: p.tIn, tipo: 'tick', ganho: 0.5, evento: `promessa ${i + 1} do anúncio` })),
  { t: T.limpa, tipo: 'sweep', dur: 1.2, ganho: 0.8, evento: 'o limpador varre o vidro' },

window.POC = {
  id: 'CENA-09', variante: ECO ? 'eco do R$ 125 MIL (para comparar)' : 'janela com as promessas do anúncio, sem o número (padrão)', duracao: DUR, fps: 30, estados: ESTADOS, holds: HOLDS,
  cliques: [T.comecar, T.pega, T.guardar, T.aberta], arraste: { de: T.pega, ate: T.solta, angulo: [0, 98], controle: 'Orientação manual (vv-compass-range)' }, marcos: T, sons: SONS,
  tiras: [{ nome: 'toque', t0: T.comecar - 0.02 }, { nome: 'arraste', t0: T.pega + 0.02 }, { nome: 'portal', t0: 14.5 }, { nome: 'limpador', t0: 17.6 }],
  comparar: ESTADOS.map((e) => ({ t: e.t, nome: e.id })),
  // a cena 10 começa aqui: papel com a grade de 48 px e a linha laranja deitada (sem marcas nem meses)
  saida: { fundo: { cor: '#F2EBDD', grade: { passo: 48, cor: 'rgba(127,136,112,0.09)', origem: [0, 0] } }, linha: { x0: SAIDA.x0, x1: SAIDA.x1, y: SAIDA.y, largura: SAIDA.largura, cor: '#F47745', pontas: 'round' } },
};
window.seek = (t) => render(t);
window.__pronto = (async () => {
  await document.fonts.ready;
  const todo = document.getElementById('c').textContent + ' ×·—–→²ºçãõéêíóúâÁÉ?“”°0123456789:%';
  await Promise.all([
    '500 30px Fraunces', '500 23px Fraunces', '500 22px Fraunces', '500 19px Fraunces', '500 18px Fraunces', '500 82px Fraunces', '600 100px Fraunces',
    '400 12px "Plus Jakarta Sans"', '500 12px "Plus Jakarta Sans"', '600 12px "Plus Jakarta Sans"', '700 12px "Plus Jakarta Sans"', '800 12px "Plus Jakarta Sans"',
    '400 12px "JetBrains Mono"', '500 16px "JetBrains Mono"',
  ].map((f) => document.fonts.load(f, todo)));
  await document.fonts.ready;
  // passa por toda a linha do tempo antes de liberar: subconjuntos de fonte e máscaras carregam agora
  for (let t = 0; t <= DUR; t += 0.25) render(t);
  await document.fonts.ready;
  render(0);
  return true;
})();

if (!navigator.webdriver) {
  document.body.classList.add('tela');
  const c = $('c');
  const ajusta = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); Object.assign(c.style, { position: 'absolute', transformOrigin: '0 0', transform: `scale(${s})`, left: `${(innerWidth - 1920 * s) / 2}px`, top: `${(innerHeight - 1080 * s) / 2}px` }); };
  addEventListener('resize', ajusta); ajusta();
  const aoVivo = Q.has('live');
  // ao vivo: espaço ou → leva ao próximo HOLD; o último é DUR (a passagem para a cena 10)
  const PARADAS = HOLDS;
  let t = 0, alvo = aoVivo ? PARADAS[0] : DUR, rodando = true, antes = null, ultimo = null;
  const passo = (agora) => { if (antes !== null && rodando) { t += (agora - antes) / 1000; if (t >= alvo) { t = alvo; if (!aoVivo) t = 0; else rodando = false; } } antes = agora; if (t !== ultimo) { render(t); ultimo = t; } requestAnimationFrame(passo); };
  addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown') {
      const base0 = rodando ? alvo : t;
      const i = PARADAS.findIndex((h) => h > base0 + 1e-3);
      if (aoVivo) { if (i >= 0) { alvo = PARADAS[i]; rodando = true; } } else rodando = !rodando;
      e.preventDefault();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      const anteriores = PARADAS.filter((h) => h < t - 1e-3);
      t = anteriores.length ? anteriores[anteriores.length - 1] : 0;
      alvo = aoVivo ? (PARADAS.find((h) => h > t + 1e-3) ?? DUR) : DUR;
      rodando = !aoVivo;
      render(t); ultimo = t;
      e.preventDefault();
    } else if (e.key === 'r') { t = 0; alvo = aoVivo ? PARADAS[0] : DUR; rodando = true; }
  });
  window.__pronto.then(() => requestAnimationFrame(passo));
}
