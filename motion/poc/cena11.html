<style>

  html, body { margin: 0; background: var(--bg-obsidian); }

    position: relative; width: 1920px; height: 1080px; overflow: hidden; flex: none;

    -webkit-font-smoothing: antialiased;
  }
  .grade {
    position: absolute; inset: 0; background-size: 48px 48px;
    background-image:
      linear-gradient(to right, rgba(127, 136, 112, 0.09) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(127, 136, 112, 0.09) 1px, transparent 1px);
  }
  svg.camada { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  .camada-div { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .t { position: absolute; white-space: nowrap; line-height: 1.15; }
  #debug { position: absolute; right: 16px; top: 12px; font: 500 16px/1 var(--font-mono); color: var(--ink-muted); }

  .cel { position: absolute; left: 0; width: 350px; box-sizing: border-box; padding: 8px; border-radius: 46px; background: #222426; border: 2px solid #222426; box-shadow: 0 0 0 2px rgba(23,23,23,.2); }
  .cel::before { content: ''; position: absolute; z-index: 2; left: 50%; top: 4px; width: 64px; height: 8px; margin-left: -32px; border-radius: 999px; background: #222426; }
  .scr { position: relative; width: 330px; border-radius: 36px; overflow: hidden; background: var(--bg-paper); }
  .scr img { position: absolute; left: 0; top: 0; width: 330px; height: 609px; display: block; }

  /* textos do filme */
  .kicker { font: 700 24px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand-rust); }
  .chip { display: inline-flex; align-items: center; gap: 14px; box-sizing: border-box; padding: 0 30px 0 26px; height: 76px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid var(--border-hairline); font: 600 42px/1 var(--font-sans); letter-spacing: -0.01em; color: var(--ink-primary); }
  .chip i { display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--brand-orange); flex: none; }
  .numero { font-family: var(--font-display); font-weight: 500; font-variation-settings: 'opsz' 40; line-height: 1; letter-spacing: -0.02em; color: var(--ink-primary); }
  .apoio { font: 500 56px/1.15 var(--font-sans); letter-spacing: -0.01em; color: var(--ink-secondary); }

  /* estratos (os da cena 4, agora em papel): rótulos dentro de cada faixa */
  #pilhaW { position: absolute; overflow: hidden; }

  .base-num { text-align: right; }

  /* equipe: cartões tipográficos com as palavras da fala (sem nomes: a fala não diz nomes) */
  .revC { position: absolute; overflow: hidden; }
  .cartao { position: absolute; left: 0; box-sizing: border-box; background: #FFFFFF; border: 2px solid rgba(23, 23, 23, 0.09); border-radius: 34px; }
  .cartao i { position: absolute; left: 38px; top: 79px; width: 14px; height: 14px; border-radius: 50%; background: var(--brand-orange); }

  /* piloto */
  .data { font-family: var(--font-display); font-weight: 500; font-variation-settings: 'opsz' 40; font-size: 96px; line-height: 1; letter-spacing: -0.02em; color: var(--ink-primary); }

<body>
<div id="c">

<script type="module">
import { clamp, lerp, sp, roundedQuad, PRESETS as P } from '../lib/motion.js';
import { desenharCostura, COSTURAS } from '../lib/costuras.js';

const Q = new URLSearchParams(location.search);

// ---------------------------------------------------------------------------
// Linha do tempo. A fala nova (gravação de 18/10/2026, cerca de 3,8 palavras/s, 13,2 s) manda e
// cada evento cai na palavra de sentido (tempos estimados por sílaba, ±0,3 s dentro da cena):
// A "protótipo" 0,1 · "15 telas" 1,0 a 1,4. B "cruza" 1,6 · "meio milhão" 2,0 · "registros" 2,6.
// C "validado" 3,2 · "especialistas do mercado" 3,8 · "CIn-UFPE" 5,1 · fim da frase 5,75.
// D "equipe de estudantes" 6,7 · "desenvolvimento" 8,25 · "inovação" 9,0.
// E "Campus Mobile" 9,9 · "piloto" 11,0 · "rua" 11,5 · "junho de 2027" 11,9 a 13,2.
// Nenhum movimento passa de cerca de 40 px por quadro a 30 fps (pico de uma mola crítica
// normalizada = 0,375 · w · distância). Sai antes, entra depois.
// ---------------------------------------------------------------------------
const T = {
  // A · a régua vira escada; as três telas sobem dela por recorte; "15 telas"
  escada: 0.04, cel: [0.14, 0.30, 0.46], kick1: 0.30, num1: 0.95, lab1: 1.15,
  // B · as telas afundam; "15 telas" sai e "mais de meio milhão de registros" entra; os estratos sobem
  afunda: [1.72, 1.76, 1.80], achata: 2.20, sai1: 1.95, kick2: 2.10, num2: 2.12, lab2: 2.45, pilha: 2.60,
  fio: 3.50, lote: 4.60, preenche: 5.15,   // a linha só sobe com os estratos parados (as marcas acendem alinhadas)
  // C · validado com
  kick3: 3.20, chip: [3.75, 5.05],
  // D · os estratos descem; a linha em pé deita e vira a base; a equipe sobe dela
  sai2: 5.85, desce: 5.95, deita: 6.00, estende: 7.05, titulo: 6.80, card: [8.15, 8.85],
  // E · a base estica, desce na rua de perfil; Campus Mobile, piloto na rua, junho de 2027
  estica: 9.55, campus: 9.95, rua: 10.35, tique: 10.85, piloto: 11.00, junho: 11.90,
  // saída · tudo sai junto; a linha deixa a base e a rua e assenta reta (costura C11-12)
  sai: 13.25, assenta1: 13.28, retrai: 13.30, assenta2: 13.38, sobeRua: 13.77,
};
const DUR = 14.3;
const HOLDS = [5.8, 13.2, DUR];

// molas (forma fechada, motion.js); todas com amortecimento crítico (zeta = d / 2 raiz de k = 1), sem overshoot
const REVELA = { k: 21, d: 9.17 };   // o recorte de um celular cresce 629 px (39 px/quadro no pico, com o degrau subindo)
// o recorte mira 35 px acima do topo da moldura e para nele (Math.min). Com a mola de antes (k 24) e
// sem essa folga, a cauda deixava o topo do terceiro celular cortado até 1,67 s, no meio de "15 telas";
// agora os três ficam inteiros em 1,10 · 1,27 · 1,40 s, antes do quadro A1 (1,45 s). Os inícios são os
// mesmos, e até cerca de 1 s o recorte anda quase igual ao de antes.
const REVELA_PASSA = 35;
const AFUNDA = { k: 23.04, d: 9.6 }; // o celular desce 650 px e some (39 px/quadro no pico)
const AFUNDA_PX = 650;
const ESCADA = { k: 49, d: 14 };     // a régua vira escada (80 px)
const ACHATA = { k: 196, d: 28 };    // a escada volta a ser reta depois do pico da descida das telas
const PILHA = { k: 42, d: 13 };      // os estratos sobem e descem 478 px (36 px/quadro)
const FIO = { k: 30, d: 11 };        // a linha sobe 560 px pelos estratos; a ponta direita recolhe 460 px
const RECOLHE = { k: 7.6, d: 5.52 }; // a ponta esquerda recolhe 1.180 px até o cruzamento (39 px/quadro)
const LOTE_M = { k: 36, d: 12 };     // o contorno do lote se desenha
const POP = { k: 144, d: 24 };       // nós e pino acendem, sem passar do tamanho
const DEITA = { k: 13.7, d: 7.4 };   // a linha deita: a ponta corre um arco de 880 px (40 px/quadro)
const ESTENDE = { k: 25, d: 10 };    // deitada, a linha se estende 620 px até x 160 (39 px/quadro com o resto do giro)
const CARTAO = { k: 81, d: 18 };     // um cartão sobe 174 px de baixo da base (20 px/quadro); na saída desce 244 px (27 px/quadro)
const ESTICA = { k: 64, d: 16 };     // a base estica 120 px
const DESCE = { k: 27, d: 10.4 };    // a ponta desce e corre pela rua (595 px de traço, 37 px/quadro)
const TIQUE = { k: 64, d: 16 };      // o tique do marco sobe 373 px
const PREDIO = { k: 36, d: 12 };     // os prédios sobem de trás do meio-fio (até 400 px, 30 px/quadro)
const PREDIO_SAI = 0.52;             // s: na saída descem a própria altura em curva suave (39 px/quadro no pico)
const ARVORE_SAI = 0.35;
const ASSENTA1 = { k: 49, d: 14 };   // a base desce 70 px até y 930
const ASSENTA2 = { k: 64, d: 16 };   // a ponta esquerda vai a 300
const RETRAI = { k: 49, d: 14 };     // a ponta da rua recolhe de 1940 a 1620, rente ao meio-fio (28 px/quadro)
const SOBE_RUA = { k: 196, d: 28 };  // a rua sobe 45 px até y 930 (8 px/quadro), depois que os prédios sumiram; para antes de DUR − 0,1 s
// mola normalizada: chega a 1 no fim (98%) e para, para o quadro do HOLD e o da emenda ficarem exatos
const nsp = (t, p) => clamp(sp(t, p) / 0.98);
const t98 = (p) => { let t = 0; while (nsp(t, p) < 1) t += 0.001; return t; };
// entrada e saída de texto: aparece depois de tIn e some a partir de tOut
const alfa = (t, tIn, tOut = Infinity, dIn = 0.14, dOut = 0.12) => Math.min(clamp((t - tIn) / dIn), clamp((tOut + dOut - t) / dOut));
const subida = (t, tIn, d = 16) => d * (1 - sp(t - tIn, P.type));
const smoothT = (u, dur) => { const q = clamp(u / dur); return q * q * (3 - 2 * q); };

// ---------------------------------------------------------------------------
// Geometria
// ---------------------------------------------------------------------------
const Y0 = 860;                                  // a régua da cena 10 (costura C10-11)
const ENTRADA = COSTURAS['C10-11'].linhas[0];    // M160 860 L1760 860
const SAIDA = COSTURAS['C11-12'].linhas[0];      // M300 930 L1620 930
const XS = 1340;                                 // o ponto onde a linha atravessa os estratos
const YL = 300;                                  // o centro do lote
const LFIO = Y0 - YL;                            // 560 px de linha em pé
const LBASE = XS - 160;                          // deitada, ela vai do cruzamento a x 160
const XJ = 1460;                                 // junho de 2027: onde a base desce na rua
const YRUA = 975;                                // o meio-fio da rua de perfil
const PENA = (YRUA - Y0) + (1940 - XJ);          // o traço que desce no meio-fio e corre pela rua
const T_DEITADA = Math.max(T.deita + t98(DEITA), T.estende + t98(ESTENDE));   // a linha deitada vira a base

// A · três telas reais do protótipo, na ordem do filme (dentro, fora, a visita), inteiras, num
// celular em pé. Cada uma fica sobre um degrau da escada laranja.
const PASTA = '../../motion-references/contact-sheets/prototipo/';
const SCR_W = 330, SCR_H = 609;                  // a captura de 520 × 960 em tamanho fixo (não muda no tempo)
const TELAS = [
  { arq: 'dossie-dentro/edificio-abas.png', x: 660, degrau: 860, nome: 'Dossiê · Edifício · Antes de decidir' },
  { arq: 'entorno/01-entorno-rolagem-01.png', x: 1055, degrau: 820, nome: 'Dossiê · Entorno · Explore o entorno' },
  { arq: 'visita/01_visita_preparar_01.png', x: 1450, degrau: 780, nome: 'Visita · 6 pontos para conferir' },
];
for (const tl of TELAS) tl.H = SCR_H + 20;       // moldura de 10 px em volta da tela
const CEL_W = 350, FOLGA = 14;                   // a moldura fica 14 px acima do degrau
const ESC_X = [160, 1032, 1427, 1830];           // ponta esquerda, quinas da escada e ponta direita

// B · estratos proporcionais ao tamanho das três bases (pesquisa de viabilidade; Defesa Civil:
// docs/ui-ux.md 8.4). A marca de cada faixa diz o vínculo com o prédio (ui-ux 8.4):
// ponto no IPTU (o endereço), barra curta no Licenciamento (raio de 150 m), barra larga na Defesa Civil (bairro).
const BASES = [
  { nome: 'IPTU 2026', n: 422776, txt: '422.776', textura: 'linhas', marca: 'ponto', w: 0 },
  { nome: 'Licenciamento', n: 113305, txt: '113.305', textura: 'hachura', marca: 'barra', w: 110 },
  { nome: 'Defesa Civil 2024', n: 80173, txt: '80.173', textura: 'pontos', marca: 'barra', w: 300 },
];
const SOMA = BASES.reduce((a, b) => a + b.n, 0);   // 616.254: "mais de meio milhão"
const PW = { x: 820, top: 380, w: 940, h: 476 };   // janela dos estratos: o fundo é o chão (y 856)
const S_PILHA = 450, TOPO_PILHA = PW.h - S_PILHA;  // 26 px de folga na janela
{
  let y = TOPO_PILHA;
  // a linha de cada faixa (nome · marca · número) fica no alto dela: o rótulo sai do chão logo depois da borda
  for (const b of BASES) { b.h = (S_PILHA * b.n) / SOMA; b.y = y; y += b.h; b.ry = b.y + Math.min(24, (b.h - 31.5) / 2) + 15.75; b.cy = PW.top + b.ry; }
}
const OFF_FORA = PW.h + 2;                          // a pilha inteira abaixo do chão
// o lote onde a linha chega: um quadrilátero um pouco irregular, como um lote real
const LOTE_PTS = [[XS - 102, YL - 60], [XS + 98, YL - 55], [XS + 96, YL + 61], [XS - 99, YL + 57]];

// D · equipe: as duas palavras da fala, em cartões que sobem da base
const EQUIPE = ['desenvolvimento', 'inovação'];
const CARD = { h: 170, gap: 26, x0: 176, base: 856, pad: 108 };   // pad: o ponto e as margens em volta da palavra
const CARTAO_PX = CARD.h + 4, CARTAO_SAI_PX = CARD.h + 74;   // na saída a base desce 70 px

// E · rua de perfil: fachadas em pé sobre o meio-fio, à direita de junho de 2027
const PREDIOS = [
  { x: 1500, w: 96, h: 275, cols: 2 }, { x: 1646, w: 124, h: 395, cols: 3 },
  { x: 1784, w: 88, h: 300, cols: 2 }, { x: 1884, w: 120, h: 400, cols: 3 },
];
const ARVORE = { x: 1621, tronco: 52, copa: 20 };
const MARCO = { r: 7.5, topo: 476 };             // nó na quina e o tique que sobe até sob "junho de 2027"

// ---------------------------------------------------------------------------
// DOM e utilitários
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function el(cls, html, pai) { const e = document.createElement('div'); e.className = cls; e.innerHTML = html; pai.appendChild(e); return e; }
function svgEl(tag, attrs, pai) { const e = document.createElementNS(NS, tag); for (const [a, v] of Object.entries(attrs)) e.setAttribute(a, v); pai.appendChild(e); return e; }
const vis = (e, a) => { e.style.opacity = a.toFixed(3); e.style.visibility = a > 0.001 ? 'inherit' : 'hidden'; };
const pos = (e, x, y) => { e.style.left = x.toFixed(2) + 'px'; e.style.top = y.toFixed(2) + 'px'; };
const caixa = (e, x, y, w, h) => { e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.width = w + 'px'; e.style.height = h + 'px'; };
const attr = (e, a, v) => { if (e.getAttribute(a) !== v) e.setAttribute(a, v); };
const f2 = (v) => (Math.round(v * 100) / 100).toString();

// a linha principal: o path que desenharCostura cria (a costura de entrada, intacta no quadro 0)
const costura = $('costura');
const { linhas: [linha] } = desenharCostura('C10-11', costura);

// polilinha → d, sem pontos repetidos nem quinas retas (no quadro da emenda o d volta ao da costura)
function polyD(subs) {
  let d = '';
  for (const pts of subs) {
    const q = [];
    for (const p of pts) { const u = q[q.length - 1]; if (!u || Math.hypot(p[0] - u[0], p[1] - u[1]) > 0.01) q.push(p); }
    for (let i = q.length - 2; i >= 1; i -= 1) {
      const a = q[i - 1], b = q[i], c = q[i + 1];
      const cruz = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      const dentro = (b[0] - a[0]) * (c[0] - b[0]) + (b[1] - a[1]) * (c[1] - b[1]) >= 0;
      if (Math.abs(cruz) < 0.01 && dentro) q.splice(i, 1);
    }
    if (q.length < 2) continue;
    d += 'M' + q.map((p) => f2(p[0]) + ' ' + f2(p[1])).join(' L');
  }
  return d;
}

// ----- A: celulares (moldura + captura inteira, dentro de uma janela de recorte) -----
const fones = $('fones');
const IMGS = [];
for (const tl of TELAS) {
  tl.rev = el('rev', '', fones);
  tl.cel = el('cel', '<div class="scr"></div>', tl.rev);
  tl.cel.style.height = tl.H + 'px'; tl.cel.firstChild.style.height = SCR_H + 'px';
  const img = document.createElement('img');
  img.src = PASTA + tl.arq; img.width = SCR_W; img.height = SCR_H; img.alt = tl.nome; img.decoding = 'sync';
  tl.cel.firstChild.appendChild(img);
  IMGS.push(img);
}

// ----- B: estratos em SVG (papel, textura própria, a marca do vínculo no mesmo x) -----
const pilhaW = $('pilhaW'), pilha = $('pilha'), pilhaS = $('pilhaS');
caixa(pilhaW, PW.x, PW.top, PW.w, PW.h);
pilha.style.width = PW.w + 'px';
for (const [a, v] of [['width', PW.w], ['height', PW.h], ['viewBox', `0 0 ${PW.w} ${PW.h}`]]) pilhaS.setAttribute(a, v);
const defs = svgEl('defs', {}, pilhaS);
const pat = (id, w, h, corpo) => { const p = svgEl('pattern', { id, width: w, height: h, patternUnits: 'userSpaceOnUse' }, defs); p.innerHTML = corpo; };
pat('tx-linhas', 16, 14, '<path d="M0 13.5 H16" stroke="rgba(23,23,23,0.08)" stroke-width="1"/>');
pat('tx-hachura', 12, 12, '<path d="M-3 3 L3 -3 M0 12 L12 0 M9 15 L15 9" stroke="rgba(23,23,23,0.08)" stroke-width="1.2"/>');
pat('tx-pontos', 12, 12, '<circle cx="6" cy="6" r="1.5" fill="rgba(23,23,23,0.14)"/>');
const XS_L = XS - PW.x;   // o cruzamento em coordenadas da pilha
const marcaEl = (b, x, y, pai, attrs) => b.marca === 'ponto'
  ? svgEl('circle', { cx: x, cy: f2(y), r: 6, ...attrs }, pai)
  : svgEl('rect', { x: f2(x - b.w / 2), y: f2(y - 4), width: b.w, height: 8, rx: 4, ...attrs }, pai);
for (const b of BASES) {
  svgEl('rect', { x: 0.75, y: f2(b.y), width: PW.w - 1.5, height: f2(b.h), fill: '#FAF6EE' }, pilhaS);
  svgEl('rect', { x: 0.75, y: f2(b.y), width: PW.w - 1.5, height: f2(b.h), fill: `url(#tx-${b.textura})` }, pilhaS);
  svgEl('rect', { x: 0.75, y: f2(b.y), width: PW.w - 1.5, height: f2(b.h), fill: 'none', stroke: '#C9BEA8', 'stroke-width': 1.5 }, pilhaS);
  marcaEl(b, XS_L, b.ry, pilhaS, { fill: '#171717' });
  b.nomeEl = el('base-nome', b.nome, pilha);
  b.numEl = el('base-num', b.txt, pilha);
}

// ----- D: cartões da equipe (sobem inteiros de baixo da base; a palavra só aparece inteira) -----
const equipe = $('equipe');
const CARDS = EQUIPE.map((palavra) => {
  const rev = el('revC', '', equipe);
  const card = el('cartao', `<i></i><div class="palavra">${palavra}</div>`, rev);
  card.style.height = CARD.h + 'px';
  return { rev, card, itens: [...card.children] };
});

// ----- camada de cima: a linha em pé, as marcas acesas, o lote, o pino e o marco de junho -----
const sobre = $('sobre');

function janelasD(p, topo) {

  }
  return d;
}

// seek(t): função pura do tempo
// ---------------------------------------------------------------------------
// degraus da escada (A) e a régua reta (B em diante)
const escada = (t) => nsp(t - T.escada, ESCADA) - nsp(t - T.achata, ACHATA);
const degrauY = (i, t) => Y0 - (Y0 - TELAS[i].degrau) * escada(t);

function linhaD(t) {
  // saída: a base desce a y 930 e a ponta esquerda vai a 300; a ponta da rua recolhe a 1620 rente
  // ao meio-fio e, quando os prédios já sumiram, a rua sobe a y 930: a reta da costura C11-12
  const a1 = nsp(t - T.assenta1, ASSENTA1), a2 = nsp(t - T.assenta2, ASSENTA2);
  const q = nsp(t - T.retrai, RETRAI), r = nsp(t - T.sobeRua, SOBE_RUA);
  if (a1 >= 1 && a2 >= 1 && q >= 1 && r >= 1) return SAIDA.d;
  const e = escada(t);
  let x0 = lerp(160, ESC_X[0], e);
  let xd = lerp(1760, ESC_X[3], e);
  if (t < T_DEITADA) {
    // B: enquanto a linha sobe pelos estratos, as duas pontas da régua recolhem até o cruzamento:
    // fica uma linha só, em pé. Em D é ela que deita e vira a base (camada de cima, o "fio").
    x0 = lerp(x0, XS, nsp(t - T.fio, RECOLHE));
    xd = lerp(xd, XS, nsp(t - T.fio, FIO));
  } else {
    x0 = 160; xd = lerp(XS, XJ, nsp(t - T.estica, ESTICA));   // a base estica até junho de 2027
  }
  if (t >= T.assenta1) {
    const yb = Y0 + (930 - Y0) * a1, yr = YRUA - (YRUA - 930) * r;
    return polyD([[[lerp(x0, 300, a2), yb], [XJ, yb], [XJ, yr], [lerp(1940, 1620, q), yr]]]);
  }
  if (e <= 0 && x0 === 160 && xd === 1760) return ENTRADA.d;
  const pts = [[x0, Y0], [ESC_X[1], Y0], [ESC_X[1], degrauY(1, t)], [ESC_X[2], degrauY(1, t)], [ESC_X[2], degrauY(2, t)], [xd, degrauY(2, t)]];
  if (e <= 0) pts.splice(1, 4);
  // a ponta desce no meio-fio e corre pela rua
  const u = PENA * nsp(t - T.rua, DESCE);
  if (u > 0.01) { pts.push([XJ, Y0 + Math.min(u, YRUA - Y0)]); if (u > YRUA - Y0) pts.push([XJ + u - (YRUA - Y0), YRUA]); }
  return polyD([pts]);
}

function render(t) {
  t = clamp(t, 0, DUR);

  // ===== a linha principal =====================================================
  attr(linha, 'd', linhaD(t));

  // ===== A/B · celulares ========================================================
  // a moldura e o recorte seguem o degrau; o degrau só desce depois do pico da descida da tela
  TELAS.forEach((tl, i) => {
    const rev = Math.min(tl.H, Math.round((tl.H + REVELA_PASSA) * nsp(t - T.cel[i], REVELA)));
    const afunda = Math.round(AFUNDA_PX * nsp(t - T.afunda[i], AFUNDA));
    const fundo = Math.round(degrauY(i, t) - 2);              // o recorte termina no degrau
    const topoCel = Math.round(degrauY(i, t) - FOLGA - tl.H) + afunda;
    const topoJan = topoCel + tl.H - rev;
    const h = fundo - topoJan;
    const on = rev > 0 && h > 0 && topoCel < fundo;
    tl.rev.style.visibility = on ? 'inherit' : 'hidden';
    if (on) { caixa(tl.rev, tl.x, topoJan, CEL_W, h); tl.cel.style.top = (topoCel - topoJan) + 'px'; }
  });
  // "15 telas"
  vis(kick1, alfa(t, T.kick1, T.sai1)); pos(kick1, 114, 384 + subida(t, T.kick1, 10));
  vis(num1, alfa(t, T.num1, T.sai1)); pos(num1, 100, 440 + subida(t, T.num1, 18));
  vis(lab1, alfa(t, T.lab1, T.sai1)); pos(lab1, 112, 668 + subida(t, T.lab1, 14));

  // ===== B · estratos, linha em pé, lote ========================================
  const off = Math.round(OFF_FORA * (1 - nsp(t - T.pilha, PILHA)) + OFF_FORA * nsp(t - T.desce, PILHA));
  const pilhaOn = off < OFF_FORA;
  pilhaW.style.visibility = pilhaOn ? 'inherit' : 'hidden';
  if (pilhaOn) {
    pilha.style.top = off + 'px';
    // como nos cartões: cada rótulo só aparece inteiro acima do chão (nunca sai de trás da linha)
    for (const bs of BASES) for (const [e, fundo] of [[bs.nomeEl, bs.fundoNome], [bs.numEl, bs.fundoNum]]) vis(e, clamp((PW.h - 1 - (off + fundo)) / 10));
  }

  // a linha em pé (sobe pelos estratos) e, em D, deitada para a esquerda e estendida até x 160
  const L = LFIO * nsp(t - T.fio, FIO) + (LBASE - LFIO) * nsp(t - T.estende, ESTENDE);
  const fi = (Math.PI / 2) * nsp(t - T.deita, DEITA);
  const fioOn = L > 0.5 && t < T_DEITADA;
  fio.style.visibility = fioOn ? 'inherit' : 'hidden';
  if (fioOn) attr(fio, 'd', `M${XS} ${Y0} L${f2(XS - L * Math.sin(fi))} ${f2(Y0 - L * Math.cos(fi))}`);
  BASES.forEach((b, i) => {
    const n = ACESAS[i];
    const s = t < tPassa[i] ? 0 : sp(t - tPassa[i], POP);
    const a = alfa(t, tPassa[i], T.sai2, 0.001, 0.12);
    if (b.marca === 'ponto') attr(n, 'r', f2(7.5 * s));
    else { const w = (b.w + 6) * s; attr(n, 'x', f2(XS - w / 2)); attr(n, 'width', f2(w)); }
    vis(n, s > 0.01 ? a : 0);
  });
  // o contorno do lote: desenha a partir da chegada da linha
  const lp = nsp(t - T.lote, LOTE_M), saiLote = alfa(t, T.lote, T.sai2, 0.001, 0.14);
  vis(loteLinha, lp > 0.001 ? saiLote : 0);
  attr(loteLinha, 'stroke-dasharray', lp >= 1 ? 'none' : `${lp.toFixed(4)} 2`);
  vis(loteFill, 0.85 * alfa(t, T.preenche, T.sai2, 0.3, 0.14));
  const rp = t < T_CHEGA ? 0 : sp(t - T_CHEGA, POP);
  attr(pino, 'r', f2(10 * rp)); attr(pinoHalo, 'r', f2(22 * rp));
  vis(pino, rp > 0.01 ? alfa(t, T_CHEGA, T.sai2, 0.001, 0.14) : 0); vis(pinoHalo, rp > 0.01 ? alfa(t, T_CHEGA, T.sai2, 0.001, 0.14) : 0);

  // "mais de meio milhão de registros"; "validado com especialistas do mercado · CIn-UFPE"
  vis(kick2, alfa(t, T.kick2, T.sai2)); pos(kick2, 114, 384 + subida(t, T.kick2, 10));
  vis(num2, alfa(t, T.num2, T.sai2)); pos(num2, 104, 428 + subida(t, T.num2, 18));
  vis(lab2, alfa(t, T.lab2, T.sai2)); pos(lab2, 112, 564 + subida(t, T.lab2, 14));
  vis(kick3, alfa(t, T.kick3, T.sai2)); pos(kick3, 114, 690 + subida(t, T.kick3, 10));
  CHIPS.forEach((c, i) => { vis(c, alfa(t, T.chip[i], T.sai2)); pos(c, 110, 726 + 94 * i + subida(t, T.chip[i], 14)); });

  // ===== D · equipe =============================================================
  vis(titulo, alfa(t, T.titulo, T.sai)); pos(titulo, CARD.x0 - 4, 498 + subida(t, T.titulo, 16));
  // na saída a janela de recorte acompanha a base, que desce 70 px
  const desceBase = Math.round((930 - Y0) * nsp(t - T.assenta1, ASSENTA1));
  CARDS.forEach((c, i) => {
    // o cartão inteiro sobe por top de baixo da base e, na saída, afunda nela
    const off = Math.round(CARTAO_PX * (1 - nsp(t - T.card[i], CARTAO)) + CARTAO_SAI_PX * nsp(t - T.sai - 0.04 * i, CARTAO));
    const hJan = CARD.h + desceBase;
    const on = off < hJan;
    c.rev.style.visibility = on ? 'inherit' : 'hidden';
    if (!on) return;
    c.rev.style.height = hJan + 'px';
    c.card.style.top = off + 'px';
    // e apaga enquanto afunda: o cartão nunca fica vazio na tela
    c.card.style.opacity = (1 - smoothT(t - T.sai - 0.04 * i, 0.16)).toFixed(3);
    // a palavra só aparece quando está inteira acima da base: nunca meia palavra
    c.itens.forEach((e, k) => { const livre = hJan - 1 - (off + c.fundos[k]); vis(e, clamp(livre / 24)); });
  });

  // ===== E · Campus Mobile, piloto e rua =========================================
  const rm = t < T.rua ? 0 : sp(t - T.rua, POP);
  attr(marco, 'r', f2(MARCO.r * rm)); attr(marco, 'cy', String(Y0 + desceBase)); vis(marco, rm > 0.01 ? alfa(t, T.rua, T.sai) : 0);
  const ht = (Y0 - MARCO.r - 4 - MARCO.topo) * nsp(t - T.tique, TIQUE), yt0 = Y0 + desceBase - MARCO.r - 4;
  attr(tique, 'd', `M${XJ} ${f2(yt0)} V${f2(yt0 - ht)}`);
  vis(tique, ht > 0.5 ? alfa(t, T.tique, T.sai) : 0);
  vis(campus, alfa(t, T.campus, T.sai)); pos(campus, POS.campus, 172 + subida(t, T.campus, 14));
  vis(sub, alfa(t, T.piloto, T.sai)); pos(sub, POS.sub, 262 + subida(t, T.piloto, 14));
  vis(data, alfa(t, T.junho, T.sai)); pos(data, POS.data, 356 + subida(t, T.junho, 14));
  vis(leito, alfa(t, T.rua + 0.5, T.sai, 0.3, 0.25));
  PRED_EL.forEach((p, i) => {
    const sobe = nsp(t - T_PREDIO[i], PREDIO), sai = smoothT(t - T.sai, PREDIO_SAI);
    const topo = Math.round(YRUA - 1 - p.h * sobe + (p.h + 2) * sai);
    const on = sobe > 0.002 && topo < YRUA - 1;
    p.g.style.visibility = on ? 'inherit' : 'hidden';
    if (on) {
      attr(p.corpo, 'y', String(topo)); attr(p.janEl, 'd', janelasD(p, topo));
      attr(p.porta, 'y', String(topo + p.h - 36));
    }
  });
  const pa = nsp(t - T_ARVORE, PREDIO) * (1 - smoothT(t - T.sai, ARVORE_SAI));
  arvG.style.visibility = pa > 0.01 ? 'inherit' : 'hidden';
  if (pa > 0.01) {
    const yt = YRUA - 1 - ARVORE.tronco * pa;
    attr(tronco, 'd', `M${ARVORE.x} ${YRUA - 1} V${f2(yt)}`);
    attr(copa, 'cy', f2(yt - ARVORE.copa * pa * 0.7)); attr(copa, 'r', f2(ARVORE.copa * pa));
  }

  if (dbg) dbg.textContent = t.toFixed(3) + ' s';
}

};

window.__pronto = (async () => {
  await document.fonts.ready;
  const todo = document.getElementById('c').textContent + ' ×·—–→²ºçãõéêíóúâÁÉ?“”°0123456789:+.()';
  await Promise.all([

if (!navigator.webdriver) {
  document.body.classList.add('tela');
  const c = $('c');
  const ajusta = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); Object.assign(c.style, { position: 'absolute', transformOrigin: '0 0', transform: `scale(${s})`, left: `${(innerWidth - 1920 * s) / 2}px`, top: `${(innerHeight - 1080 * s) / 2}px` }); };
  addEventListener('resize', ajusta); ajusta();
  const aoVivo = Q.has('live');
  // ao vivo: espaço ou → leva ao próximo HOLD; o último é DUR (a passagem para a cena 12)
  const PARADAS = HOLDS;
  let t = 0, alvo = aoVivo ? PARADAS[0] : DUR, rodando = true, antes = null, ultimo = null;
  const passo = (agora) => { if (antes !== null && rodando) { t += (agora - antes) / 1000; if (t >= alvo) { t = alvo; if (!aoVivo) t = 0; else rodando = false; } } antes = agora; if (t !== ultimo) { render(t); ultimo = t; } requestAnimationFrame(passo); };
  addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown') {
      const base0 = rodando ? alvo : t;
      const i = PARADAS.findIndex((h) => h > base0 + 1e-3);
      if (aoVivo) { if (i >= 0) { alvo = PARADAS[i]; rodando = true; } } else rodando = !rodando;
      e.preventDefault();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      const anteriores = PARADAS.filter((h) => h < t - 1e-3);
      t = anteriores.length ? anteriores[anteriores.length - 1] : 0;
      alvo = aoVivo ? (PARADAS.find((h) => h > t + 1e-3) ?? DUR) : DUR;
      rodando = !aoVivo;
      render(t); ultimo = t;
      e.preventDefault();
    } else if (e.key === 'r') { t = 0; alvo = aoVivo ? PARADAS[0] : DUR; rodando = true; }
  });
  window.__pronto.then(() => requestAnimationFrame(passo));
}
