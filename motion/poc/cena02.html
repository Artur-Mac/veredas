{ const r = rng(81); for (let i = 0; i < 14; i += 1) { const lado = i % 2 ? 1 : -1; torres.push({ x: lado * (5 + r() * 18), w: 2.2 + r() * 3, prof: 2 + r() * 2, y: -46 - r() * 10, topo: 0.6 + r() * 5, cor: ['torreA', 'torreB', 'torreC'][i % 3] }); } torres.sort((a, b) => a.y - b.y); }

function fotoSala(W, Hh, aberta) {

function planta(w, h, vagaSai, contorno) {
  const ap = { x: 18, y: 14, w: w * 0.62, h: h - 28 };
  const vg = { x: ap.x + ap.w + 10 + vagaSai * 60, y: ap.y + ap.h * 0.28, w: w * 0.19, h: ap.h * 0.72 };
  let s = `<rect x="${ap.x}" y="${ap.y}" width="${ap.w.toFixed(1)}" height="${ap.h}" rx="6" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>`;
  s += `<path d="M${(ap.x + ap.w * 0.55).toFixed(1)} ${ap.y}V${(ap.y + ap.h * 0.62).toFixed(1)}M${ap.x} ${(ap.y + ap.h * 0.62).toFixed(1)}H${(ap.x + ap.w).toFixed(1)}" stroke="#171717" stroke-width="1.5" fill="none"/>`;
  s += `<g opacity="${(1 - vagaSai).toFixed(3)}" transform="translate(0 ${(vagaSai * 30).toFixed(1)})"><rect x="${vg.x.toFixed(1)}" y="${vg.y.toFixed(1)}" width="${vg.w.toFixed(1)}" height="${vg.h.toFixed(1)}" rx="5" fill="url(#hachura-vaga)" stroke="#B94E36" stroke-width="2" stroke-dasharray="6 5"/>`;
  s += `<text x="${(vg.x + vg.w / 2).toFixed(1)}" y="${(vg.y + vg.h / 2 + 7).toFixed(1)}" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="700" font-size="19" fill="#B94E36">vaga</text></g>`;

}

  }
  // fachada: a seta para onde a janela olha
  const a = angFachada * Math.PI / 180;
  s += `<path d="M${(-Math.sin(a) * 26).toFixed(1)} ${(Math.cos(a) * 26).toFixed(1)}L${(Math.cos(a) * (r - 44)).toFixed(1)} ${(Math.sin(a) * (r - 44)).toFixed(1)}L${(Math.sin(a) * 26).toFixed(1)} ${(-Math.cos(a) * 26).toFixed(1)}Z" fill="${cores.seta || '#171717'}"/>`;

}

      const anteriores = HOLDS.filter((h) => h < t - 1e-3);
      t = anteriores.length ? anteriores[anteriores.length - 1] : 0;
      alvo = aoVivo ? (HOLDS.find((h) => h > t + 1e-3) ?? DUR) : DUR;
      rodando = !aoVivo;
      render(t); e.preventDefault();
    }
    else if (e.key === 'r') { t = 0; alvo = aoVivo ? HOLDS[0] : DUR; rodando = true; }
  });
  window.__pronto.then(() => requestAnimationFrame(passo));
}
</script>
