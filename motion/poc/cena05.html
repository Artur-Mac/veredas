<style>

  .ninho { display: block; width: 24px; height: 24px; background: no-repeat center / 100% 100% url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cpath d=%22M 18,80 C 7,79 2,66 2,49 C 2,24 20,4 50,3 C 79,2 97,25 97,49 C 97,68 89,80 79,80 C 64,80 34,81 18,80 Z%22 fill=%22%23F47745%22/%3E%3Cpath d=%22M 40,58 C 35,42 40,24 53,23 C 64,22 69,40 64,57 C 59,72 45,72 40,58 Z%22 fill=%22%23F5F0E6%22/%3E%3C/svg%3E"); }

  .chrome-pilula { position: absolute; display: flex; align-items: center; gap: 14px; background: rgba(250, 246, 238, 0.92); border: 1px solid var(--border-hairline); border-radius: 999px; white-space: nowrap; }
  .marca { font: 500 28px/1 var(--font-display); letter-spacing: 0.14em; font-variation-settings: 'opsz' 19; }  /* --wordmark-weight 500 e --wordmark-tracking 0.14em do :root do index.html; desenho do cabeçalho (19 px) */

<body>
<div id="c">

    <path id="forma6" />
  </svg>

    <circle id="onda" r="0" fill="none" stroke="#F47745" stroke-width="3" opacity="0" />
    <circle id="toque" r="0" fill="#171717" opacity="0" />
  </svg>
  <div id="chrome"></div>
</div>

<script type="module">
import { clamp, lerp, smooth, sp, track, swap, pending, press, roundedQuad, rectPts, mixColor, rgba, PRESETS as P } from '../lib/motion.js';
import { SUBSOLO as S, reguaPts, linhaD, marcasD, contornoD, posLetras, reguaEmX, desenharSubsolo } from '../lib/subsolo.js';

// ---------------------------------------------------------------------------
// Linha do tempo (roteiro de 18/10/2026, cerca de 3,8 palavras/s):
//   B1 "A VEREDA faz essa investigação em segundos." de 0,1 a 2,2 s: "VEREDA" 0,3 (a tinta desce até a
//       régua e a marca entra), "faz essa investigação" 0,6 a 1,5 (a tinta escoa; o contorno vazio vira
//       um celular e os nomes das bases entram nele), "segundos" 1,7 (TEMPO vira SEGUNDOS só nas letras
//       que mudam; a régua fica curta). HOLD em 2,30 s
//   B2 "Você cola o link do anúncio no aplicativo" de 2,35 a 4,35 s: a marca vai ao cabeçalho, o celular
//       vem ao centro e a régua entra nele; toque em "Colar link" ("cola", 2,88 s), o link chega e a
//       linha laranja vira o sublinhado dele; toque em "Gerar Dossiê" (4,22 s)
//   B3 "e revelamos tudo possível sobre o imóvel." de 4,4 a 6,0 s: o cartão se recolhe na barra de abas
//       do dossiê, a lista do que o dossiê traz se enche ("tudo possível"), Edifício é selecionado e o
//       celular se fecha na linha ("o imóvel"), que se estende até a da cena 6. HOLD no fim (6,10 s)
// Nada passa de cerca de 40 px por quadro a 30 fps.
// ---------------------------------------------------------------------------
const T = {
  luz: 0.05, pousa: 0.75, marca: 0.40, escoa: 0.80, escoaDur: 0.97,
  regua: 1.00, reguaDur: 0.90, troca: 1.50,
  contorno: 1.10, contornoDur: 0.78, solido: 1.66, nomesDur: 0.55, nomesFora: 1.76, tela: 1.86, app: 1.90,
  b2: 2.35, docaDur: 0.50, move: 2.32, moveDur: 0.50, rolo: 2.35, roloDur: 0.95,
  toque1: 2.88, cola: 2.94, sublinha: 3.02, sublinhaDur: 0.75, toque2: 4.22,
  b3: 4.42, abre: 4.44, abreDur: 0.32, dossie: 4.52, lista: 4.64, listaPasso: 0.035,
  edificio: 5.20, fecha: 5.30, fechaDur: 0.70, linha: 5.38, linhaDur: 0.62,
};
const FIM = T.fecha + T.fechaDur;   // 6,00 s: o quadro é o primeiro da cena 6
const DUR = 6.10;
const HOLDS = [2.30, DUR];

// ---------------------------------------------------------------------------
// Geometria (quadro de 1920 x 1080)
// ---------------------------------------------------------------------------
// a moldura da cena 08 (.app-frame em modo celular, 414 px de app), maior: 1,12x, para o app se ler
// com o celular inteiro no quadro (moldura e raio na mesma escala do 1,35x de antes)
const ZP = 1.12, BEZEL = 10, RAIO_TELA = 31.5;
const FONE_W = 414 * ZP + 2 * BEZEL, FONE_H = 866 * ZP + 2 * BEZEL;   // 483,7 x 989,9
// no B1 à direita (no lugar do contorno); no B2 ao centro; inteiro no quadro, com 45 px em cima e embaixo
const FONE = { w: FONE_W, h: FONE_H, y: (1080 - FONE_H) / 2, x0: 1266.5 - FONE_W / 2, x1: 960.5 - FONE_W / 2 };
const CARD = { x: 14, y: 74, w: 386, h: 168 };         // .scanner-card em px do app
const UL = 87.5;                                       // o sublinhado do link, em px do cartão
// no fecho o celular desce até o sublinhado cair em y = 540 (a linha da cena 6)
const FONE_Y_LINHA = 540 - BEZEL - (CARD.y + UL) * ZP;
const foneY = (t) => lerp(FONE.y, FONE_Y_LINHA, smooth(clamp((t - T.fecha) / T.fechaDur)));
const foneX = (t) => lerp(FONE.x0, FONE.x1, smooth(clamp((t - T.move) / T.moveDur)));
const appX = (t, x) => foneX(t) + BEZEL + x * ZP;      // px do app → quadro
const appY = (t, y) => foneY(t) + BEZEL + y * ZP;
const Y_UL = appY(0, CARD.y + UL);                     // o sublinhado do link no quadro, antes do fecho (236)
const FIELD = [55, 356];                               // o campo do link, em px do cartão
const PAL = { x: S.palavra.x, top: S.palavra.top };
let W_SEG = 558;                                       // largura de SEGUNDOS (medida)
const KM = 96 / 38;                                    // a marca grande: ninho de 96 px (38 px no cabeçalho)
const MARCA_GRANDE = { x: 120, y: 150 };
// barra de abas do dossiê (.ds-tabs) no lugar do cartão, em px do app: 386 x 54, padding e gap de 4, borda de 1
const BAR = { x: 14, y: 85, w: 386, h: 54 };
const SEG_W = (BAR.w - 2 - 8 - 8) / 3;
const segX = (i) => BAR.x + 1 + 4 + i * (SEG_W + 4);
// a linha da cena 6 em t = 0 (cena06.html: barra, de 525,75 a 1394,25, y = 540)
const L6 = [525.75, 1394.25];

// ---------------------------------------------------------------------------
// DOM e utilitários
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function el(cls, html, pai) { const e = document.createElement('div'); e.className = cls; e.innerHTML = html; pai.appendChild(e); return e; }
const vis = (e, a) => { e.style.opacity = a.toFixed(3); e.style.visibility = a > 0.001 ? 'inherit' : 'hidden'; };
const pos = (e, x, y) => { e.style.left = x.toFixed(1) + 'px'; e.style.top = y.toFixed(1) + 'px'; };
const caixa = (e, x, y, w, h) => { e.style.left = x.toFixed(2) + 'px'; e.style.top = y.toFixed(2) + 'px'; e.style.width = w.toFixed(2) + 'px'; e.style.height = h.toFixed(2) + 'px'; };
const hx = (h, a = 1) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16), a];
const INK = hx('#171717'), MUTED = hx('#625C51');
const sm = (t, t0, dur) => smooth(clamp((t - t0) / dur));
const f1 = (v) => v.toFixed(1);
const polyD = (pts) => 'M' + pts.map((p) => f1(p[0]) + ' ' + f1(p[1])).join('L');
const segD = (a, b, y) => `M${f1(a)} ${f1(y)}L${f1(b)} ${f1(y)}`;
// cubic-bezier do CSS (x → y), para a curva de cada trecho do jellySquishBtn do protótipo
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = (s) => ((ax * s + bx) * s + cx) * s, Y = (s) => ((ay * s + by) * s + cy) * s, dX = (s) => (3 * ax * s + 2 * bx) * s + cx;
  return (x) => { let s = x; for (let i = 0; i < 8; i += 1) { const d = dX(s); if (Math.abs(d) < 1e-6) break; s -= (X(s) - x) / d; } return Y(clamp(s)); };
}
const EASE_JELLY = bezier(0.25, 1, 0.5, 1);
// jellySquishBtn (index.html): 0,48 s; quadros-chave de escala x, escala y e deslocamento y (px do app)
const JELLY = [[0, 1, 1, 0], [0.25, 0.93, 0.87, 2], [0.55, 1.04, 1.06, -1.5], [0.78, 0.985, 0.99, 0], [1, 1, 1, 0]];
function jelly(t, t0) {
  const u = (t - t0) / 0.48;
  if (u <= 0 || u >= 1) return [1, 1, 0];
  for (let i = 1; i < JELLY.length; i += 1) {
    if (u <= JELLY[i][0]) {
      const a = JELLY[i - 1], b = JELLY[i], k = EASE_JELLY((u - a[0]) / (b[0] - a[0]));

  vis(olho, aLista * aFecho); vis(h2, aLista * aFecho);
  vis(lista, sm(t, T.lista, 0.08) * aFecho);
  LINHAS.forEach((l, i) => { const a = sm(t, T.lista + 0.02 + i * T.listaPasso, 0.08); vis(l, a); });

  // ===== Edifício: o rótulo da terceira aba; no fecho, faz o caminho até o rótulo da cena 6 ====
  if (fim) {
    rotE.style.fontSize = ''; rotE.style.fontWeight = ''; rotE.style.color = '';
    pos(rotE, 960 - rotE.offsetWidth / 2, 540 - 66);
    vis(rotE, 1);
  } else {
    const u = sm(t, T.linha, T.linhaDur);
    const fsA = 12 * ZP;
    const fsE = lerp(fsA, 34, u);
    rotE.style.fontSize = fsE.toFixed(2) + 'px';
    rotE.style.fontWeight = selE_ >= 0.5 ? '700' : '500';
    rotE.style.color = rgba(mixColor(MUTED, INK, selE_));
    const ex = appX(t, segX(2) + SEG_W / 2), ey = appY(t, BAR.y + 27);
    // o alvo anda com a linha (que desce com o celular) e fica 49 px acima dela, como na cena 6
    const cxE = lerp(ex, 960, u), cyE = lerp(ey, appY(t, CARD.y + UL) - 540 + (540 - 66 + 17), u);
    pos(rotE, cxE - rotE.offsetWidth / 2, cyE - fsE / 2);
    vis(rotE, aAbas);
  }

  // ===== a linha laranja: sublinhado do link (B2), linha sob as abas (B3), a linha da cena 6 ======
  const gs = sm(t, T.sublinha, T.sublinhaDur);
  const ux = appX(t, CARD.x + FIELD[0]), ux1 = appX(t, CARD.x + FIELD[1]);
  const ul = sm(t, T.linha, T.linhaDur);
  const a0 = lerp(ux, L6[0], ul), a1 = lerp(lerp(ux, ux1, gs), L6[1], ul);
  // a linha anda com o celular: no fecho ele desce e ela chega a y = 540 no último quadro
  if (!fim && t > T.sublinha && a1 - a0 > 0.5) { sub.setAttribute('d', segD(a0, a1, appY(t, CARD.y + UL))); sub.style.visibility = 'visible'; }
  else sub.style.visibility = 'hidden';
  barra6.style.visibility = fim ? 'visible' : 'hidden';
  forma6.style.visibility = fim ? 'visible' : 'hidden';

  // ===== os nomes das bases entram no celular ("faz essa investigação") =========================
  const aNomes = 1 - sm(t, T.nomesFora, 0.12);
  NOMES.forEach((n, k) => {
    const en = sm(t, n.t0, T.nomesDur);
    // cada nome vai para dentro da tela do celular pelo caminho mais curto (encolhe de 22 para 18 px)
    const fs = lerp(22, 18, en);
    const wf = n.w22 * 18 / 22, x0 = FONE.x0 + 26, x1 = FONE.x0 + FONE.w - 26;
    const xf = wf > x1 - x0 ? (x0 + x1) / 2 - wf / 2 : clamp(n.x, x0, x1 - wf);
    const x = lerp(n.x, xf, en), y = lerp(n.y, n.y - 70, en);
    n.e.style.fontSize = fs.toFixed(2) + 'px';
    n.e.style.color = rgba([23, 23, 23, lerp(0.30, 0.55, en)]);
    pos(n.e, x, y);
    const voando = en > 0 && en < 1 && t < T.tela + 0.1;
    n.e.classList.toggle('vazado', voando);
    if (voando) n.e.style.backgroundPosition = `${(-(x - 6)).toFixed(1)}px ${(-(y - 2)).toFixed(1)}px`;
    vis(n.e, aNomes);
  });

  // ===== TEMPO → SEGUNDOS: só as letras que mudam rolam =====================================
  const aPal = swap(t, -1, T.b2 + 0.2);
  vis(palavra, aPal);
  if (aPal > 0.001) {
    palavra.style.top = (PAL.top - 6 * (1 - clamp((T.b2 + 0.1 - t) / 0.1))).toFixed(1) + 'px';
    const pp = (d) => clamp(sp(t - (T.troca + d), P.type) / 0.985);   // assenta de vez (o HOLD fica parado)
    LV.forEach((v, i) => {
      if (i in SAEM) {
        const p = pp(SAEM[i]);
        v.e.style.left = v.x.toFixed(2) + 'px';
        v.e.style.top = (-LEVA * p).toFixed(2) + 'px';
        const op = 1 - clamp(p / 0.5);
        v.e.style.opacity = op.toFixed(3); v.e.style.visibility = op > 0.001 ? 'inherit' : 'hidden';
      } else v.e.style.visibility = 'hidden';
    });
    LN.forEach((n, j) => {
      if (j in ENTRAM) {
        const p = pp(ENTRAM[j]);
        n.e.style.left = n.x.toFixed(2) + 'px';
        n.e.style.top = (LEVA * (1 - p)).toFixed(2) + 'px';
        const op = clamp((p - 0.05) / 0.45);
        n.e.style.opacity = op.toFixed(3); n.e.style.visibility = op > 0.001 ? 'inherit' : 'hidden';
      } else n.e.style.visibility = 'hidden';
    });
    for (const [i, j] of FICAM) {
      const v = LV[i];
      const x = lerp(v.x, LN[j].x, i === 4 ? clamp(sp(t - T.troca, O_DESLIZA) / 0.985) : pp(0));
      v.e.style.left = x.toFixed(2) + 'px'; v.e.style.top = '0px';
      v.e.style.opacity = '1.000'; v.e.style.visibility = 'inherit';
    }
    for (const l of [...LV, ...LN]) { l.e.style.color = '#171717'; }
  }

  // ===== chrome: a marca entra grande no "VEREDA" e vai ao cabeçalho no começo do B2 ===========
  const aLogo = swap(t, T.marca, Infinity, { durIn: 0.2 });
  vis(logo, aLogo);
  const dk = sm(t, T.b2, T.docaDur);
  if (dk >= 1) {
    Object.assign(logo.style, { left: '56px', top: '40px', padding: '10px 22px 10px 14px', gap: '', background: '', borderColor: '' });
    logoSvg.setAttribute('width', '38'); logoSvg.setAttribute('height', '38');
    logoMarca.style.fontSize = '';
  } else {
    const k = lerp(KM, 1, dk);
    const gx = MARCA_GRANDE.x - 1 - 14 * KM, gy = MARCA_GRANDE.y - 1 - 10 * KM + 10 * pending(t, T.marca + 0.04, P.type);
    logo.style.left = lerp(gx, 56, dk).toFixed(2) + 'px';
    logo.style.top = lerp(gy, 40, dk).toFixed(2) + 'px';
    logo.style.padding = `${(10 * k).toFixed(2)}px ${(22 * k).toFixed(2)}px ${(10 * k).toFixed(2)}px ${(14 * k).toFixed(2)}px`;
    logo.style.gap = (14 * k).toFixed(2) + 'px';
    logo.style.background = `rgba(250,246,238,${(0.92 * dk).toFixed(3)})`;
    logo.style.borderColor = `rgba(226,217,200,${dk.toFixed(3)})`;
    logoSvg.setAttribute('width', (38 * k).toFixed(2)); logoSvg.setAttribute('height', (38 * k).toFixed(2));
    logoMarca.style.fontSize = (28 * k).toFixed(2) + 'px';
  }

  // ===== o dedo: só nos dois toques que a fala narra (Colar link e Gerar Dossiê) =================
  const PT1 = [appX(t, CARD.x + COLAR[0] + COLAR[2] / 2 + 8), appY(t, CARD.y + COLAR[1] + COLAR[3] / 2 + 2)];
  const PT2 = [appX(t, CARD.x + 262), appY(t, CARD.y + BOT[1] + BOT[3] / 2 + 2)];
  const cur = t < T.toque1 + 0.6 ? PT1 : PT2;
  const toque = $('toque'), od = $('onda');
  // o dedo aparece antes de cada toque e sai logo depois (não fica parado sobre o botão)
  const aT = Math.max(swap(t, T.toque1 - 0.2, T.toque1 + 0.4, { delayIn: 0, durIn: 0.1, leadOut: 0, durOut: 0.12 }),
    swap(t, T.toque2 - 0.25, T.toque2 + 0.42, { delayIn: 0, durIn: 0.1, leadOut: 0, durOut: 0.12 }));
  const rT = 26 * (1 - 0.18 * press(t, [T.toque1, T.toque2]));
  toque.setAttribute('cx', f1(cur[0])); toque.setAttribute('cy', f1(cur[1])); toque.setAttribute('r', rT.toFixed(1));
  toque.setAttribute('opacity', (0.2 * aT).toFixed(3));
  let uo = -1, op = PT1, cor = '#F47745';
  if (t >= T.toque1 && t < T.toque1 + 0.45) uo = (t - T.toque1) / 0.45;
  if (t >= T.toque2 && t < T.toque2 + 0.45) { uo = (t - T.toque2) / 0.45; op = PT2; cor = '#171717'; }   // não laranja sobre laranja
  od.setAttribute('cx', f1(op[0])); od.setAttribute('cy', f1(op[1])); od.setAttribute('stroke', cor);
  od.setAttribute('r', (24 + 30 * sp(Math.max(0, uo) * 0.45, P.button)).toFixed(1));
  od.setAttribute('opacity', (uo >= 0 && uo < 1 ? 0.8 * (1 - uo) : 0).toFixed(3));

  if (dbg) dbg.textContent = t.toFixed(2) + ' s';
}

// ---------------------------------------------------------------------------
// Contrato de render e modos de preview
// ---------------------------------------------------------------------------
const ESTADOS = [
  { id: 'E0', nome: 'Entrada: o subsolo escuro (último quadro da cena 4)', t: 0 },
  { id: 'M1a', nome: 'Meio: a tinta desce; a marca entra grande ("VEREDA")', t: 0.55 },
  { id: 'B1a', nome: 'A tinta escoa; a régua laranja', t: 1.00 },
  { id: 'M1b', nome: 'Meio: o contorno vira o celular; os nomes entram nele', t: 1.45 },
  { id: 'M1c', nome: 'Meio da troca TEMPO → SEGUNDOS', t: 1.76 },
  { id: 'B1', nome: 'A marca grande, SEGUNDOS com a régua curta, o celular com o app (HOLD)', t: HOLDS[0] },
  { id: 'M2a', nome: 'Meio: a marca vai ao cabeçalho; o celular vem ao centro', t: 2.55 },
  { id: 'M2b', nome: 'Toque em Colar link', t: T.toque1 + 0.03 },
  { id: 'M2c', nome: 'O link chegou; o sublinhado cresce', t: 3.40 },
  { id: 'M2d', nome: 'Toque em Gerar Dossiê (squish e onda)', t: T.toque2 + 0.1 },
  { id: 'M3a', nome: 'Meio: o cartão se recolhe na barra de abas', t: 4.62 },
  { id: 'M3b', nome: 'A lista do dossiê se enche ("tudo possível")', t: 5.10 },
  { id: 'M3c', nome: 'Edifício selecionado; o celular começa a fechar ("o imóvel")', t: 5.45 },
  { id: 'M3d', nome: 'Meio: o celular se fecha na linha; Edifício a caminho da cena 6', t: 5.75 },
  { id: 'FIM', nome: 'Primeiro quadro da cena 6', t: DUR - 1 / 30 },
];
const SONS = [
  { t: T.luz, tipo: 'whoosh', dur: 0.7, ganho: 0.45, evento: 'a tinta desce' },
  { t: T.marca, tipo: 'pop', ganho: 0.45, evento: 'a marca VEREDA entra' },
  { t: T.pousa, tipo: 'tick', evento: 'a tinta para na régua; a linha fica laranja' },
  { t: T.escoa, tipo: 'whoosh', dur: 0.9, ganho: 0.4, evento: 'a tinta escoa por baixo' },
  { t: T.contorno, tipo: 'whoosh', dur: 0.6, ganho: 0.3, evento: 'o contorno vira o celular' },
  { t: T.troca, tipo: 'pop', evento: 'TEMPO vira SEGUNDOS' },
  { t: T.b2, tipo: 'whoosh', dur: 0.5, ganho: 0.4, evento: 'a marca vai ao cabeçalho; o celular ao centro' },
  { t: T.toque1, tipo: 'click', evento: 'toque em Colar link' },
  { t: T.cola, tipo: 'pop', ganho: 0.5, evento: 'o link chega' },
  { t: T.toque2, tipo: 'click', evento: 'toque em Gerar Dossiê' },
  { t: T.abre, tipo: 'whoosh', dur: 0.4, ganho: 0.4, evento: 'o cartão vira a barra de abas' },
  { t: T.lista, tipo: 'tick', ganho: 0.5, evento: 'a lista do dossiê' },
  { t: T.edificio, tipo: 'tick', evento: 'Edifício' },
  { t: T.fecha, tipo: 'whoosh', dur: 0.6, ganho: 0.4, evento: 'o celular se fecha na linha' },
];
window.POC = {
  id: 'CENA-05', variante: 'a virada: em segundos', duracao: DUR, fps: 30, estados: ESTADOS, holds: HOLDS,
  cliques: [T.toque1, T.toque2], marcos: T, sons: SONS,
  tiras: [{ nome: 'luz', t0: 0.5 }, { nome: 'troca', t0: T.troca - 0.02 }, { nome: 'colar', t0: T.toque1 - 0.1 }, { nome: 'clique', t0: T.toque2 - 0.05 }, { nome: 'fecho', t0: T.fecha + 0.2 }],
  comparar: ESTADOS.map((e) => ({ t: e.t, nome: e.id })),
  entrada: {
    modulo: 'motion/lib/subsolo.js',
    desenho: 'canvas 1920 x 1080 com desenharSubsolo(ctx, larguras dos nomes em 500 22px JetBrains Mono) e, por cima, TEMPO em HTML letra a letra (posLetras, sem kerning, opsz 40)',
    ...JSON.parse(JSON.stringify(S)),
  },
  saida: { cena: 'cena06.html', t: 0, linha: { x1: L6[0], x2: L6[1], y: 540, traco: 4 }, rotulo: { texto: 'Edifício', centroX: 960, top: 474, fonte: '700 34px Plus Jakarta Sans' } },
};
window.seek = (t) => render(t);
window.__pronto = (async () => {
  await document.fonts.ready;
  const todo = document.getElementById('c').textContent + ' TEMPOSEGUNDOS ×·—–→²ºçãõéêíóúâÁÉ?0123456789';
  await Promise.all([
    '500 96px Fraunces', '500 21px Fraunces', '500 18px Fraunces', '500 20px Fraunces', '500 23px Fraunces', '500 28px Fraunces',
    '400 11px "Plus Jakarta Sans"', '500 13px "Plus Jakarta Sans"', '600 11.5px "Plus Jakarta Sans"', '600 10.5px "Plus Jakarta Sans"', '600 10px "Plus Jakarta Sans"',
    '700 10px "Plus Jakarta Sans"', '600 13.5px "Plus Jakarta Sans"', '500 12px "Plus Jakarta Sans"', '700 12px "Plus Jakarta Sans"',
    '600 14px "Plus Jakarta Sans"', '500 34px "Plus Jakarta Sans"', '700 34px "Plus Jakarta Sans"',
    '500 22px "JetBrains Mono"', '500 17px "JetBrains Mono"', '500 11px "JetBrains Mono"',
  ].map((f) => document.fonts.load(f, todo)));
  await document.fonts.ready;
  medir();
  for (let t = 0; t <= DUR; t += 0.25) render(t);
  await document.fonts.ready;
  medir();
  render(0);
  return true;
})();

if (!navigator.webdriver) {
  document.body.classList.add('tela');
  const c = $('c');
  const ajusta = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); Object.assign(c.style, { position: 'absolute', transformOrigin: '0 0', transform: `scale(${s})`, left: `${(innerWidth - 1920 * s) / 2}px`, top: `${(innerHeight - 1080 * s) / 2}px` }); };
  addEventListener('resize', ajusta); ajusta();
  const aoVivo = new URLSearchParams(location.search).has('live');
  // ao vivo: ENTER → HOLD → EXIT; espaço ou → leva ao próximo HOLD, ← volta ao anterior
  const PARADAS = HOLDS;
  let t = 0, alvo = aoVivo ? PARADAS[0] : DUR, rodando = true, antes = null, ultimo = null;
  window.__medidas = [];
  const passo = (agora) => {
    if (antes !== null && rodando) { t += (agora - antes) / 1000; if (t >= alvo) { t = alvo; if (!aoVivo) t = 0; else rodando = false; } }
    antes = agora;
    if (t !== ultimo) { const t0 = performance.now(); render(t); window.__medidas.push(performance.now() - t0); if (window.__medidas.length > 2000) window.__medidas.shift(); ultimo = t; }
    requestAnimationFrame(passo);
  };
  addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown') {
      const base0 = rodando ? alvo : t;
      const i = PARADAS.findIndex((h) => h > base0 + 1e-3);
      if (aoVivo) { if (i >= 0) { alvo = PARADAS[i]; rodando = true; } } else rodando = !rodando;
      e.preventDefault();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      const anteriores = PARADAS.filter((h) => h < t - 1e-3);
      t = anteriores.length ? anteriores[anteriores.length - 1] : 0;
      alvo = aoVivo ? (PARADAS.find((h) => h > t + 1e-3) ?? DUR) : DUR;
      rodando = !aoVivo;
      render(t); ultimo = t;
      e.preventDefault();
    } else if (e.key === 'r') { t = 0; alvo = aoVivo ? PARADAS[0] : DUR; rodando = true; }
  });
  window.__estadoVivo = () => ({ t, alvo, rodando });
  window.__pronto.then(() => requestAnimationFrame(passo));
}
