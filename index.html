<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEREDA — Inteligência Proprietária & Perícia Imobiliária</title>
  <meta name="description" content="Plataforma de inteligência e decisão habitacional: auditoria de custo real de ocupação, arbitragem fiscal ITBI, cartografia pericial 3D, insolação e dossiê probatório de edifícios." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Paleta Oficial da Referência (.zip) + Perícia Cadastral */
      --bg-obsidian: #0D0E0F;
      --bg-paper: #F2EBDD;
      --bg-paper-light: #FAF6EE;
      --bg-surface: #FFFFFF;
      --bg-subtle: #E7DEC9;
      --bg-ink: #171717;
      --bg-ink-elevated: #222426;

      --ink-primary: #171717;
      --ink-secondary: #4A4740;
      --ink-muted: #787266;

      --brand-orange: #F47745;
      --brand-orange-hover: #E06332;
      --brand-orange-soft: rgba(244, 119, 69, 0.13);

      --brand-rust: #B94E36;
      --brand-rust-soft: #F9EBE8;

      --brand-sage: #7F8870;
      --brand-sage-deep: #3A5230;
      --brand-sage-soft: #EBF2E8;

      --brand-cadastral: #2E5A85;
      --brand-cadastral-soft: #EBF1F8;

      --border-hairline: #E2D9C8;
      --border-strong: #C9BEA8;
      --border-ink: #171717;

      /* Tipografia Oficial de Títulos: Fraunces (Editorial Orgânica Equilibrada) */
      --font-display: 'Fraunces', Georgia, serif;
      --font-editorial: 'Fraunces', Georgia, serif;
      --title-weight: 500;
      --wordmark-weight: 500;
      --title-tracking: -0.02em;
      --wordmark-tracking: 0.14em;

      /* Tipografia de Corpo e Dados */
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-obsidian);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    ::selection {
      background: rgba(244, 119, 69, 0.22);
      color: var(--brand-rust);
    }

    .mono-num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Padrão Cartográfico Arquitetônico Sutil */
    .arch-grid-pattern {
      background-size: 24px 24px;
      background-image:
        linear-gradient(to right, rgba(127, 136, 112, 0.11) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(127, 136, 112, 0.11) 1px, transparent 1px);
    }

    /* Estrutura Principal & Alternador de Viewport (Editorial Widescreen vs Mobile Frame) */
    .viewport-wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
      transition: padding 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .viewport-wrapper.is-mobile-frame {
      padding: 20px 12px;
      background: radial-gradient(circle at 50% 0%, #1d2022 0%, #0d0e0f 75%);
    }

    .app-shell {
      width: 100%;
      max-width: 1440px;
      min-height: 100vh;
      background-color: var(--bg-paper);
      position: relative;
      display: flex;
      flex-direction: column;
      transition: max-width 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-radius 0.3s ease;
    }

    .viewport-wrapper.is-mobile-frame .app-shell {
      max-width: 430px;
      min-height: 880px;
      max-height: 92vh;
      border-radius: 36px;
      border: 8px solid #222426;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.65);
    }

    /* Top Navigation Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(242, 235, 221, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-hairline);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .viewport-wrapper.is-mobile-frame .top-bar {
      padding: 12px 16px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
    }

    .brand-mark-svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .brand-lockup:hover .brand-mark-svg {
      transform: scale(1.06);
    }

    .brand-wordmark {
      font-family: var(--font-editorial);
      font-weight: 600;
      font-size: 19px;
      letter-spacing: 0.16em;
      color: var(--ink-primary);
      line-height: 1;
    }

    .brand-subtitle {
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand-sage);
      display: block;
      margin-top: 2px;
    }

    /* Desktop Primary Nav Links */
    .top-nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-paper-light);
      padding: 4px;
      border: 1px solid var(--border-hairline);
      border-radius: 10px;
    }

    .viewport-wrapper.is-mobile-frame .top-nav-links {
      display: none;
    }

    @media (max-width: 900px) {
      .top-nav-links {
        display: none;
      }
      .top-bar {
        padding: 12px 16px;
      }
    }

    .nav-pill-btn {
      background: transparent;
      border: none;
      padding: 7px 14px;
      border-radius: 7px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease;
    }

    .nav-pill-btn:hover {
      color: var(--ink-primary);
      background: rgba(23, 23, 23, 0.04);
    }

    .nav-pill-btn.active {
      background: var(--ink-primary);
      color: var(--bg-paper-light);
    }

    .nav-pill-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--brand-orange);
      color: #FFF;
      font-weight: 700;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .context-chip {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-strong);
      color: var(--ink-secondary);
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .context-chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand-orange);
    }

    .icon-action-btn {
      background: var(--bg-paper-light);
      border: 1px solid var(--border-hairline);
      color: var(--ink-primary);
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .icon-action-btn:hover {
      border-color: var(--ink-primary);
      background: var(--bg-surface);
    }

    /* Main Content Area */
    .main-stage {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 84px;
    }

    /* Container Responsive Grid */
    .editorial-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 28px 28px 48px;
    }

    .viewport-wrapper.is-mobile-frame .editorial-container {
      padding: 18px 16px 36px;
    }

    @media (max-width: 768px) {
      .editorial-container {
        padding: 18px 16px 36px;
      }
    }

    /* Typography Components */
    .kicker-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--brand-sage-deep);
    }

    .kicker-tag .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand-orange);
    }

    .display-headline {
      font-family: var(--font-display);
      font-size: clamp(34px, 4.2vw, 54px);
      line-height: 1.04;
      font-weight: 400;
      color: var(--ink-primary);
      letter-spacing: -0.01em;
    }

    .viewport-wrapper.is-mobile-frame .display-headline {
      font-size: 32px;
    }

    .display-headline em {
      font-family: var(--font-editorial);
      font-style: italic;
      color: var(--brand-rust);
    }

    .section-title {
      font-family: var(--font-editorial);
      font-size: 24px;
      font-weight: 500;
      color: var(--ink-primary);
      line-height: 1.18;
    }

    /* Bento Grids & Architectural Cards */
    .bento-hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 24px;
      align-items: stretch;
      margin-bottom: 32px;
    }

    .viewport-wrapper.is-mobile-frame .bento-hero-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (max-width: 960px) {
      .bento-hero-grid {
        grid-template-columns: 1fr;
      }
    }

    .surface-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 14px;
      padding: 22px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .surface-card.interactive:hover {
      border-color: var(--ink-primary);
    }

    .surface-card.ink-framed {
      border: 1.5px solid var(--ink-primary);
      background: var(--bg-surface);
    }

    .surface-card.paper-warm {
      background: var(--bg-paper-light);
      border: 1px solid var(--border-hairline);
    }

    .surface-card.dark-telemetry {
      background: var(--bg-ink);
      color: var(--bg-paper);
      border: 1px solid #2D3033;
    }

    /* Intake Decoder Box */
    .decoder-input-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .viewport-wrapper.is-mobile-frame .decoder-input-group {
      flex-direction: column;
    }

    @media (max-width: 640px) {
      .decoder-input-group {
        flex-direction: column;
      }
    }

    .decoder-input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .decoder-input {
      width: 100%;
      background: var(--bg-paper-light);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 13px 82px 13px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-primary);
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .decoder-input:focus {
      border-color: var(--brand-orange);
      background: #FFF;
    }

    .sample-url-btn {
      position: absolute;
      right: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-strong);
      color: var(--brand-rust);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .sample-url-btn:hover {
      background: var(--brand-orange);
      color: #FFF;
      border-color: var(--brand-orange);
    }

    /* Primary & Secondary Buttons */
    .btn-signal {
      background: var(--brand-orange);
      color: #FFFFFF;
      border: 1px solid var(--brand-orange);
      padding: 13px 20px;
      border-radius: 10px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn-signal:hover {
      background: var(--brand-orange-hover);
    }

    .btn-signal:active {
      transform: scale(0.99);
    }

    .btn-ink {
      background: var(--ink-primary);
      color: var(--bg-paper-light);
      border: 1px solid var(--ink-primary);
      padding: 11px 18px;
      border-radius: 10px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn-ink:hover {
      background: #000000;
    }

    .btn-ghost {
      background: var(--bg-paper-light);
      color: var(--ink-primary);
      border: 1px solid var(--border-strong);
      padding: 10px 16px;
      border-radius: 10px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.15s ease;
    }

    .btn-ghost:hover {
      border-color: var(--ink-primary);
      background: var(--bg-surface);
    }

    /* Filter Bar & Segmented Controls */
    .filter-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 22px;
    }

    .segmented-group {
      display: inline-flex;
      background: var(--bg-paper);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-hairline);
      gap: 2px;
    }

    .seg-btn {
      background: transparent;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--ink-primary);
      box-shadow: 0 1px 2px rgba(23, 23, 23, 0.08);
    }

    /* Portfolio Grid */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    .viewport-wrapper.is-mobile-frame .portfolio-grid {
      grid-template-columns: 1fr;
    }

    @media (max-width: 768px) {
      .portfolio-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Property Card Showcase */
    .prop-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .prop-card:hover {
      border-color: var(--ink-primary);
      transform: translateY(-2px);
    }

    .prop-card-media {
      position: relative;
      aspect-ratio: 16 / 10;
      background: var(--bg-subtle);
      overflow: hidden;
    }

    .prop-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .prop-card:hover .prop-card-media img {
      transform: scale(1.03);
    }

    /* Semantic Badges */
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid transparent;
    }

    .badge-pill.verified {
      background: var(--brand-sage-soft);
      color: var(--brand-sage-deep);
      border-color: rgba(127, 136, 112, 0.35);
    }

    .badge-pill.alert {
      background: var(--brand-rust-soft);
      color: var(--brand-rust);
      border-color: rgba(185, 78, 54, 0.32);
    }

    .badge-pill.signal {
      background: var(--brand-orange-soft);
      color: #C44D1C;
      border-color: rgba(244, 119, 69, 0.35);
    }

    .badge-pill.cadastral {
      background: var(--brand-cadastral-soft);
      color: var(--brand-cadastral);
      border-color: rgba(46, 90, 133, 0.3);
    }

    .badge-pill.dark {
      background: rgba(23, 23, 23, 0.88);
      color: var(--bg-paper-light);
      backdrop-filter: blur(6px);
    }

    /* Dossier Layout: Asymmetric Editorial Split */
    .dossier-top-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 22px;
      margin-bottom: 24px;
    }

    .viewport-wrapper.is-mobile-frame .dossier-top-grid {
      grid-template-columns: 1fr;
    }

    @media (max-width: 980px) {
      .dossier-top-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Progressive Disclosure Sub-Tabs inside Dossier */
    .dossier-subnav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .subnav-tab {
      background: transparent;
      border: none;
      border-bottom: 2.5px solid transparent;
      padding: 10px 16px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-muted);
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .subnav-tab:hover {
      color: var(--ink-primary);
    }

    .subnav-tab.active {
      color: var(--ink-primary);
      border-bottom-color: var(--brand-orange);
    }

    /* Bento 2-Column Content Grid */
    .bento-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .viewport-wrapper.is-mobile-frame .bento-2col {
      grid-template-columns: 1fr;
    }

    @media (max-width: 900px) {
      .bento-2col {
        grid-template-columns: 1fr;
      }
    }

    /* Score Ring & Verdict Box */
    .verdict-score-box {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--bg-paper-light);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
    }

    .score-num-serif {
      font-family: var(--font-display);
      font-size: 46px;
      line-height: 1;
      color: var(--ink-primary);
    }

    /* Interactive Ruler P25 / Mediana / P75 */
    .ruler-track-wrap {
      position: relative;
      height: 82px;
      margin: 18px 0 8px;
      user-select: none;
    }

    .ruler-rail {
      position: absolute;
      top: 36px;
      left: 0;
      right: 0;
      height: 8px;
      background: var(--bg-subtle);
      border-radius: 4px;
    }

    .ruler-iqr {
      position: absolute;
      top: 36px;
      height: 8px;
      background: #D5B9AC;
      border-radius: 2px;
      transition: left 0.35s ease, width 0.35s ease;
    }

    .ruler-median-tick {
      position: absolute;
      top: 30px;
      width: 2.5px;
      height: 20px;
      background: var(--ink-primary);
      transition: left 0.35s ease;
    }

    .ruler-marker {
      position: absolute;
      top: 29px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--brand-orange);
      border: 3px solid var(--bg-surface);
      box-shadow: 0 2px 6px rgba(23, 23, 23, 0.25);
      transform: translateX(-50%);
      transition: left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 3;
    }

    .ruler-marker-callout {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      background: var(--ink-primary);
      color: #FFF;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      white-space: nowrap;
      transition: left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Slide-over Drawer / Modal */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(13, 14, 15, 0.65);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      justify-content: flex-end;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer-panel {
      width: 100%;
      max-width: 540px;
      background: var(--bg-paper);
      height: 100%;
      overflow-y: auto;
      padding: 28px 24px;
      border-left: 1px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: slideLeft 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideLeft {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    /* Sticky Bottom Bar (Mobile-First 4 Tabs) */
    .bottom-dock {
      position: sticky;
      bottom: 0;
      z-index: 55;
      background: rgba(250, 246, 238, 0.90);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-top: 1px solid rgba(23, 23, 23, 0.08);
      padding: 8px 12px 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
    }

    .dock-item {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--ink-muted);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
      padding: 6px 4px;
      position: relative;
      transition: color 0.16s ease;
    }

    .dock-item svg {
      transition: transform 0.16s ease, stroke 0.16s ease;
    }

    .dock-item.active {
      color: var(--ink-primary);
      font-weight: 600;
    }

    .dock-item.active svg {
      color: var(--brand-orange);
    }

    .dock-item.active::before {
      content: '';
      position: absolute;
      top: -8px;
      width: 20px;
      height: 2px;
      border-radius: 2px;
      background: var(--brand-orange);
    }

    /* Toast Notification */
    .vereda-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 120;
      background: var(--ink-primary);
      color: var(--bg-paper-light);
      border: 1px solid var(--brand-orange);
      padding: 12px 18px;
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .vereda-toast.show {
      display: inline-flex;
    }

    /* Core Layout & Editorial Typography Selectors */
    .app-frame {
      width: 100%;
      max-width: 1440px;
      min-height: 100vh;
      background-color: var(--bg-paper);
      position: relative;
      display: flex;
      flex-direction: column;
      transition: max-width 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-radius 0.3s ease;
    }

    .viewport-wrapper.is-mobile-frame .app-frame {
      max-width: 430px;
      min-height: 880px;
      max-height: 92vh;
      border-radius: 36px;
      border: 8px solid #222426;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.65);
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(242, 235, 221, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-hairline);
      padding: 12px 28px;
    }

    .viewport-wrapper.is-mobile-frame .top-header {
      padding: 12px 16px;
    }

    .top-header-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand-sage-deep);
      margin-top: 2px;
    }

    .primary-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-paper-light);
      padding: 4px;
      border: 1px solid var(--border-hairline);
      border-radius: 10px;
    }

    .viewport-wrapper.is-mobile-frame .primary-nav {
      display: none;
    }

    @media (max-width: 960px) {
      .primary-nav {
        display: none;
      }
      .top-header {
        padding: 12px 16px;
      }
    }

    .nav-pill {
      background: transparent;
      border: none;
      padding: 7px 13px;
      border-radius: 7px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .nav-pill:hover {
      color: var(--ink-primary);
      background: rgba(23, 23, 23, 0.05);
    }

    .nav-pill.active {
      background: var(--ink-primary);
      color: var(--bg-paper-light);
    }

    .count-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--brand-orange);
      color: #FFF;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewport-switch-btn {
      background: var(--bg-paper-light);
      border: 1px solid var(--border-strong);
      color: var(--ink-primary);
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .viewport-switch-btn:hover {
      border-color: var(--ink-primary);
      background: var(--bg-surface);
    }

    .view-section {
      display: none;
      max-width: 1360px;
      margin: 0 auto;
      padding: 26px 28px 48px;
      width: 100%;
    }

    .view-section.active {
      display: block;
      animation: fadeView 0.2s ease-out;
    }

    .viewport-wrapper.is-mobile-frame .view-section {
      padding: 16px 14px 36px;
    }

    @media (max-width: 768px) {
      .view-section {
        padding: 16px 14px 36px;
      }
    }

    @keyframes fadeView {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-bento {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .viewport-wrapper.is-mobile-frame .hero-bento {
      grid-template-columns: 1fr;
    }

    @media (max-width: 980px) {
      .hero-bento {
        grid-template-columns: 1fr;
      }
    }

    .bento-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 14px;
      overflow: hidden;
    }

    .bento-card.padded {
      padding: 22px 24px;
    }

    .viewport-wrapper.is-mobile-frame .bento-card.padded {
      padding: 16px;
    }

    .decoder-box {
      background: var(--bg-ink);
      color: var(--bg-paper-light);
      border: 1px solid #2D3033;
      border-radius: 14px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .decoder-input-row {
      display: flex;
      gap: 8px;
    }

    .viewport-wrapper.is-mobile-frame .decoder-input-row {
      flex-direction: column;
    }

    @media (max-width: 640px) {
      .decoder-input-row {
        flex-direction: column;
      }
    }

    .decoder-box .decoder-input {
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #FAF6EE;
    }

    .decoder-box .decoder-input:focus {
      border-color: var(--brand-orange);
      background: rgba(255, 255, 255, 0.12);
    }

    .display-xl {
      font-family: var(--font-display);
      font-size: clamp(32px, 3.6vw, 46px);
      line-height: 1.06;
      font-weight: 400;
      color: var(--ink-primary);
      letter-spacing: -0.01em;
    }

    .display-lg {
      font-family: var(--font-display);
      font-size: clamp(26px, 2.8vw, 36px);
      line-height: 1.1;
      font-weight: 400;
      color: var(--ink-primary);
    }

    .display-md {
      font-family: var(--font-display);
      font-size: 22px;
      line-height: 1.15;
      font-weight: 400;
      color: var(--ink-primary);
    }

    .mono-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .mono-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-secondary);
      font-variant-numeric: tabular-nums;
    }

    .mono-metric {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-primary);
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================================
       TELA 1 (HOME): MOBILE-FIRST, TIPOGRAFIA VERTICAL ESGUIA & DESMODULARIZADA
       ========================================================================= */
    .top-header-minimal {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(242, 235, 221, 0.86);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-bottom: 1px solid rgba(23, 23, 23, 0.07);
      padding: 13px 18px;
    }

    .top-header-minimal-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
    }

    .brand-wordmark-arch {
      font-family: var(--font-editorial);
      font-weight: var(--wordmark-weight, 600);
      font-size: 19px;
      letter-spacing: var(--wordmark-tracking, 0.18em);
      color: var(--ink-primary);
      line-height: 1;
      display: inline-block;
    }

    /* =========================================================================
       JELLY & SPRING TACTILE PHYSICS ENGINE (BOTÕES E CARDS "GOSTOSOS" DE CLICAR)
       ========================================================================= */
    :root {
      --jelly-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --jelly-soft: cubic-bezier(0.22, 1.4, 0.36, 1);
    }

    @keyframes jellySquishBtn {
      0%   { transform: scale(1, 1); }
      25%  { transform: scale(0.93, 0.87) translateY(2px); }
      55%  { transform: scale(1.04, 1.06) translateY(-1.5px); }
      78%  { transform: scale(0.985, 0.99); }
      100% { transform: scale(1, 1); }
    }

    @keyframes jellyPillPop {
      0%   { transform: scale(1, 1); }
      28%  { transform: scale(1.09, 0.85); }
      60%  { transform: scale(0.94, 1.06); }
      82%  { transform: scale(1.02, 0.985); }
      100% { transform: scale(1, 1); }
    }

    @keyframes jellyCardBounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(0.962); }
      70%  { transform: scale(1.012); }
      100% { transform: scale(1); }
    }

    .jelly-anim-btn {
      animation: jellySquishBtn 0.48s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .jelly-anim-pill {
      animation: jellyPillPop 0.44s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .jelly-anim-card {
      animation: jellyCardBounce 0.42s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .icon-only-toggle {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(23, 23, 23, 0.11);
      box-shadow: 0 2px 6px rgba(23, 23, 23, 0.04), inset 0 1px 0 #FFFFFF;
      color: var(--ink-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.4s var(--jelly-spring), background 0.15s ease, border-color 0.15s ease;
    }

    .icon-only-toggle:hover {
      background: #FFFFFF;
      border-color: rgba(23, 23, 23, 0.35);
      transform: scale(1.05);
    }

    .icon-only-toggle:active {
      transform: scaleX(1.08) scaleY(0.86);
      transition: transform 0.06s ease-out;
    }

    /* Menu Selector Popover (Hamburger) */
    .mobile-menu-popover {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 235px;
      background: rgba(250, 246, 238, 0.96);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(23, 23, 23, 0.12);
      border-radius: 16px;
      box-shadow: 0 18px 40px -10px rgba(23, 23, 23, 0.18);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 90;
    }

    .mobile-menu-popover.open {
      display: flex;
      animation: fadeView 0.2s var(--jelly-spring);
    }

    .mobile-menu-item {
      background: transparent;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-primary);
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.3s var(--jelly-spring), background 0.14s ease;
    }

    .mobile-menu-item:hover {
      background: rgba(23, 23, 23, 0.06);
    }

    .mobile-menu-item:active {
      transform: scale(0.96);
    }

    .mobile-menu-item span.menu-tag {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-muted);
    }

    /* Esconder barra de rolagem vertical (scrollbar-none) */
    .app-frame,
    .main-stage,
    body {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .app-frame::-webkit-scrollbar,
    .main-stage::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    /* =========================================================================
       TELA INICIAL (ORIGINAL + JELLY + ZERO MONOSPACE + JOÃO-DE-BARRO)
       ========================================================================= */
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-align: left;
      transition: transform 0.42s var(--jelly-spring);
    }

    .brand-lockup:hover {
      transform: scale(1.03);
    }

    .brand-lockup:active {
      transform: scaleX(1.07) scaleY(0.90);
      transition: transform 0.06s ease-out;
    }

    .joao-barro-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .brand-lockup:hover .joao-barro-icon {
      transform: scale(1.06);
    }

    /* Bloco de Entrada / Scanner Editorial Limpo */
    .scanner-card {
      position: relative;
      background: #FFFFFF;
      border-radius: 18px;
      border: 1px solid rgba(23, 23, 23, 0.09);
      box-shadow: 0 4px 14px -4px rgba(23, 23, 23, 0.05);
      padding: 16px 15px 15px;
      margin-bottom: 24px;
    }

    .scanner-capsule-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .scanner-header-title {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: var(--title-weight, 500);
      line-height: 1.15;
      letter-spacing: var(--title-tracking, -0.02em);
      color: var(--ink-primary);
    }

    .scanner-paste-action {
      background: #FAF8F4;
      border: 1px solid rgba(23, 23, 23, 0.10);
      border-radius: 999px;
      padding: 5px 11px;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .scanner-paste-action:hover {
      background: #FFFFFF;
      color: var(--ink-primary);
      border-color: rgba(23, 23, 23, 0.22);
    }

    .scanner-input-well {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FAF7F0;
      border: 1px solid rgba(23, 23, 23, 0.10);
      border-radius: 12px;
      padding: 11px 13px;
      margin-bottom: 12px;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .scanner-input-well:focus-within {
      background: #FFFFFF;
      border-color: var(--brand-orange);
      box-shadow: 0 0 0 3px rgba(244, 119, 69, 0.15);
    }

    .scanner-url-field {
      flex: 1;
      border: none;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-primary);
      outline: none;
      min-width: 0;
      text-overflow: ellipsis;
    }

    /* Botão Primário Limpo e Elegante */
    .btn-scanner-primary {
      width: 100%;
      position: relative;
      background: var(--brand-orange);
      color: #FFFFFF;
      border: none;
      box-shadow: 0 4px 12px rgba(244, 119, 69, 0.32);
      border-radius: 12px;
      padding: 13.5px 18px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-scanner-primary:hover {
      background: #E56734;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(244, 119, 69, 0.40);
    }

    .btn-scanner-primary:active {
      transform: scale(0.985);
      box-shadow: 0 2px 6px rgba(244, 119, 69, 0.25);
    }

    /* Cabeçalho de Análises Recentes */
    .saved-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding: 0 2px;
    }

    .saved-section-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: var(--title-weight, 500);
      line-height: 1.15;
      letter-spacing: var(--title-tracking, -0.02em);
      color: var(--ink-primary);
    }

    .filter-segmented-pill {
      display: inline-flex;
      background: #EAE3D5;
      border: 1px solid #DCD3C3;
      padding: 3px;
      border-radius: 10px;
      gap: 2px;
    }

    .filter-seg-btn {
      border: none;
      background: transparent;
      padding: 5px 11px;
      border-radius: 7px;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 500;
      color: var(--ink-secondary);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .filter-seg-btn:hover {
      color: var(--ink-primary);
    }

    .filter-seg-btn.active {
      background: var(--ink-primary);
      color: #FAF8F4;
      font-weight: 600;
      box-shadow: 0 2px 5px rgba(23, 23, 23, 0.15);
    }

    /* Card de Imóvel Editorial Limpo */
    .vereda-home-card {
      background: #FFFFFF;
      border: 1px solid rgba(23, 23, 23, 0.09);
      box-shadow: 0 4px 14px -4px rgba(23, 23, 23, 0.05);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.2s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .vereda-home-card:hover {
      border-color: rgba(23, 23, 23, 0.24);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -8px rgba(23, 23, 23, 0.10);
    }

    .vereda-home-card:active {
      transform: scale(0.985);
    }

    .vereda-card-photo {
      position: relative;
      aspect-ratio: 16 / 10;
      background: var(--bg-subtle);
      overflow: hidden;
    }

    .vereda-card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .vereda-home-card:hover .vereda-card-photo img {
      transform: scale(1.03);
    }

    /* Badge de Bairro na Foto - Discreto, legível, sem mono */
    .property-location-pill {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(18, 18, 18, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FAF8F4;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      padding: 3.5px 9px;
      border-radius: 6px;
      z-index: 2;
    }

    /* Botão de Salvar / Bookmark - Simples, discreto, sem 3D jelly */
    .card-bookmark-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(18, 18, 18, 0.40);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.2s ease, color 0.18s ease;
      z-index: 2;
    }

    .card-bookmark-btn:hover {
      background: rgba(18, 18, 18, 0.70);
      transform: scale(1.06);
    }

    .card-bookmark-btn:active {
      transform: scale(0.92);
    }

    .card-bookmark-btn.saved {
      background: #FFFFFF;
      color: var(--brand-orange);
      box-shadow: 0 2px 6px rgba(23, 23, 23, 0.18);
    }

    /* Corpo do Card */
    .vereda-card-body {
      padding: 14px 15px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vereda-card-title {
      font-family: var(--font-display);
      font-size: 18.5px;
      font-weight: var(--title-weight, 500);
      letter-spacing: var(--title-tracking, -0.02em);
      color: var(--ink-primary);
      line-height: 1.2;
    }

    .vereda-card-address {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 400;
      color: var(--ink-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Faixa de Especificações em Sans-Serif Limpa (Zero Monospace) */
    .vereda-specs-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 1px 0;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--ink-secondary);
    }

    .spec-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .spec-item svg {
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    .spec-divider {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(23, 23, 23, 0.22);
    }

    /* Faixa Concentrada de Preço na Base da Foto (Zero Monospace) */
    .photo-price-bar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: rgba(18, 19, 21, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #FAF6EE;
      z-index: 2;
    }

    .visor-price-group {
      display: flex;
      flex-direction: column;
      gap: 1.5px;
      min-width: 0;
    }

    .visor-announced-line {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: rgba(250, 246, 238, 0.72);
      line-height: 1.2;
    }

    .visor-announced-line del {
      text-decoration: line-through;
      color: rgba(250, 246, 238, 0.58);
    }

    .visor-real-price {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.015em;
      font-variant-numeric: tabular-nums;
      color: #FFFFFF;
      line-height: 1.2;
    }

    .visor-delta-pill {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      padding: 4.5px 9px;
      border-radius: 7px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .visor-delta-pill.alert {
      background: rgba(244, 119, 69, 0.24);
      border: 1px solid rgba(244, 119, 69, 0.52);
      color: #FFAA88;
    }

    .visor-delta-pill.verified {
      background: rgba(127, 136, 112, 0.28);
      border: 1px solid rgba(163, 179, 142, 0.50);
      color: #D4E4C3;
    }

    /* Diagnóstico Urbano Pericial de Entorno (Sem + e sem − de IA) */
    .urban-diagnosis-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(23, 23, 23, 0.07);
    }

    .diagnosis-item {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.25;
    }

    .diagnosis-item .diagnosis-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .diagnosis-item.valid {
      color: #1B5E40;
    }

    .diagnosis-item.caution {
      color: #9A341E;
    }

    .diagnosis-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .diagnosis-item.valid .diagnosis-dot {
      background: #1B5E40;
      box-shadow: 0 0 0 2px rgba(27, 94, 64, 0.16);
    }

    .diagnosis-item.caution .diagnosis-dot {
      background: #C84616;
      box-shadow: 0 0 0 2px rgba(200, 70, 22, 0.16);
    }

    .diagnosis-divider {
      width: 1px;
      height: 15px;
      background: rgba(23, 23, 23, 0.09);
      flex-shrink: 0;
    }

    /* =========================================================================
       TELAS 2 A 5: LINGUAGEM EDITORIAL UNIFICADA (PADRÃO-OURO DA HOME)
       ========================================================================= */
    .ed-card {
      background: #FFFFFF;
      border-radius: 18px;
      border: 1px solid rgba(23, 23, 23, 0.09);
      box-shadow: 0 4px 14px -4px rgba(23, 23, 23, 0.05);
      padding: 16px 15px;
      margin-bottom: 16px;
      overflow: hidden;
      position: relative;
    }

    .ed-card.no-pad {
      padding: 0;
    }

    .ed-cream-box {
      background: #F7EFE6;
      border: 1px solid #EBE1D3;
      border-radius: 13px;
      padding: 13px 14px;
    }

    .ed-soft-box {
      background: #FAF7F0;
      border: 1px solid rgba(23, 23, 23, 0.08);
      border-radius: 11px;
      padding: 11px 12px;
    }

    .ed-title-lg {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.18;
      color: var(--ink-primary);
    }

    .ed-title-md {
      font-family: var(--font-display);
      font-size: 18.5px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--ink-primary);
    }

    .ed-kicker {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--brand-orange);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .ed-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      padding: 3.5px 8.5px;
      border-radius: 6px;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .ed-badge.valid {
      background: #E8F2EC;
      border-color: #CDE2D5;
      color: #1B5E40;
    }

    .ed-badge.alert {
      background: #FDE8E1;
      border-color: #F5C6B7;
      color: #B94E36;
    }

    .ed-badge.cadastral {
      background: #EBF1F8;
      border-color: #C8DAEE;
      color: #2E5A85;
    }

    .ed-badge.neutral {
      background: #F2ECE1;
      border-color: #E2D9C8;
      color: #5C564E;
    }

    .ed-source-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-sans);
      font-size: 10.5px;
      font-weight: 600;
      padding: 2.5px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .ed-source-btn:hover {
      filter: brightness(0.96);
      transform: translateY(-0.5px);
    }

    .ed-source-btn.cadastral {
      background: #EBF1F8;
      border: 1px solid #C8DAEE;
      color: #2E5A85;
    }

    .ed-source-btn.valid {
      background: #E8F2EC;
      border: 1px solid #CDE2D5;
      color: #1B5E40;
    }

    .ed-source-btn.alert {
      background: #FDE8E1;
      border: 1px solid #F5C6B7;
      color: #B94E36;
    }

    .ed-source-btn.neutral {
      background: #F2ECE1;
      border: 1px solid #E2D9C8;
      color: #5C564E;
    }

    /* Botões Secundários no Padrão da Home */
    .ed-btn-secondary {
      background: #FAF8F4;
      color: var(--ink-primary);
      border: 1px solid rgba(23, 23, 23, 0.12);
      border-radius: 11px;
      padding: 11px 14px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .ed-btn-secondary:hover {
      background: #FFFFFF;
      border-color: rgba(23, 23, 23, 0.28);
    }

    .ed-btn-secondary:active {
      transform: scale(0.985);
    }

    .ed-btn-ink {
      background: var(--ink-primary);
      color: #FAF8F4;
      border: 1px solid var(--ink-primary);
      border-radius: 11px;
      padding: 11.5px 15px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .ed-btn-ink:hover {
      background: #000000;
    }

    /* Pílulas Horizontais de Troca de Imóvel / Seção */
    .ed-scroll-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 2px;
    }

    .ed-scroll-pills::-webkit-scrollbar {
      display: none;
    }

    .ed-prop-pill {
      border: 1px solid rgba(23, 23, 23, 0.10);
      background: #FAF8F4;
      color: var(--ink-secondary);
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 600;
      padding: 5.5px 11px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ed-prop-pill.active {
      background: var(--ink-primary);
      border-color: var(--ink-primary);
      color: #FAF8F4;
    }

    /* Passo 2A/2B: Checklist de Extração & Confirmação Cadastral */
    .extract-step-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 10px 12px;
      border-radius: 11px;
      background: #FAF7F0;
      border: 1px solid rgba(23, 23, 23, 0.07);
      transition: all 0.25s ease;
    }

    .extract-step-row.done {
      background: #FFFFFF;
      border-color: #CDE2D5;
    }

    .extract-step-row.active {
      background: #FDF4EE;
      border-color: rgba(244, 119, 69, 0.45);
    }

    .extract-step-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
      background: #EAE3D5;
      color: var(--ink-secondary);
      transition: all 0.25s ease;
    }

    .extract-step-row.done .extract-step-circle {
      background: #1B5E40;
      color: #FFFFFF;
    }

    .extract-step-row.active .extract-step-circle {
      background: var(--brand-orange);
      color: #FFFFFF;
    }

    /* Acordeão Limpo da Ficha Cadastral */
    .ed-accordion-header {
      width: 100%;
      background: #FAF7F0;
      border: 1px solid rgba(23, 23, 23, 0.09);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-family: var(--font-sans);
      text-align: left;
      transition: background 0.15s ease;
    }

    .ed-accordion-header:hover {
      background: #F5EFE4;
    }

    .ed-accordion-body {
      display: none;
      padding-top: 12px;
    }

    .ed-accordion-body.open {
      display: block;
    }

    /* Tabela Comparativa Lado a Lado (2 Colunas Mobile) */
    .compare-2col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .compare-row-block {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(23, 23, 23, 0.07);
    }

    .compare-row-block:last-child {
      border-bottom: none;
    }

    .compare-row-label {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--ink-muted);
      text-align: center;
      margin-bottom: 8px;
    }

    .compare-cell {
      min-width: 0;
    }

    .compare-cell.left {
      padding-right: 8px;
      border-right: 1px solid rgba(23, 23, 23, 0.07);
    }

    .compare-cell.right {
      padding-left: 4px;
    }

    /* Bottom-Sheet Modal Editorial para Fontes e WhatsApp */
    .drawer-backdrop {
      align-items: flex-end;
      justify-content: center;
    }

    .drawer-panel {
      width: 100%;
      max-width: 430px;
      height: auto;
      max-height: 86vh;
      background: #FFFFFF;
      border-left: none;
      border-top: 1px solid rgba(23, 23, 23, 0.12);
      border-radius: 22px 22px 0 0;
      padding: 18px 18px 24px;
      box-shadow: 0 -16px 40px rgba(0, 0, 0, 0.24);
      animation: sheetUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: #DCD3C3;
      margin: 0 auto 10px;
    }

    .ed-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ed-card > .ed-card-pad {
      padding: 15px 15px 16px;
    }

    .ed-card.ed-card-pad {
      padding: 16px 15px;
    }

    .ed-card:has(> .vereda-card-photo) {
      padding: 0;
    }

    .ed-subtitle {
      font-family: var(--font-sans);
      font-size: 12.5px;
      color: var(--ink-secondary);
      line-height: 1.4;
    }

    .ed-num {
      font-family: var(--font-sans);
      font-variant-numeric: tabular-nums;
    }

    .ed-badge.verified {
      background: #E8F2EC;
      border-color: #CDE2D5;
      color: #1B5E40;
    }

    .ed-badge.caution {
      background: #FDE8E1;
      border-color: #F5C6B7;
      color: #B94E36;
    }

    .ed-badge.signal {
      background: rgba(244, 119, 69, 0.14);
      border-color: rgba(244, 119, 69, 0.35);
      color: #C84616;
    }

    .ed-source-btn {
      background: #FAF7F0;
      border: 1px solid #DFD5C5;
      color: #2E5A85;
    }

    .filter-pills-group {
      display: inline-flex;
      align-items: center;
      background: rgba(23, 23, 23, 0.055);
      padding: 3px;
      border-radius: 9px;
      gap: 2px;
    }

    .filter-pill {
      border: none;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      padding: 5px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .filter-pill.active {
      background: #FFFFFF;
      color: var(--ink-primary);
      box-shadow: 0 1px 3px rgba(23, 23, 23, 0.08);
    }

    /* Pílula de Créditos (Flywheel T16) no Header */
    .credits-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #FAF7F0;
      border: 1px solid rgba(23, 23, 23, 0.11);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .credits-pill-btn:hover {
      background: #FFFFFF;
      border-color: rgba(23, 23, 23, 0.24);
    }

    .credits-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand-orange);
      flex-shrink: 0;
    }

    /* 4 Traços Epistemológicos de Confiança (Documento Definitivo) */
    .conf-trace {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      color: #57534E;
      line-height: 1.2;
    }

    .conf-line {
      width: 16px;
      height: 0;
      display: inline-block;
      flex-shrink: 0;
    }

    .conf-trace.oficial { color: #2E5A85; }
    .conf-trace.oficial .conf-line { border-top: 2px solid #2E5A85; }

    .conf-trace.declarado { color: #57534E; }
    .conf-trace.declarado .conf-line { border-top: 2px dashed #78716C; }

    .conf-trace.inferencia { color: #7C5E2A; }
    .conf-trace.inferencia .conf-line { border-top: 2px dotted #8A6D3B; }

    .conf-trace.nao-sabemos { color: #9A3C1E; }
    .conf-trace.nao-sabemos .conf-line { border-top: 2px dotted #C84B31; }

    /* Folha Contínua Desmodularizada (Sem caixas dentro de caixas) */
    .fact-sheet-card {
      background: #FFFFFF;
      border-radius: 18px;
      border: 1px solid rgba(23, 23, 23, 0.09);
      box-shadow: 0 4px 14px -4px rgba(23, 23, 23, 0.05);
      overflow: hidden;
    }

    .fact-sec {
      border-bottom: 1px solid rgba(23, 23, 23, 0.08);
    }

    .fact-sec:last-child {
      border-bottom: none;
    }

    .fact-sec-head {
      width: 100%;
      background: transparent;
      border: none;
      padding: 15px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .fact-sec-head:hover {
      background: rgba(250, 247, 240, 0.65);
    }

    .fact-sec-title {
      font-family: var(--font-display);
      font-size: 17.5px;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: var(--ink-primary);
      line-height: 1.2;
    }

    .fact-sec-summary {
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      color: #57534E;
      line-height: 1.38;
      margin-top: 3px;
    }

    .fact-sec-chevron {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #78716C;
      flex-shrink: 0;
      margin-top: 2px;
      transition: transform 0.2s ease, background 0.15s ease;
    }

    .fact-sec.open .fact-sec-chevron {
      transform: rotate(180deg);
      background: #F5EFE4;
      color: #171717;
    }

    .fact-sec-body {
      display: none;
      padding: 0 16px 15px;
    }

    .fact-sec.open .fact-sec-body {
      display: block;
    }

    .fact-kv-list {
      border-top: 1px solid rgba(23, 23, 23, 0.06);
    }

    .fact-kv-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(23, 23, 23, 0.06);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.35;
    }

    .fact-kv-row:last-child {
      border-bottom: none;
    }

    .fact-kv-label {
      color: #57534E;
      font-weight: 400;
    }

    .fact-kv-val {
      color: #171717;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .fact-provenance-bar {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid rgba(23, 23, 23, 0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-family: var(--font-sans);
      font-size: 11px;
      color: #78716C;
    }

    .fact-action-links {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .fact-link-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      color: #2E5A85;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .fact-link-btn.contest {
      color: #78716C;
    }

    .fact-link-btn.contest:hover {
      color: #B94E36;
    }

    /* Barras Horizontais Norte → Sul (O Bairro) */
    .neighbor-bar-row {
      display: grid;
      grid-template-columns: 92px 1fr 48px;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      font-family: var(--font-sans);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .neighbor-bar-track {
      height: 7px;
      background: #EFE9DC;
      border-radius: 999px;
      overflow: hidden;
    }

      return `<span class="conf-trace ${item.cls}"><span class="conf-line"></span><span>${item.text}</span></span>`;

      const el = document.getElementById('veredaToast');

      if (!el || !txt) return;
      txt.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2900);
    }

    function switchView(viewName, propId) {
      if (propId) {
        STATE.activePropId = propId;

      STATE.currentView = viewName;

      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      const target = document.getElementById('view-' + viewName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.dock-item').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-dock') === viewName);
      });

      const activeProp = getProp(STATE.activePropId);
      const badge = document.getElementById('activeDossierBadge');
      if (badge && activeProp) badge.textContent = activeProp.shortCode;

      if (viewName === 'explore') renderExplore();
      if (viewName === 'dossier') renderDossier();
      if (viewName === 'compare') renderCompare();
      if (viewName === 'live-visit') renderLiveVisit();
      if (viewName === 'saved') renderSaved();

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

        showToast('Lote pulado — dados do bairro disponíveis no dossiê');
      } else {
        const wasUnconfirmed = !p.lotConfirmed;

        if (wasUnconfirmed) {

        } else {
          showToast(`Polígono ${p.dsqfl} confirmado`);
        }
      }
      switchView('dossier', p.id);
    }

    function renderDonutSvg(breakdown, totalLabel) {
      const r = 34;
      const c = 2 * Math.PI * r;
      let offset = 0;
      const segments = breakdown.map(item => {
        const dash = (item.pct / 100) * c;
        const seg = `<circle cx="44" cy="44" r="${r}" fill="none" stroke="${item.color}" stroke-width="10" stroke-dasharray="${dash} ${c - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 44 44)" />`;
        offset += dash;
        return seg;
      }).join('');

      return `
        <svg width="88" height="88" viewBox="0 0 88 88" style="flex-shrink:0;">
          <circle cx="44" cy="44" r="${r}" fill="none" stroke="#EFE9DC" stroke-width="10" />
          ${segments}
          <text x="44" y="42" text-anchor="middle" font-family="Fraunces, serif" font-size="15" font-weight="500" fill="#171717">${totalLabel}</text>
          <text x="44" y="54" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="8.5" font-weight="600" fill="#78716C">2024</text>
        </svg>
      `;

    function computeStraightDistanceKm(propCoordsStr, destCoords) {
      const parts = propCoordsStr.split(',');
      const lat1 = -parseFloat(parts[0].replace(/[^\d.]/g, '')) || -8.06;
      const lon1 = -parseFloat(parts[1].replace(/[^\d.]/g, '')) || -34.90;
      const R = 6371;
      const dLat = ((destCoords.lat - lat1) * Math.PI) / 180;
      const dLon = ((destCoords.lng - lon1) * Math.PI) / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((destCoords.lat * Math.PI) / 180) * Math.sin(dLon / 2) ** 2;
      const d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return d.toFixed(1).replace('.', ',');
    }

    function setVisitModeTab(tab) {
      STATE.visitModeTab = tab;
      renderLiveVisit();
    }

    function toggleVisitTimer() {
      STATE.visitRunning = !STATE.visitRunning;
      if (STATE.visitRunning) {
        window.__visitInterval = setInterval(() => {
          STATE.visitTimerSec++;
          const sec = STATE.visitTimerSec;
          const m = String(Math.floor(sec / 60)).padStart(2, '0');
          const s = String(sec % 60).padStart(2, '0');
          const tEl = document.getElementById('visitFieldTimerText');
          if (tEl) tEl.textContent = `${m}:${s}`;
          // Slight fluctuation in dB
          const base = STATE.visitWindowOpen ? 58 : 44;
          STATE.visitDbCurrent = Math.round(base + Math.sin(sec * 0.7) * 4);
          const dbEl = document.getElementById('visitFieldDbVal');
          if (dbEl) dbEl.textContent = `${STATE.visitDbCurrent} dB`;
        }, 1000);
        showToast('Cronômetro e sensores ativados no local');
      } else {
        clearInterval(window.__visitInterval);
        showToast('Vistoria pausada');
      }
      renderLiveVisit();
    }

      if (!STATE.visitGpsConfirmed) {

        renderLiveVisit();

    function setCompareSlot(slotIndex, propId) {

      renderCompare();
    }

    function toggleCompareThirdCol() {
      STATE.compareThreeCols = !STATE.compareThreeCols;
      if (STATE.compareThreeCols && STATE.compareIds.length < 3) {
        const remaining = PROPERTIES.find(p => !STATE.compareIds.includes(p.id));
        if (remaining) STATE.compareIds.push(remaining.id);
      }
      renderCompare();
    }

    function renderCompare() {
      const container = document.getElementById('compareContainer');
      if (!container) return;

      const idA = STATE.compareIds[0] || 'boa-viagem';
      const idB = STATE.compareIds[1] || 'gracas';
      const idC = STATE.compareIds[2] || 'casa-forte';

      const compareList = STATE.compareThreeCols
        ? [getProp(idA), getProp(idB), getProp(idC)]
        : [getProp(idA), getProp(idB)];

      const pA = compareList[0];
      const pB = compareList[1];

      // Magnitude differences (Factual sentences without arbitrary score)
      const areaDiff = Math.abs(pA.areaM2 - pB.areaM2);
      const areaSent = areaDiff === 0
        ? 'Ambos possuem a mesma área privativa.'
        : pA.areaM2 > pB.areaM2
        ? `${pA.neighborhood} tem ${areaDiff} m² a mais que ${pB.neighborhood}.`
        : `${pB.neighborhood} tem ${areaDiff} m² a mais que ${pA.neighborhood}.`;

      const perM2A = Math.round(pA.announcedValue / pA.areaM2);
      const perM2B = Math.round(pB.announcedValue / pB.areaM2);
      const m2Diff = Math.abs(perM2A - perM2B);
      const m2Sent = m2Diff === 0
        ? 'Mesmo valor declarado por m².'
        : perM2A < perM2B
        ? `${pA.neighborhood} pede R$ ${m2Diff.toLocaleString('pt-BR')}/m² a menos que ${pB.neighborhood}.`
        : `${pB.neighborhood} pede R$ ${m2Diff.toLocaleString('pt-BR')}/m² a menos que ${pA.neighborhood}.`;

      container.innerHTML = `

            ${STATE.compareThreeCols ? '2 colunas' : '+ 3º imóvel'}
          </button>
        </div>

        <!-- Seletores de Imóvel -->
        <div style="display:grid;grid-template-columns:${STATE.compareThreeCols ? '1fr 1fr 1fr' : '1fr 1fr'};gap:8px;margin-bottom:14px;">
          ${compareList.map((p, idx) => `
            <div style="padding:8px 10px;border-radius:10px;background:#FAF7F0;border:1px solid rgba(23,23,23,0.08);">
              <div style="font-size:10.5px;font-weight:700;color:#C84616;margin-bottom:4px;">OPÇÃO ${String.fromCharCode(65 + idx)}</div>
              <select
                aria-label="Selecionar imóvel ${idx + 1}"
                onchange="setCompareSlot(${idx}, this.value)"
                style="width:100%;padding:6px 7px;border-radius:7px;border:1px solid #DFD5C5;background:#FFFFFF;font-family:var(--font-sans);font-size:12px;font-weight:600;color:#171717;"
