    // =========================================================================
    // CADERNO DE DECISÃO (DOSSIÊS SALVOS)
    // =========================================================================
    function toggleSaveProp(propId, preserveDossier = false) {
      const idx = STATE.savedIds.indexOf(propId);
      if (idx >= 0) {
        STATE.savedIds.splice(idx, 1);
        showToast('Removido dos salvos');
      } else {
        STATE.savedIds.push(propId);
        showToast('Salvo no caderno de decisão');
      }
      if (STATE.currentView === 'explore') renderExplore();
      if (STATE.currentView === 'dossier' && !preserveDossier) renderDossier();
      if (STATE.currentView === 'saved') renderSaved();
    }

    function saveNote(propId, val) {
      STATE.savedNotes[propId] = val;
      showToast('Anotação salva');
    }

    function setSavedFilter(filter) {
      if (!['todos','Alugar','Comprar'].includes(filter)) return;
      JOURNEY.savedFilter=filter; renderSaved(); document.getElementById('vs-filter-'+filter)?.focus({preventScroll:true});
    }
    function openSavedNote(id) {
      const p=getProp(id);
      journeySheet('O que vale lembrar',`<p class="vx-copy">${dossierText(journeyName(p))} · ${dossierText(p.neighborhood)}</p><form onsubmit="saveSavedNote(event,'${p.id}')"><div class="vx-field"><label for="vs-note">Sua anotação</label><textarea id="vs-note" name="note" rows="5" maxlength="3000" placeholder="O que gostou, o que falta confirmar...">${dossierText(STATE.savedNotes[p.id] || '')}</textarea></div><button class="vx-primary" type="submit">Salvar anotação ${dossierIcon('check',16)}</button></form>`);
    }
    function saveSavedNote(event,id) { event.preventDefault(); saveNote(id,String(new FormData(event.target).get('note') || '').trim()); closeDrawer(); renderSaved(); document.getElementById('vs-note-'+id)?.focus({preventScroll:true}); }
    function renderSaved() {
      const container=document.getElementById('savedContainer'); if (!container) return;
      const all=STATE.savedIds.map(id=>PROPERTIES.find(p=>p.id===id)).filter(Boolean);
      const saved=all.filter(p=>JOURNEY.savedFilter==='todos'||p.modality===JOURNEY.savedFilter);
      container.innerHTML=`<div class="vx-page"><div class="vx-topline"><span class="vx-kicker">Sua seleção</span><button class="vx-link" onclick="switchView('compare')">Comparar ${dossierIcon('arrow',14)}</button></div><header class="vx-head"><h1>Seus imóveis salvos.</h1><p>${all.length} ${all.length===1?'opção para olhar com calma.':'opções para olhar com calma.'}</p></header><div class="vx-segments" role="group" aria-label="Filtrar imóveis salvos">${[['todos','Todos'],['Alugar','Aluguel'],['Comprar','Compra']].map(([key,label])=>`<button id="vs-filter-${key}" aria-pressed="${JOURNEY.savedFilter===key}" onclick="setSavedFilter('${key}')">${label}</button>`).join('')}</div>${saved.length?saved.map(p=>`<article class="vs-card"><div class="vs-card-head"><button class="vx-property vx-picker" onclick="switchView('dossier','${p.id}')">${journeyProperty(p)}</button><button class="vs-remove" aria-label="Remover ${dossierText(journeyName(p))} dos salvos" onclick="toggleSaveProp('${p.id}')">${dossierIcon('close',16)}</button></div><div class="vs-price">${formatBRL(p.announcedValue)}${p.modality==='Alugar'?'<small>/mês</small>':''}</div><span class="vx-label">${p.modality==='Alugar'?'Aluguel anunciado':'Preço anunciado'}</span><p class="vs-note">${dossierText(STATE.savedNotes[p.id] || 'Guarde aqui o que importa para você.')}</p><div class="vs-actions"><button class="vx-link" id="vs-note-${p.id}" onclick="openSavedNote('${p.id}')">${STATE.savedNotes[p.id]?'Editar anotação':'Anotar'} ${dossierIcon('arrow',13)}</button><button class="vx-link" onclick="STATE.visitModeTab='prepare'; switchView('live-visit','${p.id}')">Preparar visita ${dossierIcon('arrow',13)}</button></div></article>`).join(''):`<div class="vx-surface vx-empty"><h2>${all.length?'Nenhum imóvel neste filtro.':'Sua próxima opção começa aqui.'}</h2><p class="vx-copy">${all.length?'Veja todos os seus salvos ou explore outras opções.':'Salve os imóveis que chamarem sua atenção para reunir notas e preparar visitas.'}</p><button class="vx-primary" onclick="${all.length?"setSavedFilter('todos')":"switchView('explore')"}">${all.length?'Ver todos os salvos':'Explorar imóveis'} ${dossierIcon('arrow',16)}</button></div>`}</div>`;
    }

    // =========================================================================
    // INICIALIZAÇÃO DA APLICAÇÃO
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      updateCreditsBadges();
      renderExplore();
      renderDossier();
      renderCompare();
      renderLiveVisit();
      renderSaved();
    });

  </script>
