          <span class="ds-label">${finance.complete ? (finance.estimated ? 'Custo mensal estimado' : 'Custo mensal') : (finance.isRent ? 'Custo mensal conhecido' : 'Manutenção mensal conhecida')}</span>
          <p class="ds-total">${finance.known.length ? formatBRL(finance.total) : 'A confirmar'}${finance.known.length ? '<small> /mês</small>' : ''}</p>
          ${positive.length ? `<div class="ds-expense-bar" role="img" aria-label="Composição dos ${formatBRL(finance.total)} mensais conhecidos: ${positive.map(item => item.label + ' ' + formatBRL(item.monthly)).join(', ')}">${positive.map(item => `<span title="${item.label}: ${formatBRL(item.monthly)}/mês" style="width:${item.monthly / finance.total * 100}%;background:${DOSSIER_COLORS[item.key]}"></span>`).join('')}</div>` : ''}
          <dl class="ds-expense-legend">${finance.entries.map(item => `<div><dt><i class="ds-dot" style="background:${item.monthly === null ? '#C9BEA8' : DOSSIER_COLORS[item.key]}"></i>${item.label}${item.estimated ? ' estimado' : ''}</dt><dd>${item.monthly === null ? 'A confirmar' : formatBRL(item.monthly)}</dd></div>`).join('')}</dl>
          ${finance.pending.length ? `<p class="ds-pending">${pendingText} fora da soma.${tax?.monthly === null && tax?.amount !== null ? ` O anúncio informa ${formatBRL(tax.amount)}, sem periodicidade.` : ''}</p>` : ''}
          ${!finance.isRent ? '<p class="ds-pending">Preço de compra e financiamento não entram nesta soma.</p>' : ''}
          ${finance.estimated ? '<p class="ds-pending">Inclui estimativas informadas por você.</p>' : ''}
        </div>
        <button class="ds-link" onclick="openDossierCosts()">Ver composição e ajustar valores ${dossierIcon('arrow', 13)}</button>`;
    }

    function renderDossier() {
      const container = document.getElementById('dossierContainer');
      if (!container) return;
      const p = getProp(STATE.activePropId);
      if (DOSSIER.propertyId !== p.id) {
        DOSSIER.propertyId = p.id;
        DOSSIER.category = 'destaques';
        DOSSIER.radius = p.itbiMatrix?.['500m_12m']?.count >= 10 ? '500m' : 'Bairro';
        DOSSIER.period = '12m';
        DOSSIER.mapZoom = 1;
        DOSSIER.mapLayer = 'rotas';
        DOSSIER.benchmarkMode = 'recorte';
        DOSSIER.compareId = null;
        DOSSIER.heatCompareId = null;
      }
      const meta = HOME_CARD_META[p.id] || { cleanName: p.title.split('·')[0].trim(), bathrooms: p.bathrooms };
      const isSaved = STATE.savedIds.includes(p.id);
      container.innerHTML = `
        <article class="ds-overview" aria-label="Resumo do imóvel">
          <div class="ds-photo">
            ${renderDossierGallery(p, false, true)}
            <button class="ds-photo-action ds-back" aria-label="Voltar aos imóveis" onclick="switchView('explore')">${dossierIcon('back')}</button>
            <button class="ds-photo-action ds-save" aria-label="${isSaved ? 'Remover dos salvos' : 'Salvar imóvel'}" aria-pressed="${isSaved}" onclick="toggleSaveDossier('${p.id}')">${renderBookmarkSvg(isSaved)}</button>
          </div>
          <div class="ds-property-info">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;">
              <p class="ds-location" style="margin:0;">${dossierText(p.neighborhood)} · ${dossierText(p.city)}</p>
              <span class="conf-trace ${p.lotConfirmed ? 'conf-oficial' : 'conf-inferencia'}" style="font-size:10.5px;padding:2px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;">
                <span class="conf-dot" style="background:${p.lotConfirmed ? '#2E5A85' : '#C84616'};"></span>
                ${p.lotConfirmed ? 'Lote confirmado ✓' : 'Lote a confirmar'}
              </span>
            </div>
            <h1>${dossierText(meta.cleanName)}</h1>
            <p class="ds-address">${dossierText(p.address.split('·')[0].trim())} · ${dossierText(p.floor)}</p>
            ${renderSpecsStripHtml(p, meta)}
            <div class="ds-property-links"><button class="ds-link ds-link-muted" onclick="openListingFacts('${p.id}')">Dados do anúncio ${dossierIcon('arrow', 12)}</button>${!p.lotConfirmed ? `<button class="ds-link" onclick="triggerUrlDecode('${p.id}')">Confirmar prédio</button>` : `<button class="ds-link ds-link-muted" onclick="openDossierEvidence('cadastro')">Cadastro oficial (DSQFL)</button>`}</div>
          </div>
          <div class="ds-finance" id="dossier-financial">${renderDossierFinance(p)}</div>
        </article>
        <div class="ds-tabs" role="tablist" aria-label="Explorar o dossiê" onkeydown="dossierTabKey(event)">
          ${[['destaques','Destaques'],['entorno','Entorno'],['edificio','Edifício']].map(([key,label]) => `<button id="ds-tab-${key}" role="tab" aria-controls="dossier-panel" aria-selected="${DOSSIER.category === key}" tabindex="${DOSSIER.category === key ? 0 : -1}" onclick="setDossierCategory('${key}')">${label}</button>`).join('')}
        </div>
        <div class="ds-panel" id="dossier-panel" role="tabpanel" aria-labelledby="ds-tab-${DOSSIER.category}" tabindex="0">${renderDossierCategory(p)}</div>
        <div class="ds-after-panel">
          <button class="ds-primary" onclick="STATE.visitModeTab='prepare'; switchView('live-visit','${p.id}')">Preparar visita ${dossierIcon('arrow',16)}</button>
          <div class="ds-actions"><button class="ds-link ds-link-muted" onclick="switchView('compare')">Comparar imóveis</button><button class="ds-link ds-link-muted" onclick="openDiscardSheet('${p.id}')">Descartar</button></div>
        </div>`;
    }

    function toggleSaveDossier(propId) {
      const button = document.querySelector('#view-dossier .ds-save');
      // Reaproveita os salvos sem reconstruir a foto nem perder a rolagem.
      toggleSaveProp(propId, true);
      const saved = STATE.savedIds.includes(propId);
      button.innerHTML = renderBookmarkSvg(saved);
      button.setAttribute('aria-pressed', String(saved));
      button.setAttribute('aria-label', saved ? 'Remover dos salvos' : 'Salvar imóvel');
    }

    function dossierTabKey(event) {
      const keys = ['destaques','entorno','edificio'];
      const index = keys.indexOf(DOSSIER.category);
      const next = event.key === 'ArrowRight' ? (index + 1) % 3 : event.key === 'ArrowLeft' ? (index + 2) % 3 : event.key === 'Home' ? 0 : event.key === 'End' ? 2 : -1;
      if (next < 0) return;
      event.preventDefault();
      setDossierCategory(keys[next]);
      document.getElementById('ds-tab-' + keys[next]).focus();
    }

    function setDossierCategory(category, anchor) {
      if (!['destaques','entorno','edificio'].includes(category)) return;
      DOSSIER.category = category;
      document.querySelectorAll('.ds-tabs [role=tab]').forEach(button => {
        const selected = button.id === 'ds-tab-' + category;
        button.setAttribute('aria-selected', String(selected));
        button.tabIndex = selected ? 0 : -1;
      });
      const panel = document.getElementById('dossier-panel');
      panel.setAttribute('aria-labelledby','ds-tab-' + category);
      panel.innerHTML = renderDossierCategory(getProp(STATE.activePropId));
      if (anchor) {
        const target = document.getElementById(anchor) || panel;
        target.setAttribute('tabindex','-1');
        target.focus({ preventScroll: true });
        target.scrollIntoView({ block:'start', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
      }
    }

    function renderDossierCategory(p) {
      return DOSSIER.category === 'entorno' ? renderDossierSurroundings(p) : DOSSIER.category === 'edificio' ? renderDossierBuilding(p) : renderDossierHighlights(p);
    }

    function getDossierFindings(p) {
      const findings = [];
      const market = getDossierMarket(p);
      if (!p.lotConfirmed) findings.push({ type:'lote', title:'Confirme este prédio', metric:'1', unit:'passo para liberar o cadastro', text:'Selecione o lote para ver os registros.', action:'Confirmar prédio' });
      if (p.lotConfirmed && p.typologyCheck?.triggeredCount === 3) findings.push({ type:'estrutura', title:'Antes de reformar, confira a estrutura', metric:'3', unit:'sinais no cadastro', text:'Prédio baixo, anterior a 2005 e padrão simples ou médio.', action:'Entender os sinais' });
      if (Number.isFinite(p.suites) && Number.isFinite(p.bathrooms) && p.suites > p.bathrooms) findings.push({ type:'banheiros', title:'Banheiros não conferem', metric:`${p.suites} × ${p.bathrooms}`, unit:'suítes × banheiros', text:'Confirme a quantidade na visita.', action:'Ver divergência' });
      if (market.valid && Math.abs(market.delta) >= 10) findings.push({ type:'mercado', title:market.isRent ? 'Aluguel fora da mediana' : market.delta>0 ? 'Pedido acima da base fiscal' : 'Pedido abaixo da base fiscal', metric:`${market.delta >= 0 ? '+' : '−'}${Math.abs(Math.round(market.delta))}%`, unit:market.isRent ? 'vs. aluguéis próximos' : 'vs. avaliações fiscais', text:market.isRent ? `${market.stats.count} anúncios comparados por m².` : 'Compare o pedido com os registros do entorno.', action:'Explorar comparação' });
      const works = dossierNumber(p.worksSection?.items?.[0]?.value);
      if (works >= 3) findings.push({ type:'obras', title:'Obras em 150 m', metric:String(works), unit:'registros desde 2017', text:p.worksSection.summary.split('·').slice(1).join('·').trim() || 'Veja os processos e o andamento.', action:'Ver registros' });
      const flood=getDossierFlood(p);
      if (flood.direct&&flood.count>0) findings.push({type:'alagamento',title:'Alagamentos registrados no bairro',metric:String(flood.count),unit:'registros em 2024',text:'Defesa Civil · '+p.neighborhood,action:'Ver o recorte'});
      const heat = p.microclimateAndCensus?.heatIsland;
      const delta = heat ? dossierNumber(heat) : null;
      if (Number.isFinite(delta) && Math.abs(delta) >= 1.5) findings.push({ type:'calor', title:delta < 0 ? 'Superfície mais fresca' : 'Superfície mais quente', metric:`${delta > 0 ? '+' : '−'}${Math.abs(delta).toLocaleString('pt-BR')}°`, unit:'de diferença na superfície', text:`vs. ${getDossierClimate(p).reference} · Landsat 8/9`, action:'Ver ambiente' });
      if (getDossierFinance(p).pending.some(item => item.key === 'iptu')) findings.push({ type:'iptu', title:'Falta fechar o IPTU', metric:'IPTU', unit:'valor mensal a confirmar', text:'Peça a guia atualizada.', action:'Ver composição' });
      return findings.slice(0,3);
    }

    function openDossierFinding(type) {
      if (type === 'lote') return triggerUrlDecode(STATE.activePropId);
      if (type === 'mercado') return openDossierBenchmark();
      if (type === 'obras') return setDossierCategory('edificio','ds-building-works');
      if (type === 'calor' || type === 'alagamento') { DOSSIER.mapLayer=type; return setDossierCategory('entorno','ds-central-map'); }
      if (type === 'iptu') return openDossierCosts();
      openDossierEvidence(type === 'banheiros' ? 'anuncio' : 'estrutura');
    }

    function renderDossierHighlights(p) {
      const findings = getDossierFindings(p);
      const first = findings[0];
      if (!first) return '<p class="ds-eyebrow">Leitura do imóvel</p><h2>Nenhuma divergência identificada nos dados disponíveis.</h2><p class="ds-copy">Explore o entorno e os registros do edifício para preparar a visita.</p>';
      return `<p class="ds-eyebrow">O que o Vereda encontrou</p><h2>Além do anúncio.</h2>
        <article class="ds-primary-finding"><h3>${first.title}</h3><div class="ds-finding-measure"><strong>${first.metric}</strong><span>${first.unit}</span></div><p class="ds-copy">${dossierText(first.text)}</p><button class="ds-link" onclick="openDossierFinding('${first.type}')">${first.action} ${dossierIcon('arrow',13)}</button></article>
        ${findings.slice(1).map(finding => {
          const label={obras:'registros de obra',calor:'na superfície',mercado:finding.unit,alagamento:'registros de alagamento',estrutura:'sinais no cadastro',iptu:'a confirmar',lote:'confirmação pendente',banheiros:'suítes × banheiros'}[finding.type] || finding.title;
          const detail=finding.type==='obras'?'Em 150 m · '+finding.text:finding.text;
          return `<article class="ds-support-finding"><button class="ds-support-action" onclick="openDossierFinding('${finding.type}')" aria-label="${dossierText(finding.metric+' '+label+'. '+finding.action)}"><span><span class="ds-support-headline"><strong>${dossierText(finding.metric)}</strong> ${dossierText(label)}</span><small>${dossierText(detail)}</small></span>${dossierIcon('arrow',17)}</button></article>`;
        }).join('')}
        ${p.lotConfirmed ? `<button class="ds-check-entry" onclick="setDossierCategory('edificio','ds-building-checks')"><span><strong>Antes de decidir</strong><small>${getDossierChecks(p).length} verificações para a visita</small></span>${dossierIcon('arrow',17)}</button>` : ''}`;
    }

    function dossierDelta(delta) {
      const rounded=Math.abs(delta)<1?Math.round(Math.abs(delta)*10)/10:Math.round(Math.abs(delta));
      return {metric:(rounded===0?'':delta>0?'+':'−')+rounded.toLocaleString('pt-BR')+'%',tone:rounded===0?'is-level':delta>0?'is-above':'is-below',direction:rounded===0?'na mediana':delta>0?'acima da mediana':'abaixo da mediana'};
    }

    function dossierUnit(value) {
      return value.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0,maximumFractionDigits:1});
    }

    function renderDossierBullet(value, reference, options = {}) {
      if (![value,reference].every(v=>Number.isFinite(v)&&v>=0)) return '';
      const max=Math.max(options.max || 0,value,reference,1)*1.12;
      const valueLabel=options.valueLabel || 'Este imóvel', referenceLabel=options.referenceLabel || 'Mediana';
      return `<div class="ds-bullet ${options.reverse?'is-neighborhood':''}" role="img" aria-label="${dossierText(valueLabel+' '+dossierUnit(value)+' por m²; '+referenceLabel+' '+dossierUnit(reference)+' por m²')}"><div class="ds-bullet-track"><span style="width:${value/max*100}%"></span><i style="left:${reference/max*100}%"></i></div>${options.compact?'':`<div class="ds-bullet-labels"><div><span><i class="ds-bullet-key"></i>${dossierText(valueLabel)}</span><strong>${dossierUnit(value)}<small>/m²</small></strong></div><div><span><i class="ds-reference-key"></i>${dossierText(referenceLabel)}</span><strong>${dossierUnit(reference)}<small>/m²</small></strong></div></div>`}</div>`;
    }

    function renderDossierMarketChart(p, detailed = false) {
      const m=getDossierMarket(p);
      if (!m.valid) return `<p class="ds-copy">Amostra insuficiente.${detailed?' Amplie o raio ou o período.':''}</p>`;
      const delta=dossierDelta(m.delta);
      const summary=`<div class="ds-relative ds-price-delta ${delta.tone}"><strong>${delta.metric}</strong><span>${delta.direction}<small>${m.isRent?'Aluguéis do entorno':'Avaliações fiscais'} · ${m.radius==='Bairro'?'bairro':m.radius==='500m'?'500 m':'1 km'}</small></span></div>`;
      return `${summary}${renderDossierBullet(m.unit,m.stats.median,{max:m.stats.p75,referenceLabel:m.isRent?'Mediana do entorno':'Mediana fiscal'})}${detailed?`<p class="ds-map-note">${dossierText(m.stats.periodLabel)}</p>`:''}`;
    }

    function getDossierComparables(p) {
      const origin=dossierCoordinates(p);
      const distance=item=>{const c=dossierCoordinates(item);return origin&&c?Math.hypot(c.lat-origin.lat,(c.lng-origin.lng)*Math.cos(origin.lat*Math.PI/180)):Infinity;};
      return PROPERTIES.filter(item=>item.id!==p.id&&item.modality===p.modality&&Number.isFinite(item.areaM2)&&item.areaM2>0&&Number.isFinite(item.announcedValue)).sort((a,b)=>distance(a)-distance(b));
    }

    function renderDossierNeighborhoodComparison(p) {
      const seen=new Set();
      const rows=[p,...getDossierComparables(p)].filter(item=>{if(seen.has(item.neighborhood))return false;seen.add(item.neighborhood);return true;}).map(item=>({p:item,m:getDossierMarket(item,'Bairro',DOSSIER.period)})).filter(item=>item.m.valid);
      if (!rows.length) return '<p class="ds-copy">Sem amostra suficiente para comparar bairros.</p>';
      const unit=getDossierMarket(p).unit;
      if (!Number.isFinite(unit)) return '<p class="ds-copy">Confirme a área para comparar por m².</p>';
      const max=Math.max(unit,...rows.map(item=>item.m.stats.p75 || item.m.stats.median));
      return `<p class="ds-copy">Mediana por bairro</p><p class="ds-comparison-key"><i class="ds-reference-key is-property-key"></i>Este imóvel · ${dossierUnit(unit)}/m²</p>${rows.map(item=>`<div class="ds-neighborhood-row"><div><strong>${dossierText(item.p.neighborhood)}</strong><span>${dossierUnit(item.m.stats.median)}<small>/m²</small></span></div>${renderDossierBullet(item.m.stats.median,unit,{compact:true,reverse:true,max,valueLabel:item.p.neighborhood,referenceLabel:'Este imóvel'})}<small>${item.m.stats.count} ${item.m.isRent?'anúncios':'avaliações fiscais'} · ${DOSSIER.period==='12m'?'12':'24'} meses</small></div>`).join('')}`;
    }

    function renderDossierPropertyComparison(p) {
      const others=getDossierComparables(p), other=others.find(item=>item.id===DOSSIER.compareId) || others[0];
      if (!other) return '<p class="ds-copy">Adicione outro imóvel desta modalidade para comparar.</p>';
      const current=getDossierMarket(p).unit, reference=other.announcedValue/other.areaM2;
      if (!Number.isFinite(current) || reference<=0) return '<p class="ds-copy">Confirme área e preço para comparar.</p>';
      const delta=dossierDelta((current/reference-1)*100);
      const otherName=HOME_CARD_META[other.id]?.cleanName || other.title.split('·')[0];
      const currentCost=getDossierFinance(p), otherCost=getDossierFinance(other);
      const saving=currentCost.total-otherCost.total;
      return `<label class="ds-label" for="ds-compare-property">Comparar com</label><select class="ds-secondary ds-full-select" id="ds-compare-property" onchange="setDossierComparison('imoveis',this.value)">${others.map(item=>`<option value="${item.id}" ${other.id===item.id?'selected':''}>${dossierText(HOME_CARD_META[item.id]?.cleanName || item.neighborhood)}</option>`).join('')}</select><div class="ds-property-comparison"><img src="${dossierText(other.image)}" alt=""/><div><strong>${dossierText(otherName)}</strong><span>${dossierText(other.neighborhood)} · ${other.areaM2} m² · ${other.bedrooms} quartos</span></div></div><div class="ds-relative ds-price-delta ${delta.tone}"><strong>${delta.metric}</strong><span>${delta.metric==='0%'?'mesmo patamar por m²':current>reference?'a mais por m²':'a menos por m²'}<small>Este imóvel × opção selecionada</small></span></div>${renderDossierBullet(current,reference,{referenceLabel:'Outra opção'})}${p.modality==='Alugar'&&currentCost.known.length&&otherCost.known.length?`<div class="ds-cost-comparison"><span>Custo mensal conhecido</span><div><strong>${formatBRL(currentCost.total)}<small>este imóvel</small></strong><strong>${formatBRL(otherCost.total)}<small>outra opção</small></strong></div>${Math.abs(saving)>=1?`<p>A outra opção custa <b>${formatBRL(Math.abs(saving))} ${saving>0?'a menos':'a mais'}/mês</b>.</p>`:''}</div>`:''}<button class="ds-link" onclick="openDossierFullComparison('${other.id}')">Abrir comparação completa ${dossierIcon('arrow',13)}</button>`;
    }

    function setDossierComparison(mode, id) {
      if (!['recorte','bairros','imoveis'].includes(mode)) return;
      DOSSIER.benchmarkMode=mode;
      if (id) DOSSIER.compareId=id;
      openDossierBenchmark(true);
      (id?document.getElementById('ds-compare-property'):document.getElementById('ds-compare-'+mode))?.focus({preventScroll:true});
    }

    function openDossierFullComparison(id) {
      if (!getDossierComparables(getProp(STATE.activePropId)).some(item=>item.id===id)) return;
      STATE.compareIds=[STATE.activePropId,id]; STATE.compareThreeCols=false;
      closeDrawer(); switchView('compare');
    }

    function dossierCoordinates(p) {
      const parts = String(p.coordinates || '').split(',');
      const lat = parseFloat(parts[0]);
      const lng = parseFloat(parts[1]);
      return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
    }

    function dossierRouteUrl(route) {
      const destination = route.address || (route.coords ? `${route.coords.lat},${route.coords.lng}` : route.label + ' Recife');
      const start = dossierCoordinates(getProp(STATE.activePropId));
      return `https://www.google.com/maps/dir/?api=1&${start ? `origin=${start.lat},${start.lng}&` : ''}destination=${encodeURIComponent(destination)}`;
    }

    function getDossierFlood(p) {
      const all=p.civilDefenseSection?.breakdown?.filter(item=>Number.isFinite(item.value)&&item.value>=0) || [];
      const direct=all.filter(item=>/alagamento|inunda[cç][aã]o/i.test(item.label)&&!/vistoria|drenagem|lona/i.test(item.label));
      const related=all.filter(item=>/drenagem|lona|vistoria.*(?:alagamento|inunda)/i.test(item.label));
      const entries=direct.length?direct:related;
      const count=entries.length?entries.reduce((sum,item)=>sum+item.value,0):null;
      const total=p.civilDefenseSection?.total;
      const pointsMatch=p.microclimateAndCensus?.censusIncome?.match(/(\d+) pontos? cr[ií]ticos? de alagamento no quarteir[aã]o/i);
      const points=pointsMatch?Number(pointsMatch[1]):null;
      return {entries,count,total,points,direct:!!direct.length};
    }

    function getDossierHeatComparison(p) {
      const climate=getDossierClimate(p);
      const globalReference=['Recife','Zona Norte'].includes(climate.reference);
      const candidates=PROPERTIES.filter(item=>item.id!==p.id&&globalReference&&getDossierClimate(item).reference===climate.reference&&getDossierClimate(item).hasReference);
      const other=candidates.find(item=>item.id===DOSSIER.heatCompareId);
      const reference=other?getDossierClimate(other).delta:0;
      return {climate,candidates,other,difference:climate.delta===null?null:climate.delta-reference,
        label:other?other.neighborhood:climate.reference==='bairro'?'Média do bairro':climate.reference==='Recife'?'Média de Recife':climate.reference==='Zona Norte'?'Média da Zona Norte':'Referência local'};
    }

    function renderDossierMapContext(p) {
      if (DOSSIER.mapLayer==='rotas') return `<div class="ds-layer-content" aria-label="Destinos e rotas">${STATE.dailyRoutes.length?`<label class="ds-label" for="ds-route-select">Seu destino</label><select class="ds-secondary ds-full-select" id="ds-route-select" onchange="chooseDossierRoute(this.value)">${STATE.dailyRoutes.map(route=>`<option value="${dossierText(route.id)}" ${route.id===DOSSIER.routeId?'selected':''}>${dossierText(route.label)}</option>`).join('')}</select>`:''}${STATE.dailyRoutes.map(route=>`<div class="ds-route"><div><p class="ds-route-name">${dossierText(route.label)}</p><small>${route.coords?`${computeStraightDistanceKm(p.coordinates,route.coords)} km em linha reta`:dossierText(route.address)}</small></div><a class="ds-link" href="${dossierRouteUrl(route)}" target="_blank" rel="noopener">Abrir rota ${dossierIcon('arrow',12)}</a></div>`).join('')}<button class="ds-link" onclick="openDossierDestination()">${dossierIcon('plus',14)} Adicionar destino</button></div>`;
      if (DOSSIER.mapLayer==='servicos') return `<div class="ds-layer-content" aria-label="Serviços próximos"><h3 class="ds-layer-title">O que você quer por perto?</h3><div id="ds-poi-mount">${renderDossierInterests(p)}</div></div>`;
      if (DOSSIER.mapLayer==='alagamento') {
        const flood=getDossierFlood(p);
        const title=flood.points===0?'Sem pontos críticos no quarteirão':flood.points>0?`${flood.points} ${flood.points===1?'ponto crítico':'pontos críticos'} no quarteirão`:flood.direct&&flood.count>0?'Há registros de alagamento no bairro':'Como fica o acesso quando chove?';
        return `<div class="ds-layer-content ds-water-insight" aria-label="Alagamento e período de chuva"><h3 class="ds-rain-title">${title}</h3>${renderDossierRainSeason()}<p class="ds-rain-question">Confira a rua e a entrada da garagem.</p><button class="ds-link" onclick="openDossierFlood()">Entender o entorno ${dossierIcon('arrow',13)}</button></div>`;
      }
      const heat=getDossierHeatComparison(p), {climate,difference,label}=heat;
      const magnitude=difference===null?'—':`${difference<0?'−':difference>0?'+':''}${Math.abs(difference).toLocaleString('pt-BR',{maximumFractionDigits:1})} °C`;
      const cool=(difference ?? 0)<0, max=Math.max(Math.abs(difference || 0),3.5)*1.15;
      const position=50+(difference || 0)/max*50;
      return `<div class="ds-layer-content ${cool?'ds-cool-insight':'ds-warm-insight'}" aria-label="Comparação de calor">${heat.candidates.length?`<label class="ds-label" for="ds-heat-compare">Comparar com</label><select class="ds-secondary ds-full-select" id="ds-heat-compare" onchange="chooseDossierHeatComparison(this.value)"><option value="">${dossierText(climate.reference==='Recife'?'Média de Recife':'Média da Zona Norte')}</option>${heat.candidates.map(item=>`<option value="${item.id}" ${item.id===heat.other?.id?'selected':''}>${dossierText(item.neighborhood)}</option>`).join('')}</select>`:''}<div class="ds-layer-figure"><strong>${magnitude}</strong><div><span>${difference===null?'Superfície':difference===0?'mesma referência térmica':cool?'superfície mais fresca':'superfície mais quente'}</span><small>${climate.hasReference?'vs. '+dossierText(label):'Entorno do Capibaribe'}</small></div></div>${climate.hasReference&&difference!==null?`<div class="ds-heat-scale" role="img" aria-label="Este endereço: ${magnitude} em relação a ${dossierText(label)}"><div class="ds-heat-track"><i class="ds-heat-join" style="left:${Math.min(position,50)}%;width:${Math.abs(position-50)}%"></i><b class="ds-heat-reference"></b><b class="ds-heat-address" style="left:${position}%"></b></div><div class="ds-heat-legend"><span><i></i>Este endereço</span><span><b></b>${dossierText(label)}</span></div></div>`:''}<button class="ds-link" onclick="openDossierEvidence('ambiente')">Explorar o ambiente ${dossierIcon('arrow',13)}</button></div>`;
    }

    function chooseDossierHeatComparison(id) {
      const heat=getDossierHeatComparison(getProp(STATE.activePropId));
      DOSSIER.heatCompareId=heat.candidates.some(item=>item.id===id)?id:null;
      document.getElementById('ds-map-context').innerHTML=renderDossierMapContext(getProp(STATE.activePropId));
      document.getElementById('ds-heat-compare')?.focus({preventScroll:true});
    }

    function renderDossierRainSeason() {
      const months=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
      return `<div class="ds-rain-season"><strong>Abr–Jul</strong><span>Chuvas mais intensas<br>no Recife</span></div><div class="ds-rain-calendar" role="img" aria-label="Calendário anual. Abril, maio, junho e julho: período de maior intensidade de chuva no Recife.">${months.map((month,index)=>`<span class="${index>=3&&index<=6?'is-rainy':''}" aria-hidden="true">${month}</span>`).join('')}</div>`;
    }

    function openDossierFlood() {
      const p=getProp(STATE.activePropId), flood=getDossierFlood(p);
      showDossierSheet('Chuva e acesso ao imóvel',`${renderDossierRainSeason()}${flood.points===null?'':dossierRows([{label:'Pontos críticos no quarteirão',value:String(flood.points)}])}<h3 class="ds-detail-title">O que conferir na visita</h3><p class="ds-copy">A rua fica transitável? A água chega à garagem? Pergunte ao porteiro e aos moradores sobre chuvas recentes.</p><h3 class="ds-detail-title">Registros em ${dossierText(p.neighborhood)}</h3>${flood.entries.length?dossierRows(flood.entries.map(item=>({label:item.label,value:item.value+' atendimentos · 2024'}))):'<p class="ds-copy">Sem categoria de alagamento ou drenagem neste recorte.</p>'}<p class="ds-note">${flood.direct?'Registros do bairro não indicam o risco de cada rua.':'Atendimentos de lona e drenagem não medem alagamentos na rua.'}</p><button class="ds-link" onclick="openSourceSheet('DEFESA_CIVIL')">Ver registros da Defesa Civil ${dossierIcon('arrow',13)}</button><a class="ds-link" href="https://acaoinverno.recife.pe.gov.br/wp-content/uploads/2026/04/PLANO-DE-CONTINGENCIA-RECIFE-2026__final.pdf#page=83" target="_blank" rel="noopener">Período de chuva · Prefeitura do Recife ${dossierIcon('arrow',13)}</a>`);
    }

    function getDossierSecurity(p) {
      const safety=p.securitySection;
      const neighbors=safety?.neighborsNorthToSouth?.filter(item=>Number.isFinite(item.rate)&&item.rate>=0) || [];
      const rate=Number.isFinite(safety?.ratePer1k)&&safety.ratePer1k>=0?safety.ratePer1k:null;
      // Só ordenar quando o próprio bairro faz parte do mesmo recorte.
      const rank=rate!==null&&neighbors.some(item=>item.current&&item.rate===rate)?1+neighbors.filter(item=>item.rate<rate).length:null;
      const natures=safety?.byNature?.filter(item=>Number.isFinite(item.pct)&&item.pct>=0&&item.pct<=100) || [];
      const leading=[...natures].sort((a,b)=>b.pct-a.pct)[0];
      return {safety,neighbors,rate,rank,natures,leading};
    }

    function renderDossierMap(p) {
      const center = dossierCoordinates(p);
      if (!center) return '<p class="ds-note">Localização não disponível. Confirme o endereço do anúncio.</p>';
      const route = STATE.dailyRoutes.find(item => item.id === DOSSIER.routeId);
      const routePoint = DOSSIER.mapLayer === 'rotas' ? route?.coords : null;
      const aspect = 1.5;
      const mid = routePoint ? {lat:(center.lat + routePoint.lat)/2,lng:(center.lng + routePoint.lng)/2} : center;
      const cos = Math.cos(mid.lat * Math.PI / 180);
      const latSpan = Math.max(.011 / DOSSIER.mapZoom, routePoint ? Math.abs(center.lat-routePoint.lat)*1.6 : 0, routePoint ? Math.abs(center.lng-routePoint.lng)*cos/aspect*1.6 : 0);
      const lonSpan = latSpan * aspect / cos;
      const bounds = [mid.lng-lonSpan/2,mid.lat-latSpan/2,mid.lng+lonSpan/2,mid.lat+latSpan/2];
      const merc = lat => Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));
      const xy = point => ({x:(point.lng-bounds[0])/lonSpan*360,y:(merc(bounds[3])-merc(point.lat))/(merc(bounds[3])-merc(bounds[1]))*240});
      const pin = xy(center), dest = routePoint ? xy(routePoint) : null;
      const captions = {
        rotas: routePoint ? `${computeStraightDistanceKm(p.coordinates,routePoint)} km em linha reta · ${route.label.split('·')[0].trim()}` : 'Localização do anúncio',
        alagamento: 'Alagamento · recorte do bairro', calor:'Calor · temperatura da superfície', servicos:'Serviços · base OpenStreetMap'
      };
      return `<div class="ds-map-tabs" role="group" aria-label="Camada do mapa">${[['rotas','Rotas'],['alagamento','Alagamento'],['calor','Calor'],['servicos','Serviços']].map(([key,label]) => `<button data-layer="${key}" aria-pressed="${DOSSIER.mapLayer===key}" onclick="setDossierLayer('${key}')">${label}</button>`).join('')}</div>
        <div class="ds-map">
          <iframe title="Mapa de ${dossierText(p.neighborhood)}" tabindex="-1" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${bounds.join('%2C')}&amp;layer=mapnik" aria-hidden="true"></iframe>
          <svg viewBox="0 0 360 240" preserveAspectRatio="none" aria-hidden="true">${dest ? `<line x1="${pin.x}" y1="${pin.y}" x2="${dest.x}" y2="${dest.y}" stroke="#2E5A85" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="${dest.x}" cy="${dest.y}" r="6" fill="#2E5A85" stroke="white" stroke-width="2"/>` : ''}<circle cx="${pin.x}" cy="${pin.y}" r="13" fill="#F4774533"/><circle cx="${pin.x}" cy="${pin.y}" r="7" fill="#F47745" stroke="white" stroke-width="2"/></svg>
          ${!dest ? `<div class="ds-map-controls"><button aria-label="Aproximar mapa" onclick="zoomDossierMap(1)" ${DOSSIER.mapZoom >= 3 ? 'disabled' : ''}>+</button><button aria-label="Afastar mapa" onclick="zoomDossierMap(-1)" ${DOSSIER.mapZoom <= .5 ? 'disabled' : ''}>−</button></div>` : ''}
          <span class="ds-map-caption">${dossierText(captions[DOSSIER.mapLayer])}</span><span class="ds-map-credit">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></span>
        </div><div id="ds-map-context">${renderDossierMapContext(p)}</div>`;
    }

    function focusDossierMap() { setDossierCategory('entorno','ds-central-map'); }
    function setDossierLayer(layer) {
      if (!['rotas','alagamento','calor','servicos'].includes(layer)) return;
      const previous=DOSSIER.mapLayer;
      if (previous===layer) return;
      DOSSIER.mapLayer = layer;
      const p=getProp(STATE.activePropId), context=document.getElementById('ds-map-context');
      if (previous!=='rotas'&&layer!=='rotas'&&context) {
        document.querySelectorAll('.ds-map-tabs button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.layer===layer)));
        document.querySelector('.ds-map-caption').textContent={alagamento:'Alagamento · recorte do bairro',calor:'Calor · temperatura da superfície',servicos:'Serviços · base OpenStreetMap'}[layer];
        context.innerHTML=renderDossierMapContext(p);
      } else document.getElementById('ds-map-mount').innerHTML = renderDossierMap(p);
      document.querySelector('.ds-map-tabs [aria-pressed="true"]').focus({preventScroll:true});
    }
    function zoomDossierMap(direction) {
      DOSSIER.mapZoom = Math.max(.5,Math.min(3,DOSSIER.mapZoom+direction*.5));
      document.getElementById('ds-map-mount').innerHTML = renderDossierMap(getProp(STATE.activePropId));
      document.querySelector(`.ds-map-controls button[aria-label="${direction > 0 ? 'Aproximar mapa' : 'Afastar mapa'}"]`)?.focus({preventScroll:true});
    }
    function chooseDossierRoute(id) {
      DOSSIER.routeId = id;
      DOSSIER.mapLayer = 'rotas';
      document.getElementById('ds-map-mount').innerHTML = renderDossierMap(getProp(STATE.activePropId));
      document.getElementById('ds-route-select')?.focus({preventScroll:true});
    }

    function renderDossierSurroundings(p) {
      const climate=getDossierClimate(p), green=getDossierGreen(p);
      const {safety,neighbors,rate,rank,leading}=getDossierSecurity(p);
      return `<section class="ds-section" id="ds-market"><p class="ds-eyebrow">Preço no contexto</p><h2>${p.modality==='Alugar' ? 'Mercado na região' : 'Valor na região'}</h2><div id="ds-market-chart">${renderDossierMarketChart(p)}</div><button class="ds-link" onclick="openDossierBenchmark()">Explorar amostra e recorte ${dossierIcon('arrow',13)}</button></section>
        <section class="ds-section" id="ds-central-map"><p class="ds-eyebrow">Seu endereço no cotidiano</p><h2>Explore o entorno</h2><div id="ds-map-mount">${renderDossierMap(p)}</div></section>
        <section class="ds-section" id="ds-environment"><p class="ds-eyebrow">Verde e conforto</p><h2>Ambiente urbano</h2>
          <div class="ds-env-visual"><div><strong>${climate.value}</strong><span class="ds-label">${climate.delta===null?'Superfície':climate.delta<0?'Superfície mais fresca':climate.delta>0?'Superfície mais quente':'Mesma temperatura'}</span><small>${climate.hasReference?'vs. '+climate.reference:climate.delta===null?'Sem medição':'Recorte local'}</small></div><button class="ds-green-score" onclick="openDossierGreen()" aria-label="Índice verde ${green.score===null?'em levantamento':green.score+' de 100'}. Entender a nota"><strong>${green.score ?? '—'}<small>/100</small></strong><span class="ds-label">Índice verde ${dossierIcon('arrow',12)}</span><small>${green.label}</small><i aria-hidden="true"><b style="width:${green.score ?? 0}%"></b></i></button></div>
          <div class="ds-sun-summary"><span><strong>${climate.sun}</strong><small>${dossierText(climate.face)}</small></span><button class="ds-link" onclick="openDossierSun()">Sol e sombra ${dossierIcon('arrow',13)}</button></div>
          <button class="ds-link" onclick="openDossierEvidence('ambiente')">Explorar indicadores ${dossierIcon('arrow',13)}</button>
        </section>
        <section class="ds-section" id="ds-security"><p class="ds-eyebrow">Registros do bairro</p><h2>Segurança e contexto local</h2>
          <p class="ds-map-note ds-security-period">${dossierText(p.neighborhood)} · últimos 12 meses</p>
          <div class="ds-security-stats"><div><strong>${rate?.toLocaleString('pt-BR') ?? '—'}</strong><span>ocorrências<br>por mil moradores</span></div><div><strong>${rank===null?'—':rank+'ª'}</strong><span>${rank===null?'Comparação indisponível':'menor taxa'}</span>${rank===null?'':`<small>entre ${neighbors.length} bairros comparados</small>`}</div></div>
          <p class="ds-security-total"><strong>${safety?.total12m?.toLocaleString('pt-BR') ?? '—'}</strong> ocorrências registradas no período</p>
          ${leading?`<div class="ds-security-nature"><strong>${leading.pct}%</strong><span>${dossierText(leading.label)}</span></div>`:''}
          <p class="ds-map-note">${dossierText(safety?.source || '')}</p><button class="ds-link" onclick="openDossierEvidence('bairro')">Comparar bairros e registros ${dossierIcon('arrow',13)}</button>
        </section>`;
    }

    function renderDossierInterests(p) {
      const interests=DOSSIER.interests[p.id] || ['Saúde','Escolas','Mercados','Transporte'];
      return `<div class="ds-poi-grid">${interests.map(name=>`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' perto de '+p.address+' '+p.city)}" target="_blank" rel="noopener"><span>${dossierText(name)}</span>${dossierIcon('arrow',13)}</a>`).join('')}</div><button class="ds-link" id="ds-add-interest" onclick="openDossierInterest()">${dossierIcon('plus',15)} Adicionar interesse</button>`;
    }

    function openDossierInterest() {
      const interests=DOSSIER.interests[STATE.activePropId] || ['Saúde','Escolas','Mercados','Transporte'];
      showDossierSheet('O que você quer ter por perto?',`<div class="ds-interest-options">${['Cinema','Parques','Shopping','Academias','Restaurantes','Pet shops'].filter(name=>!interests.includes(name)).map(name=>`<button class="ds-secondary" onclick="addDossierInterest('${name}')">${name} ${dossierIcon('plus',13)}</button>`).join('')}</div><form onsubmit="event.preventDefault(); addDossierInterest(new FormData(this).get('interest'))"><div class="ds-form-row"><label for="ds-interest-name">Outro interesse</label><input id="ds-interest-name" name="interest" placeholder="Livrarias, cafés..." maxlength="40" required/></div><p id="ds-interest-error" class="ds-copy" role="alert"></p><button type="submit" class="ds-primary">Adicionar ao meu entorno</button></form>`);
    }

    function addDossierInterest(value) {
      const name=String(value || '').trim().replace(/\s+/g,' ').slice(0,40), p=getProp(STATE.activePropId);
      if (!name) return;
      const interests=DOSSIER.interests[p.id] || ['Saúde','Escolas','Mercados','Transporte'];
      if (interests.some(item=>item.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR'))) {
        document.getElementById('ds-interest-error').textContent='Esse interesse já está na sua lista.'; return;
      }
      if (interests.length>=12) { document.getElementById('ds-interest-error').textContent='Sua lista já tem 12 interesses.'; return; }
      DOSSIER.interests[p.id]=[...interests,name];
      document.getElementById('ds-poi-mount').innerHTML=renderDossierInterests(p);
      closeDrawer(); document.getElementById('ds-add-interest').focus({preventScroll:true}); showToast('Interesse adicionado');
    }

    function getDossierChecks(p, priority=DOSSIER.priority) {
      const titles={'q-bv-1':'Quantos banheiros há?','q-bv-2':'R$ 288 de IPTU por mês?','q-bv-3':'Qual é a altura em relação à rua?','q-cf-1':'Quanto é o IPTU atual?','q-cf-2':'O preço inclui móveis e reformas?','q-gr-1':'Qual é o sistema estrutural?','q-gr-2':'Quanto é o IPTU atual?','q-es-1':'O IPTU vem no condomínio?','q-es-2':'As obras afetam luz ou silêncio?','q-md-1':'Quanto é o IPTU atual?','q-md-2':'As janelas bloqueiam o ruído?'};
      const checks=(p.visitQuestions || []).map((q,index)=>{
        const type=/iptu|preço|valor anunciado/i.test(q.text)?'custo':/estrutura|tipologia/i.test(q.text)?'documentos':'conforto';
        const hint=/tipologia/i.test(q.text)?'3 sinais no cadastro':/suítes.*banheiro/i.test(q.text)?`${p.suites} suítes · ${p.bathrooms} banheiro${p.bathrooms===1?'':'s'}`:/iptu/i.test(q.text)?(/sem período/i.test(q.text)?'Anúncio sem periodicidade':'Peça a guia atualizada'):/obra/i.test(q.text)?`${dossierNumber(p.worksSection?.items?.[0]?.value) ?? '—'} registros em 150 m`:/altura|andar/i.test(q.text)?`${p.floor} anunciado`:'Anúncio × registros';
        return {key:q.id,title:titles[q.id] || visitQuestionShort(q),hint,type,index,action:'question'};
      });
      checks.push({key:'documentos',title:'Há cota extra ou obra aprovada?',hint:'Peça atas e balancetes',type:'documentos',action:'documentos'});
      const works=dossierNumber(p.worksSection?.items?.[0]?.value);
      if (works>=3 && !checks.some(item=>/obras|ruído/i.test(item.title))) checks.push({key:'obras',title:'As obras próximas afetam a rotina?',hint:`${works} registros em 150 m`,type:'conforto',action:'obras'});
      if (p.microclimateAndCensus?.sunFace) checks.push({key:'sol',title:'O sol chega às janelas?',hint:getDossierClimate(p).sun+' · '+getDossierClimate(p).face,type:'conforto',action:'sol'});
      return checks.map((item,index)=>({...item,order:index})).sort((a,b)=>(a.type===priority?0:1)-(b.type===priority?0:1)||a.order-b.order);
    }

    function renderDossierChecks(p) {
      const checks=getDossierChecks(p);
      return `<div class="ds-section-heading"><h2>Antes de<br>decidir.</h2><span class="ds-check-count"><strong>${checks.length}</strong><small>a conferir</small></span></div><p class="ds-label">O que pesa mais para você?</p><div class="ds-priorities" role="group" aria-label="Sua prioridade">${[['custo','Custo'],['conforto','Conforto'],['documentos','Documentos']].map(([key,label])=>`<button aria-pressed="${DOSSIER.priority===key}" onclick="setDossierPriority('${key}')">${label}</button>`).join('')}</div><div class="ds-check-list">${checks.slice(0,3).map(item=>`<button onclick="openDossierCheck('${item.key}')"><span><strong>${dossierText(item.title)}</strong><small>${dossierText(item.hint)}</small></span>${dossierIcon('arrow',15)}</button>`).join('')}</div><button class="ds-link" onclick="openDossierAllChecks()">Ver todas as verificações ${dossierIcon('arrow',13)}</button>`;
    }

    function setDossierPriority(priority) {
      if (!['custo','conforto','documentos'].includes(priority)) return;
      DOSSIER.priority=priority;
      document.getElementById('ds-building-checks').innerHTML=renderDossierChecks(getProp(STATE.activePropId));
      document.querySelector('.ds-priorities [aria-pressed="true"]').focus({preventScroll:true});
    }

    function openDossierAllChecks() {
      const p=getProp(STATE.activePropId), checks=getDossierChecks(p);
      showDossierSheet('Seu roteiro de verificação',`<div class="ds-check-list">${checks.map(item=>`<button onclick="openDossierCheck('${item.key}')"><span><strong>${dossierText(item.title)}</strong><small>${dossierText(item.hint)}</small></span>${dossierIcon('arrow',15)}</button>`).join('')}</div><button class="ds-primary" style="margin-top:16px" onclick="closeDrawer(); STATE.visitModeTab='prepare'; switchView('live-visit','${p.id}')">Preparar visita ${dossierIcon('arrow',15)}</button>`);
    }

    function openDossierCheck(key) {
      const p=getProp(STATE.activePropId), check=getDossierChecks(p).find(item=>item.key===key);
      if (!check) return;
      if (check.action==='question') return openDossierQuestion(check.index);
      if (check.action==='sol') return openDossierSun();
      if (check.action==='obras') return openDossierEvidence('obras');
      showDossierSheet('Peça ao condomínio',`${dossierRows([{label:'Últimas atas',value:'Cotas extras e obras aprovadas'},{label:'Balancetes',value:'Receitas, despesas e fundo de reserva'},{label:'Manutenção',value:'Laudos e serviços previstos'}])}<p class="ds-note">Documentos ainda não anexados.</p><button class="ds-primary" onclick="closeDrawer(); STATE.visitModeTab='prepare'; switchView('live-visit','${p.id}')">Levar para a visita</button>`);
    }

    function renderDossierBuilding(p) {
      if (!p.lotConfirmed) return `<p class="ds-eyebrow">Identificação do edifício</p><h2>Primeiro, confirme o prédio.</h2><p class="ds-copy" style="margin:16px 0">Confirme o lote para abrir o cadastro e as verificações do edifício.</p><button class="ds-primary" onclick="triggerUrlDecode('${p.id}')">Confirmar prédio ${dossierIcon('arrow',15)}</button>`;
      const items = p.buildingSection?.items || [];
      const find = word => items.find(item => item.label.toLowerCase().includes(word))?.value;
      const med=dossierNumber(p.itbiBuildingSection?.items?.find(item=>/mediana/i.test(item.label))?.value);
      const reference=Number.isFinite(med)&&Number.isFinite(p.areaM2)&&p.areaM2>0?med*p.areaM2:null;
      const annualTax=find('iptu 2026'), taxes=/ano|anual/i.test(annualTax || '')?(annualTax.match(/\d[\d.,]*/g) || []).map(parseDossierMoney).filter(Number.isFinite):[];
      const monthlyTax=taxes.map(value=>Math.round(value/12));
      const taxValue=monthlyTax.length?monthlyTax.map(formatBRL).join('–'):'A confirmar';
      const transfers=dossierNumber(p.itbiBuildingSection?.items?.[0]?.value);
      const cadastral=[['ano de construção','Ano de construção'],['pavimentos','Pavimentos'],['unidades','Unidades residenciais'],['área privativa','Área no cadastro']];
      const isRent=p.modality==='Alugar';
      return `<section class="ds-section" id="ds-building-checks">${renderDossierChecks(p)}</section>
        <section class="ds-section"><p class="ds-eyebrow">Identidade cadastral</p><h2>Estrutura e cadastro</h2><div class="ds-cadastre">${cadastral.map(([word,label])=>`<div><strong>${dossierText(find(word) || '—')}</strong><span>${label}</span></div>`).join('')}</div><p class="ds-map-note">${dossierText(p.buildingSection?.source || '')}</p>${p.typologyCheck?.triggeredCount === 3 ? '<p class="ds-note">3 sinais cadastrais: confirme a estrutura antes de reformar.</p>' : ''}<button class="ds-link" onclick="openDossierEvidence('cadastro')">Abrir cadastro completo ${dossierIcon('arrow',13)}</button></section>
        <section class="ds-section"><p class="ds-eyebrow">O valor em perspectiva</p><h2>Valor e histórico</h2><div class="ds-value-summary"><span class="ds-label">${isRent?'IPTU mensal no prédio':'Referência fiscal para '+p.areaM2+' m²'}</span><strong>${isRent?taxValue:reference===null?'A confirmar':formatBRL(reference)}${isRent&&monthlyTax.length?'<small>/mês</small>':''}</strong><p class="ds-map-note">${isRent?'Faixa das unidades · cadastro 2026':'Base do prédio · avaliação fiscal'}</p></div><ol class="ds-history">${(p.timelineEvents || []).slice(0,3).map(event=>`<li><time>${dossierText(event.year)}</time><p>${dossierText(event.title.replace(/ no ITBI/g,'').replace(/IPTU/g,'cadastro'))}</p></li>`).join('')}</ol><button class="ds-link" onclick="openDossierEvidence('historico')">Explorar valores e histórico ${dossierIcon('arrow',13)}</button>${transfers===null?'':`<p class="ds-map-note">${transfers} avaliações registradas · Prefeitura do Recife</p>`}</section>

      showDossierSheet('Como calculamos o verde',`<div class="ds-relative ds-green-relative"><strong>${green.score ?? '—'}<small>/100</small></strong><span>Índice verde<small>${green.label}</small></span></div>${green.parts.map(part=>`<div class="ds-score-part"><div><strong>${part.label}</strong><span>${part.value ?? '—'} ${part.unit}</span></div><b>${part.points===null?'—':part.points.toLocaleString('pt-BR',{maximumFractionDigits:1})}<small> / ${part.weight}</small></b></div>`).join('')}<p class="ds-copy">Vegetação 50% + árvores 30% + parques 20%.</p>${dossierRows([{label:'Referência para nota máxima',value:'50% de vegetação · 100 árvores · 4 parques/praças'},{label:'Recortes',value:'Vegetação e parques: 1 km · árvores: 150 m'}])}<p class="ds-map-note">Fórmula e dados do protótipo. Fontes previstas: satélite, Censo Arbóreo e parques registrados.</p>`);

    function dossierSunTime(hour) {
      const minutes=Math.round(hour*60);
      return Math.floor(minutes/60)+'h'+(minutes%60?String(minutes%60).padStart(2,'0'):'');
    }

    function getDossierSun(p, hour=DOSSIER.sunHour) {
      const coordinates=dossierCoordinates(p);
      const floors=dossierNumber(p.buildingSection?.items?.find(item=>/pavimentos/i.test(item.label))?.value);
      if (!coordinates || !floors || !Number.isFinite(hour)) return null;
      // NOAA: posição solar aproximada em 17/10/2026 (dia 290), horário de Recife, UTC−3.
      const gamma=2*Math.PI/365*(290-1+(hour-12)/24);
      const decl=.006918-.399912*Math.cos(gamma)+.070257*Math.sin(gamma)-.006758*Math.cos(2*gamma)+.000907*Math.sin(2*gamma)-.002697*Math.cos(3*gamma)+.00148*Math.sin(3*gamma);
      const equation=229.18*(.000075+.001868*Math.cos(gamma)-.032077*Math.sin(gamma)-.014615*Math.cos(2*gamma)-.040849*Math.sin(2*gamma));
      const angle=(hour*60+equation+4*coordinates.lng+180)/4*Math.PI/180-Math.PI;
      const lat=coordinates.lat*Math.PI/180;
      const east=-Math.cos(decl)*Math.sin(angle);
      const north=Math.cos(lat)*Math.sin(decl)-Math.sin(lat)*Math.cos(decl)*Math.cos(angle);
      const up=Math.sin(lat)*Math.sin(decl)+Math.cos(lat)*Math.cos(decl)*Math.cos(angle);
      const altitude=Math.asin(Math.max(-1,Math.min(1,up)));
      const shadowMeters=up>0?floors*3.28/Math.tan(altitude):null;
      const rawX=up>0?-east/up*floors*3.28*1.5:0, rawY=up>0?north/up*floors*3.28*.55:0;
      const scale=Math.min(1,115/Math.max(1,Math.hypot(rawX,rawY)));
      return {floors,east,north,up,altitude,shadowMeters,x:165+east*133,y:112-Math.max(0,up)*96,dx:rawX*scale,dy:rawY*scale};
    }

    function renderDossierShadow(p) {
      const sun=getDossierSun(p);
      if (!sun) return '<p class="ds-note">Pavimentos ou localização não disponíveis para estimar o volume.</p>';
      const path=Array.from({length:41},(_,i)=>getDossierSun(p,7+i/4)).map((point,i)=>(i?'L':'M')+point.x.toFixed(2)+' '+point.y.toFixed(2)).join(' ');
      const number=value=>value.toFixed(2);
      return `<svg viewBox="0 0 330 170" role="img" aria-label="Sol e sombra às ${dossierSunTime(DOSSIER.sunHour)} em Recife. ${sun.shadowMeters===null?'Sol abaixo do horizonte.':'Sombra teórica de '+Math.round(sun.shadowMeters)+' metros.'}"><path d="M25 115h280M165 15v120" stroke="#E5DDCF" stroke-dasharray="3 4"/><path d="${path}" fill="none" stroke="#D8CCB7" stroke-dasharray="2 5"/>${sun.shadowMeters===null?'':`<polygon class="ds-solar-shadow" points="142,102 164,115 187,102 ${number(187+sun.dx)},${number(102+sun.dy)} ${number(164+sun.dx)},${number(115+sun.dy)} ${number(142+sun.dx)},${number(102+sun.dy)}" fill="#7F887044"/>`}<path d="m142 102 0-59 22-12 23 12v59l-23 13Z" fill="#F9F5ED" stroke="#BAAB94"/><path d="m164 31 0 84 23-13V43Z" fill="#DED3C1" stroke="#BAAB94"/><path d="m142 43 22 12 23-12m-23 12v60" fill="none" stroke="#BAAB94"/><circle class="ds-solar-sun" cx="${number(sun.x)}" cy="${number(sun.y)}" r="10" fill="#F47745" opacity="${sun.up>0?1:.35}"/><g font-family="Plus Jakarta Sans,sans-serif" font-size="9" fill="#746C5E"><text x="18" y="132">Oeste · tarde</text><text x="312" y="132" text-anchor="end">Leste · manhã</text><text x="18" y="158">${sun.floors} pavimentos × 3,28 m</text><text x="312" y="158" text-anchor="end">${sun.shadowMeters===null?'Sol abaixo do horizonte':'Sombra: '+Math.round(sun.shadowMeters)+' m'}</text></g></svg>`;
    }

    function updateDossierShadow(value) {
      const hour=Number(value);
      if (!Number.isFinite(hour)) return;
      DOSSIER.sunHour=Math.max(7,Math.min(17,hour));
      document.getElementById('ds-shadow-mount').innerHTML=renderDossierShadow(getProp(STATE.activePropId));
      document.getElementById('ds-sun-label').textContent=dossierSunTime(DOSSIER.sunHour)+' · 17 out 2026';
      document.getElementById('ds-sun-hour').setAttribute('aria-valuetext',dossierSunTime(DOSSIER.sunHour));
    }

    function showDossierSheet(title, content, keepTrigger = false) {
      const panel = document.getElementById('drawerPanel');
      if (!keepTrigger || !window.__dossierTrigger) window.__dossierTrigger = document.activeElement;
      panel.classList.add('ds-sheet');
      panel.setAttribute('role','dialog'); panel.setAttribute('aria-modal','true'); panel.setAttribute('aria-labelledby','ds-sheet-title');
      panel.innerHTML = `<div class="sheet-handle"></div><div class="ds-sheet-head"><h2 id="ds-sheet-title">${title}</h2><button aria-label="Fechar detalhes" onclick="closeDrawer()">${dossierIcon('close')}</button></div>${content}`;
      document.getElementById('drawerBackdrop').classList.add('open');
      panel.querySelector('button').focus({preventScroll:true});
    }

    function dossierRows(items) {
      return `<div class="fact-kv-list">${(items || []).map(item=>`<div class="fact-kv-row"><span class="fact-kv-label">${dossierText(item.label)}</span><span class="fact-kv-val">${dossierText(item.value)}</span></div>`).join('')}</div>`;
    }

    function openDossierCosts() {
      const p = getProp(STATE.activePropId), finance = getDossierFinance(p);
      showDossierSheet('A composição do mês', `<p class="ds-copy">A soma considera valores com periodicidade conhecida. O IPTU anual é dividido por 12; estimativas ficam identificadas.</p>${dossierRows(finance.entries.map(item=>({label:item.label+(item.estimated?' · estimativa':''),value:item.monthly === null ? 'Não entra na soma' : formatBRL(item.monthly)+'/mês'})))}<form onsubmit="saveDossierCosts(event)">${finance.entries.filter(item=>item.key!=='aluguel').map(item=>`<div class="ds-form-row"><label for="ds-cost-${item.key}">${item.label} (R$)</label><div class="ds-form-controls"><input id="ds-cost-${item.key}" name="${item.key}" inputmode="decimal" placeholder="Não informado" value="${item.amount ?? ''}" aria-describedby="ds-cost-help-${item.key}"/><select name="${item.key}Period" aria-label="Periodicidade de ${item.label}">${[['unknown','Período a confirmar'],['month','Por mês'],['year','Por ano']].map(([value,label])=>`<option value="${value}" ${item.period===value?'selected':''}>${label}</option>`).join('')}</select></div><small id="ds-cost-help-${item.key}">${item.key==='iptu' ? dossierText(p.iptuDeclared) : item.key==='seguro' ? 'Informe uma cotação ou uma estimativa. Campo vazio permanece pendente.' : dossierText(p.condoDeclared)}</small><label class="ds-checkbox"><input type="checkbox" name="${item.key}Estimated" ${item.estimated?'checked':''}/>Este valor é uma estimativa</label></div>`).join('')}<p class="ds-copy" id="ds-cost-error" role="alert"></p><button class="ds-primary" type="submit">Atualizar composição ${dossierIcon('check',15)}</button></form>`);
    }

    function saveDossierCosts(event) {
      event.preventDefault();
      const data = new FormData(event.target), overrides = {};
      for (const key of ['condominio','iptu','seguro']) {
        const raw = String(data.get(key) || '').trim();
        const amount = parseDossierMoney(raw);
        if (raw && (!Number.isFinite(amount) || amount < 0 || amount > 10000000)) {
          document.getElementById('ds-cost-error').textContent = 'Use um valor entre zero e R$ 10 milhões, ou deixe o campo vazio.';
          document.getElementById('ds-cost-'+key).focus(); return;
        }
        overrides[key] = { amount, period:data.get(key+'Period'), estimated:data.has(key+'Estimated'), source:'Informado por você' };
      }
      DOSSIER.expenses[STATE.activePropId] = overrides;
      document.getElementById('dossier-financial').innerHTML = renderDossierFinance(getProp(STATE.activePropId));
      closeDrawer(); showToast('Composição mensal atualizada');
    }

    function openDossierBenchmark(keepTrigger = false) {
      const p=getProp(STATE.activePropId), m=getDossierMarket(p), mode=DOSSIER.benchmarkMode;
      const title=mode==='bairros'?'Compare os bairros':mode==='imoveis'?'Compare os imóveis':m.isRent?'O aluguel no entorno':'Pedido e avaliação fiscal';
      const modeSwitch=`<div class="ds-compare-modes" role="group" aria-label="Tipo de comparação">${[['recorte','No entorno'],['bairros','Bairros'],['imoveis','Imóveis']].map(([key,label])=>`<button id="ds-compare-${key}" aria-pressed="${mode===key}" onclick="setDossierComparison('${key}')">${label}</button>`).join('')}</div>`;
      const radius=mode==='recorte'?`<div class="ds-filter" role="group" aria-label="Recorte de comparação">${[['Bairro','Bairro'],['500m','500 m'],['1km','1 km']].map(([value,label])=>`<button class="ds-secondary" id="ds-radius-${value}" aria-pressed="${DOSSIER.radius===value}" onclick="setDossierBenchmark('${value}',null,this.id)">${label}</button>`).join('')}</div>`:'';
      const period=mode!=='imoveis'?`<div class="ds-filter" role="group" aria-label="Período de comparação">${[['12m','12 meses'],['24m','24 meses']].map(([value,label])=>`<button class="ds-secondary" id="ds-period-${value}" aria-pressed="${DOSSIER.period===value}" onclick="setDossierBenchmark(null,'${value}',this.id)">${label}</button>`).join('')}</div>`:'';
      const content=mode==='bairros'?renderDossierNeighborhoodComparison(p):mode==='imoveis'?renderDossierPropertyComparison(p):`${renderDossierMarketChart(p,true)}${m.valid?`<div class="ds-sample-summary"><div><span>Faixa central · 50% dos registros</span><strong>${formatBRL(m.stats.p25)}–${formatBRL(m.stats.p75)}<small>/m²</small></strong></div><div><span>Amostra</span><strong>${m.stats.count}<small> ${m.isRent?'anúncios':'registros'}</small></strong></div></div>`:''}`;
      showDossierSheet(title,`${modeSwitch}${radius}${period}${content}<p class="ds-map-note">${mode==='imoveis'?'Valores anunciados · mesma modalidade':m.isRent?'Anúncios de aluguel · amostra de demonstração':'Avaliações fiscais · amostra de demonstração'}</p><button class="ds-link" onclick="openSourceSheet('${m.isRent?'ALUGUEIS':'SEFAZ_ITBI'}')">Consultar a fonte ${dossierIcon('arrow',13)}</button>`,keepTrigger);
    }

    function setDossierBenchmark(radius, period, focusId) {
      if (radius && ['Bairro','500m','1km'].includes(radius)) DOSSIER.radius = radius;
      if (period && ['12m','24m'].includes(period)) DOSSIER.period = period;
      const p = getProp(STATE.activePropId);
      document.getElementById('dossier-financial').innerHTML = renderDossierFinance(p);
      const chart = document.getElementById('ds-market-chart');
      if (chart) chart.innerHTML = renderDossierMarketChart(p);
      openDossierBenchmark(true);
      document.getElementById(focusId)?.focus({preventScroll:true});
    }

    function openDossierEvidence(type) {
      const p = getProp(STATE.activePropId);
      const sections = { cadastro:p.buildingSection, historico:p.itbiBuildingSection, obras:p.worksSection };
      if (sections[type]) {
        if (!p.lotConfirmed && type !== 'obras') return triggerUrlDecode(p.id);
        const section = sections[type];
        return showDossierSheet({cadastro:'O cadastro do edifício',historico:'Valores e histórico do prédio',obras:'Obras no entorno'}[type], `<p class="ds-copy">${dossierText(section.summary)}</p>${dossierRows(section.items)}${type==='historico'?`${dossierRows((p.buildingSection?.items || []).filter(item=>/iptu.*cobrado/i.test(item.label)))}<ol class="ds-history">${(p.timelineEvents || []).map(event=>`<li><time>${dossierText(event.year)}</time><p>${dossierText(event.title)}</p><small>${dossierText(event.detail)}</small></li>`).join('')}</ol><p class="ds-note">Avaliação fiscal não é preço de venda.</p>`:''}<p class="ds-map-note">${dossierText(section.source)}</p><div class="ds-actions"><button class="ds-link" onclick="openSourceSheet('${section.sourceKey}')">Ver fonte</button><button class="ds-link ds-link-muted" onclick="openContestSheet('${p.id}','sec_${type}','${type==='historico'?'Histórico fiscal':type==='obras'?'Obras próximas':'Cadastro do edifício'}')">Isso está errado</button></div>`);
      }
      if (type === 'anuncio') return showDossierSheet('A divergência no anúncio',`<div class="ds-contrast"><div><strong>${p.suites}</strong><span>suítes declaradas</span></div><div><strong>${p.bathrooms}</strong><span>banheiros declarados</span></div></div><p class="ds-copy">As duas informações vêm do mesmo anúncio. Confirme o total de banheiros com o corretor; o cadastro não resolve essa divergência.</p><button class="ds-primary" onclick="closeDrawer(); STATE.visitModeTab='prepare'; switchView('live-visit','${p.id}')">Abrir perguntas da visita</button>`);
      if (type === 'estrutura') return showDossierSheet('Os três sinais cadastrais',`${dossierRows(p.typologyCheck.signals.map(signal=>({label:signal.label,value:signal.detail})))}<p class="ds-copy">${dossierText(p.typologyCheck.visitQuestion || 'Os três sinais não coexistem neste cadastro.')}</p><p class="ds-note">Indício cadastral não é laudo estrutural.</p><button class="ds-link" onclick="openSourceSheet('IPTU_PREF')">Ver fonte do cadastro</button>`);
      if (type === 'ambiente') {
        const climate=getDossierClimate(p), green=getDossierGreen(p);
        const density=green.trees===null?'—':(green.trees/(Math.PI*.15*.15*100)).toLocaleString('pt-BR',{maximumFractionDigits:1});
        return showDossierSheet('Ambiente em números',`${dossierRows([{label:'Superfície',value:climate.value+' vs. '+climate.reference},{label:'Vegetação',value:green.vegetation===undefined?'A levantar':green.vegetation+'% da área em 1 km'},{label:'Árvores',value:green.trees===null?'A levantar':green.trees+' em 150 m'},{label:'Densidade de árvores',value:density+' por hectare'},{label:'Parques e praças',value:green.parks===undefined?'A levantar':green.parks+' em 1 km'},{label:'Sol',value:climate.sun+' · '+climate.face}])}<div class="ds-actions"><button class="ds-link" onclick="openDossierGreen()">Entender o índice verde ${dossierIcon('arrow',13)}</button><button class="ds-link" onclick="openDossierSun()">Sol e sombra ${dossierIcon('arrow',13)}</button></div><p class="ds-map-note">Landsat 8/9 · Censo Arbóreo · cenário de demonstração</p><p class="ds-note">Sem mapa térmico nem medição do ar. Sol e ruído: confirmar na visita.</p>`);
      }
      if (type === 'sombra') return showDossierSheet('Como calculamos a sombra',`${dossierRows([{label:'Data e horário',value:'17 out 2026 · horário de Recife (UTC−3)'},{label:'Altura estimada',value:'Pavimentos × 3,28 m'},{label:'Comprimento da sombra',value:'Altura ÷ tangente da elevação solar'}])}<p class="ds-note">Volume esquemático, sem vizinhos ou janelas. Não estima sol dentro do apartamento.</p><a class="ds-link" href="https://gml.noaa.gov/grad/solcalc/solareqns.PDF" target="_blank" rel="noopener">Cálculo da posição solar · NOAA ${dossierIcon('arrow',13)}</a><button class="ds-link" onclick="openSourceSheet('IPTU_PREF')">Ver referência de pavimentos</button>`);
      if (type === 'bairro') {
        const defense=p.civilDefenseSection;
        const {safety,neighbors,rate,rank,natures}=getDossierSecurity(p);
        const max=Math.max(...neighbors.map(item=>item.rate),1);
        const colors=['#809075','#7893A3','#C2AE86'];
        return showDossierSheet('Segurança e registros',`<p class="ds-label">${dossierText(p.neighborhood)} · últimos 12 meses</p><div class="ds-stat-pair"><div><strong>${rate?.toLocaleString('pt-BR') ?? '—'}</strong><span>ocorrências / mil moradores</span></div><div><strong>${rank===null?'—':rank+'ª menor'}</strong><span>taxa entre ${neighbors.length} bairros comparados</span></div></div><p class="ds-map-note">${safety?.total12m?.toLocaleString('pt-BR') ?? '—'} ocorrências registradas</p><h3 class="ds-detail-title">O que foi registrado</h3><div class="ds-expense-bar" role="img" aria-label="${dossierText(natures.map(item=>item.label+': '+item.pct+'%').join(', '))}">${natures.map((item,index)=>`<span style="width:${item.pct}%;background:${colors[index%3]}"></span>`).join('')}</div>${natures.map((item,index)=>`<div class="ds-nature"><span><i class="ds-dot" style="background:${colors[index%3]}"></i>${dossierText(item.label)}</span><strong>${item.pct}%</strong></div>`).join('')}<h3 class="ds-detail-title">Compare os bairros</h3><p class="ds-map-note">Ocorrências / mil moradores · norte → sul</p>${neighbors.map(item=>`<div class="neighbor-bar-row ${item.current?'is-current':''}"><span>${dossierText(item.name)}</span><div class="neighbor-bar-track"><div class="neighbor-bar-fill" style="width:${item.rate/max*100}%"></div></div><strong>${item.rate.toLocaleString('pt-BR')}</strong></div>`).join('')}<button class="ds-link" onclick="openSourceSheet('SDS_CRIME')">Fonte dos registros</button><h3 class="ds-detail-title">Defesa Civil</h3><p class="ds-map-note">${defense?.total ?? '—'} atendimentos · 2024</p><div class="ds-defense-chart">${renderDonutSvg(defense?.breakdown || [],defense?.total || 0)}<div>${(defense?.breakdown || []).map(item=>`<p class="ds-map-note"><strong>${item.value}</strong> · ${dossierText(item.label)}</p>`).join('')}</div></div><button class="ds-link" onclick="openSourceSheet('DEFESA_CIVIL')">Fonte da Defesa Civil</button>`);
      }
    }

    function openDossierDestination() {
      showDossierSheet('Adicionar um destino',`<p class="ds-copy">Guarde o endereço para consultar sua rotina no aplicativo de mapas.</p><form onsubmit="saveDossierDestination(event)"><div class="ds-form-row"><label for="ds-destination-name">Nome do destino</label><input id="ds-destination-name" name="name" placeholder="Trabalho, faculdade..." required maxlength="60"/></div><div class="ds-form-row"><label for="ds-destination-address">Endereço completo</label><input id="ds-destination-address" name="address" placeholder="Rua, número e cidade" required minlength="5" maxlength="180"/><small>O trajeto e o tempo são calculados no aplicativo de mapas.</small></div><button class="ds-primary" type="submit">Adicionar destino ${dossierIcon('plus',15)}</button></form>`);

    function saveDossierDestination(event) {
      event.preventDefault();
      const data = new FormData(event.target), label = String(data.get('name')).trim(), address = String(data.get('address')).trim();
      if (!label || address.length<5) return;
      const id = 'dest-'+Date.now();
      STATE.dailyRoutes.push({id,label,address,coords:null}); DOSSIER.routeId=id;

      journeySheet('Os custos de '+p.neighborhood,`<p class="vx-copy">${dossierText(journeyName(p))}</p><div class="vc-insight"><strong>${formatBRL(f.total)}<small>/mês</small></strong><p>Soma dos custos conhecidos</p></div>${dossierRows(f.entries.map(item=>({label:item.label,value:item.monthly===null?'A confirmar':formatBRL(item.monthly)+'/mês'+(item.estimated?' · estimado':'')})))}<button class="vx-link" onclick="closeDrawer(); switchView('dossier','${p.id}')">Ajustar valores no dossiê ${dossierIcon('arrow',14)}</button>`);

    function renderCompare() {
      const container=document.getElementById('compareContainer'); if (!container) return;
      const list=getCompareProperties(), rent=list[0]?.modality==='Alugar', topic=JOURNEY.comparisonTab, count=list.length;
      const finances=list.map(p=>getDossierFinance(p));
      const amounts=list.map((p,i)=>rent?finances[i].total:p.announcedValue), min=Math.min(...amounts), max=Math.max(...amounts), difference=max-min;
      const lower=list[amounts.indexOf(min)];
      const rows=(label,values,key=false)=>`<div class="vc-row ${key?'is-key':''}"><p>${label}</p><div class="vc-columns">${values.map(value=>`<div>${value}</div>`).join('')}</div></div>`;
      const bars=(values,format)=>`<div class="vc-bars">${list.map((p,i)=>`<div><div class="vc-bar-label"><span>${dossierText(p.neighborhood)}</span><strong>${format(values[i])}</strong></div><div class="vc-bar"><i style="width:${Math.max(0,values[i])/Math.max(...values,1)*100}%"></i></div></div>`).join('')}</div>`;
      let content='';
      if (topic==='custo') content=`<div class="vc-insight"><span class="vx-kicker">${rent?'O que pesa no mês':'O valor da escolha'}</span><strong>${formatBRL(difference)}</strong><p>${difference===0?'Mesmo '+(rent?'custo conhecido.':'preço anunciado.'):'de diferença no '+(rent?'custo mensal conhecido.':'preço anunciado.')}</p>${difference?`<small>${dossierText(lower.neighborhood)} tem o menor ${rent?'custo conhecido':'preço pedido'}.</small>`:''}</div>${bars(amounts,formatBRL)}${rows(rent?'Aluguel anunciado':'Preço anunciado',list.map(p=>`<strong>${formatBRL(p.announcedValue)}</strong>`))}${rows(rent?'Custo mensal conhecido':'Despesas mensais conhecidas',finances.map(f=>`<strong>${formatBRL(f.total)}</strong><small>${f.pending.length?f.pending.length+' valores a confirmar':'Valores informados'}${f.entries.some(item=>item.estimated)?' · inclui estimativa':''}</small>`),true)}${rows('Valor anunciado por m²',list.map(p=>`<strong>${p.areaM2>0?formatBRL(p.announcedValue/p.areaM2):'—'}</strong>`))}<div class="vc-actions">${list.map(p=>`<button class="vx-link" onclick="openCompareCosts('${p.id}')">Ver composição ${dossierIcon('arrow',12)}</button>`).join('')}</div>`;
      if (topic==='espaco') {
        const areas=list.map(p=>p.areaM2), spread=Math.max(...areas)-Math.min(...areas), larger=list[areas.indexOf(Math.max(...areas))];
        content=`<div class="vc-insight"><span class="vx-kicker">Espaço para a sua rotina</span><strong>${spread.toLocaleString('pt-BR')} <small>m²</small></strong><p>${spread?'a mais na maior opção.':'de diferença entre as opções.'}</p><small>${dossierText(larger.neighborhood)} · ${larger.areaM2} m²</small></div>${bars(areas,value=>value+' m²')}${rows('Quartos',list.map(p=>`<strong>${p.bedrooms}</strong>`))}${rows('Banheiros anunciados',list.map(p=>`<strong>${p.bathrooms}</strong>${p.suites>p.bathrooms?'<small>Quantidade a conferir</small>':''}`))}${rows('Vagas de garagem',list.map(p=>`<strong>${p.parking}</strong>`))}${rows('Andar anunciado',list.map(p=>`<strong class="vc-text-value">${dossierText(p.floor || 'A confirmar')}</strong>`))}${rows('Ano de construção',list.map(p=>`<strong>${p.lotConfirmed?dossierNumber(p.buildingSection?.items?.find(item=>/ano de construção/i.test(item.label))?.value) || '—':'—'}</strong>${p.lotConfirmed?'':'<small>Confirme o prédio</small>'}`))}`;
      }
      if (topic==='entorno') {
        const green=list.map(p=>getDossierGreen(p));
        content=`<div class="vc-insight"><span class="vx-kicker">A vida além da porta</span><strong style="font-family:var(--font-display);font-size:28px">O bairro também conta.</strong><p>Verde, orientação e movimento ao redor.</p></div>${rows('Índice verde',green.map(g=>`<strong>${g.score ?? '—'}<small style="display:inline">/100</small></strong><small>${g.label}</small>`),true)}${rows('Orientação anunciada',list.map(p=>`<strong class="vc-text-value">${dossierText(getDossierClimate(p).sun)}</strong><small>${dossierText(getDossierClimate(p).face)}</small>`))}${rows('Registros de obra em 150 m',list.map(p=>`<strong>${dossierNumber(p.worksSection?.items?.[0]?.value) ?? '—'}</strong><small>Desde 2017</small>`))}${rows('Ocorrências por mil moradores',list.map(p=>`<strong>${p.securitySection?.ratePer1k?.toLocaleString('pt-BR') ?? '—'}</strong><small>Últimos 12 meses</small>`))}<p class="vc-note">Índice verde: cenário do protótipo · Obras: Prefeitura do Recife · Ocorrências: SDS-PE / Crime Brasil e IBGE.</p>`;
      }
      const available=PROPERTIES.filter(p=>p.modality===list[0]?.modality);
      container.innerHTML=`<div class="vx-page" style="--vc-cols:${count}"><div class="vx-topline"><span class="vx-kicker">Lado a lado</span><button class="vx-link" onclick="switchView('saved')">Meus salvos ${dossierIcon('arrow',14)}</button></div><header class="vx-head"><h1>Compare suas opções.</h1><p>Veja o que muda na sua escolha.</p></header><div class="vc-controls"><div class="vx-segments" role="group" aria-label="Modalidade dos imóveis">${[['Alugar','Alugar'],['Comprar','Comprar']].map(([value,label])=>`<button id="vc-mode-${value}" aria-pressed="${list[0]?.modality===value}" onclick="setCompareModality('${value}')">${label}</button>`).join('')}</div>${available.length>=3?`<button class="vx-link" id="vc-third" aria-pressed="${count===3}" onclick="toggleCompareThirdCol()">${dossierIcon(count===3?'close':'plus',14)} ${count===3?'3º imóvel':'3º imóvel'}</button>`:''}</div>${count===3?'<p class="vc-note">Deslize para ver as três opções.</p>':''}<div class="vc-scroll" ${count===3?'tabindex="0" role="region" aria-label="Comparação de três imóveis, role horizontalmente"':''}><div class="vc-canvas ${count===3?'is-three':''}"><div class="vc-columns">${list.map((p,i)=>`<article class="vc-home"><img class="vc-home-photo" src="${dossierText(p.image)}" alt="${dossierText(journeyName(p))}"/><div class="vc-home-info"><label for="vc-slot-${i}">Imóvel ${i+1}</label><select id="vc-slot-${i}" onchange="setCompareSlot(${i},this.value)">${available.map(opt=>`<option value="${opt.id}" ${opt.id===p.id?'selected':''}>${dossierText(opt.neighborhood)}</option>`).join('')}</select><p>${p.areaM2} m² · ${p.bedrooms} quartos</p><button class="vx-link" onclick="switchView('dossier','${p.id}')">Ver dossiê ${dossierIcon('arrow',12)}</button></div></article>`).join('')}</div><div class="vx-segments vc-topics" role="tablist" aria-label="O que comparar">${[['custo','Custo'],['espaco','Espaço'],['entorno','Entorno']].map(([key,label])=>`<button id="vc-topic-${key}" role="tab" aria-selected="${topic===key}" tabindex="${topic===key?0:-1}" aria-controls="vc-panel" onclick="setComparisonTopic('${key}')" onkeydown="journeyTabKeys(event,'compare')">${label}</button>`).join('')}</div><div class="vx-surface vc-panel" id="vc-panel" role="tabpanel" aria-labelledby="vc-topic-${topic}">${content}</div></div></div><div class="vx-after"><button class="vx-primary" onclick="openVisitPicker()">Escolher para visitar ${dossierIcon('arrow',16)}</button></div></div>`;
      const badge=document.getElementById('compareCountBadge'); if (badge) badge.textContent=String(count);
    }

    function closeDrawer() {
      const bd = document.getElementById('drawerBackdrop');
      if (bd) bd.classList.remove('open');
      const panel = document.getElementById('drawerPanel');
      if (panel?.classList.contains('ds-sheet')) {
        panel.classList.remove('ds-sheet');
        panel.removeAttribute('role'); panel.removeAttribute('aria-modal'); panel.removeAttribute('aria-labelledby');
        const target = window.__dossierTrigger?.isConnected ? window.__dossierTrigger : document.getElementById('ds-tab-' + DOSSIER.category);
        target?.focus({ preventScroll: true });
        window.__dossierTrigger = null;
      }
    }

      showToast('Item marcado como contestado e enviado para revisão');
      renderDossier();
    }

      if (!STATE.discardedProps[propId]) {
        STATE.discardedProps[propId] = reason;
        awardCredit(`Feedback de descarte (${getProp(propId).neighborhood})`);
      }
      closeDrawer();
      switchView('explore');

    function openNegotiationDrawer(propId) {
      const p = getProp(propId);
      const panel = document.getElementById('drawerPanel');
      const bd = document.getElementById('drawerBackdrop');
      if (!panel || !bd) return;

      const q1 = p.visitQuestions[0]?.text.split('.')[0] || 'as taxas reais do condomínio';
      const q2 = p.visitQuestions[1]?.text.split('.')[0] || 'a posição da vaga de garagem';
      const msg = `Olá, vi o apartamento da ${p.address.split('·')[0].trim()}, em ${p.neighborhood}, e gostaria de agendar uma visita. Antes, você poderia confirmar ${q1.toLowerCase()} e ${q2.toLowerCase()}? Obrigado.`;

      panel.innerHTML = `

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
