              type="button"
              class="ed-btn-secondary"
              style="text-align:left;justify-content:flex-start;padding:10px 12px;font-size:12.5px;"
              onclick="confirmDiscard('${p.id}', '${reason}')"
            >
              ${reason}
            </button>
          `).join('')}
        </div>
      `;
      bd.classList.add('open');
    }

    function confirmDiscard(propId, reason) {
      if (!STATE.discardedProps[propId]) {
        STATE.discardedProps[propId] = reason;
        awardCredit(`Feedback de descarte (${getProp(propId).neighborhood})`);
      }
      closeDrawer();
      switchView('explore');
    }

    function openFullMapSheet(propId) {
      const p = getProp(propId);
      const panel = document.getElementById('drawerPanel');
      const bd = document.getElementById('drawerBackdrop');
      if (!panel || !bd) return;

      panel.innerHTML = `
        <div class="sheet-handle"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <span class="ed-kicker">MAPA AMPLO DO LOTE (T5)</span>
          <button type="button" class="ed-btn-secondary" style="padding:4px 8px;font-size:11.5px;" onclick="closeDrawer()">✕</button>
        </div>

        <h3 class="ed-title-md" style="margin-bottom:3px;">${p.address.split('·')[0].trim()}</h3>
        <p style="font-size:12px;color:#57534E;margin-bottom:10px;">
          Polígono oficial DSQFL ${p.dsqfl} com raio de 500 m
        </p>

        <div style="position:relative;border-radius:12px;overflow:hidden;border:1px solid #DFD5C5;background:#ECE4D4;height:240px;margin-bottom:14px;">
          <svg viewBox="0 0 400 240" width="100%" height="100%" style="display:block;">
            <defs>
              <pattern id="fullMapGrid" width="24" height="24" patternUnits="userSpaceOnUse">
                <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(23,23,23,0.06)" stroke-width="1"/>
              </pattern>
            </defs>
            <rect width="400" height="240" fill="url(#fullMapGrid)"/>
            <rect x="20" y="20" width="100" height="70" rx="5" fill="#E2D9C5" stroke="#D2C7B2"/>
            <rect x="140" y="20" width="130" height="70" rx="5" fill="#E2D9C5" stroke="#D2C7B2"/>
            <rect x="290" y="20" width="90" height="70" rx="5" fill="#E2D9C5" stroke="#D2C7B2"/>
            <rect x="20" y="110" width="100" height="110" rx="5" fill="#E2D9C5" stroke="#D2C7B2"/>
            <rect x="140" y="110" width="130" height="110" rx="5" fill="#E6DEC8" stroke="#C8BCA4"/>
            <rect x="290" y="110" width="90" height="110" rx="5" fill="#E2D9C5" stroke="#D2C7B2"/>

            <circle cx="205" cy="155" r="76" fill="rgba(46,90,133,0.06)" stroke="#2E5A85" stroke-width="1.2" stroke-dasharray="4 4"/>
            <polygon points="182,120 228,120 228,188 182,188" fill="rgba(46,90,133,0.24)" stroke="#2E5A85" stroke-width="2.2"/>
            <circle cx="205" cy="155" r="14" fill="rgba(244,119,69,0.25)"/>
            <circle cx="205" cy="155" r="7" fill="#F47745" stroke="#FFFFFF" stroke-width="2"/>
          </svg>
        </div>

        <div style="font-size:12px;color:#57534E;line-height:1.45;margin-bottom:12px;">
          Base cartográfica municipal SIRGAS 2000 integrada ao Modelo Digital LiDAR e alvarás de obras num raio de 150 m.
        </div>

        <button type="button" class="ed-btn-ink" style="width:100%;" onclick="closeDrawer()">
          Fechar mapa
        </button>
      `;
      bd.classList.add('open');
    }

    function openNegotiationDrawer(propId) {
      const p = getProp(propId);
      const panel = document.getElementById('drawerPanel');
      const bd = document.getElementById('drawerBackdrop');
      if (!panel || !bd) return;

      const q1 = p.visitQuestions[0]?.text.split('.')[0] || 'as taxas reais do condomínio';
      const q2 = p.visitQuestions[1]?.text.split('.')[0] || 'a posição da vaga de garagem';
      const msg = `Olá, vi o apartamento da ${p.address.split('·')[0].trim()}, em ${p.neighborhood}, e gostaria de agendar uma visita. Antes, você poderia confirmar ${q1.toLowerCase()} e ${q2.toLowerCase()}? Obrigado.`;

      panel.innerHTML = `
        <div class="sheet-handle"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <span class="ed-kicker">MENSAGEM PARA O CORRETOR</span>
          <button type="button" class="ed-btn-secondary" style="padding:4px 8px;font-size:11.5px;" onclick="closeDrawer()">✕</button>
        </div>

        <h3 class="ed-title-md" style="margin-bottom:3px;">Contato via WhatsApp</h3>
        <p style="font-size:12px;color:#57534E;margin-bottom:12px;">
          Mensagem objetiva construída a partir dos achados do dossiê:
        </p>

        <textarea
          id="drawerNegotiationText"
          rows="4"
          style="width:100%;padding:11px;border-radius:10px;border:1px solid #DFD5C5;background:#FAF7F0;font-family:var(--font-sans);font-size:13px;line-height:1.45;color:#171717;margin-bottom:12px;"
        >${msg}</textarea>

        <div style="display:flex;gap:8px;">
          <button
            type="button"
            class="btn-scanner-primary"
            style="flex:1;"
            onclick="copyText(document.getElementById('drawerNegotiationText').value, 'Mensagem copiada para a área de transferência')"
          >
            <span>Copiar mensagem</span>
          </button>
          <a
            href="https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}"
            target="_blank"
            rel="noopener"
            class="ed-btn-secondary"
            style="background:#FFFFFF;text-decoration:none;"
          >
            Abrir WhatsApp ↗
          </a>
        </div>
      `;
      bd.classList.add('open');
    }

    // =========================================================================
    // CADERNO DE DECISÃO (DOSSIÊS SALVOS)
    // =========================================================================
    function toggleSaveProp(propId) {
      const idx = STATE.savedIds.indexOf(propId);
      if (idx >= 0) {
        STATE.savedIds.splice(idx, 1);
        showToast('Removido dos salvos');
      } else {
        STATE.savedIds.push(propId);
        showToast('Salvo no caderno de decisão');
      }
      if (STATE.currentView === 'explore') renderExplore();
      if (STATE.currentView === 'dossier') renderDossier();
      if (STATE.currentView === 'saved') renderSaved();
    }

    function saveNote(propId, val) {
      STATE.savedNotes[propId] = val;
      showToast('Anotação salva');
    }

    function renderSaved() {
      const container = document.getElementById('savedContainer');
      if (!container) return;
      const savedProps = STATE.savedIds.map(id => getProp(id));

      container.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;">
          <div>
            <h1 class="ed-title-lg">Dossiês Salvos (${savedProps.length})</h1>
            <p style="font-size:12.5px;color:var(--ink-secondary);margin-top:2px;">Seu caderno pessoal de comparação e notas.</p>
          </div>
          <button class="ed-btn-secondary" style="padding:7px 11px;font-size:12px;" onclick="switchView('compare')">
            Comparar →
          </button>
        </div>

        <div class="ed-stack">
          ${savedProps.map(p => `
            <article class="ed-card" style="padding:14px 15px;">
              <div style="display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center;margin-bottom:10px;">
                <img
                  src="${p.image}"
                  alt="${p.title}"
                  style="width:88px;height:68px;object-fit:cover;border-radius:9px;cursor:pointer;"
                  onclick="switchView('dossier', '${p.id}')"
                />
                <div>
                  <div style="font-size:11px;font-weight:600;color:#C84616;">${p.neighborhood} · ${p.city}</div>
                  <h3 style="font-family:var(--font-display);font-size:15px;font-weight:500;color:#171717;line-height:1.25;margin-top:2px;cursor:pointer;" onclick="switchView('dossier', '${p.id}')">
                    ${p.title.split('·')[0].trim()}
                  </h3>
                  <div class="ed-num" style="font-size:12px;color:#57534E;margin-top:2px;">
                    ${formatBRL(p.announcedValue)}${p.modality === 'Alugar' ? '/mês' : ''} · ${p.areaM2} m²
                  </div>
                </div>
              </div>

              <input
                type="text"
                value="${(STATE.savedNotes[p.id] || '').replace(/"/g, '&quot;')}"
                placeholder="Anotação pessoal sobre este imóvel..."
                onchange="saveNote('${p.id}', this.value)"
                style="width:100%;padding:8px 11px;border-radius:9px;border:1px solid #DFD5C5;background:#FAF7F0;font-family:var(--font-sans);font-size:12px;color:#171717;margin-bottom:10px;"
              />

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <button class="ed-btn-ink" style="padding:8px 11px;font-size:12px;" onclick="switchView('dossier', '${p.id}')">
                  Abrir dossiê
                </button>
                <button class="ed-btn-secondary" style="padding:8px 11px;font-size:12px;" onclick="openNegotiationDrawer('${p.id}')">
                  WhatsApp
                </button>
              </div>
            </article>
          `).join('')}
        </div>
      `;
    }

    // =========================================================================
    // INICIALIZAÇÃO DA APLICAÇÃO
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      updateCreditsBadges();
      renderExplore();
      renderDossier();
      renderCompare();
      renderLiveVisit();
      renderSaved();
    });

  </script>
</body>
</html>
